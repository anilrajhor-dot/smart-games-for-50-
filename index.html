/* SMART 50+ — Game 9: Household Manager (practical budgeting, no personal financial advice) */
(function () {
  'use strict';
  var S50 = window.S50;
  var U = S50.U, h = U.h, t = S50.t, UI = S50.UI, Store = S50.Store;

  var CATS = [
    { k: 'food', icon: '🍚', pct: 25, essential: true },
    { k: 'electricity', icon: '💡', pct: 6, essential: true },
    { k: 'travel', icon: '🚌', pct: 8 },
    { k: 'medicine', icon: '💊', pct: 7, essential: true },
    { k: 'entertainment', icon: '🎬', pct: 7 },
    { k: 'gifts', icon: '🎁', pct: 5 },
    { k: 'household', icon: '🧹', pct: 17 },
    { k: 'savings', icon: '🏦', pct: 25 }
  ];
  var EVENTS = [
    { k: 'evRepair', type: 'cost', min: 2500, max: 6000, emergency: true },
    { k: 'evPhone', type: 'cost', min: 1500, max: 4000, emergency: true },
    { k: 'evWedding', type: 'cost', min: 3000, max: 8000, emergency: false },
    { k: 'evGuests', type: 'cost', min: 2000, max: 5000, emergency: false },
    { k: 'evCheckup', type: 'cost', min: 1500, max: 4000, emergency: true },
    { k: 'evSchool', type: 'cost', min: 2000, max: 6000, emergency: false },
    { k: 'evPlumber', type: 'cost', min: 1000, max: 3000, emergency: true },
    { k: 'evFestival', type: 'cost', min: 2000, max: 6000, emergency: false },
    { k: 'evPower', type: 'power', min: 500, max: 1500 },
    { k: 'evIncome', type: 'income', min: 3000, max: 8000 }
  ];
  var STEP = 500, MONTHS = 4;

  function r500(n) { return Math.max(0, Math.round(n / STEP) * STEP); }

  function start() {
    var income = U.randInt(8, 24) * 5000;
    var plan = {};
    var base = {};
    var sum = 0;
    CATS.forEach(function (c) { plan[c.k] = r500(income * c.pct / 100); sum += plan[c.k]; });
    plan.savings += income - sum;
    CATS.forEach(function (c) { base[c.k] = plan[c.k]; });
    var reserve0 = r500(income * 1.5);
    var st = { month: 0, reserve: reserve0, total: 0, good: 0, savingsKept: 0 };
    function ofType(type) { return EVENTS.filter(function (e) { return e.type === type; }); }
    // Two surprise costs and a bill increase in random order; the income drop is always the final, hardest month.
    var events = U.shuffle(U.sample(ofType('cost'), MONTHS - 2).concat(ofType('power'))).concat(ofType('income'));

    var body = UI.screen({ title: t('games.household.name'), icon: S50.GAME_ICON.household, cat: 'life', back: 'games/life' });
    var wrap = h('div', { class: 'quiz' });
    body.appendChild(wrap);
    wrap.appendChild(h('div', { class: 'card' },
      h('div', { class: 'big-emoji', attrs: { 'aria-hidden': 'true' }, text: '🏠💰' }),
      h('p', { class: 'lead', text: t('household.intro') }),
      h('p', { class: 'stop-meta', text: t('household.income') + ': ' + U.money(income) }),
      h('p', { class: 'stop-meta', text: t('household.reserve') + ': ' + U.money(reserve0) }),
      h('p', { class: 'disclaimer', text: t('household.disclaimer') }),
      h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: '▶ ' + t('common.start'), on: { click: function () { month(); } } })));

    function month() {
      if (st.month >= MONTHS) return finish();
      var ev = events[st.month];
      var amt = r500(U.randInt(ev.min, ev.max));
      var monthIncome = ev.type === 'income' ? income - amt : income;
      var cur = {};
      CATS.forEach(function (c) { cur[c.k] = plan[c.k]; });
      var minEss = {};
      CATS.forEach(function (c) { if (c.essential) minEss[c.k] = base[c.k]; });
      if (ev.type === 'power') { cur.electricity += amt; minEss.electricity = base.electricity + amt; }
      var surprise = ev.type === 'cost' ? amt : 0;
      var useReserve = false;

      U.clear(wrap);
      wrap.appendChild(UI.progressBar(st.month + 1, MONTHS, t('household.event', { n: st.month + 1, total: MONTHS })));
      var card = h('div', { class: 'card budget' });
      card.appendChild(h('div', { class: 'event-box' }, h('span', { class: 'event-icon', attrs: { 'aria-hidden': 'true' }, text: ev.type === 'income' ? '📉' : ev.type === 'power' ? '⚡' : '🔧' }),
        h('p', { class: 'lead', text: t('household.' + ev.k, { amt: U.money(amt) }) })));
      card.appendChild(h('p', { class: 'hint', text: t('household.adjust') }));
      var rows = h('div', { class: 'budget-rows' });
      var summary = h('div', { class: 'budget-summary' });
      var confirm = h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: '✓ ' + t('household.confirm') });
      var reserveBtn = null;

      function spent() {
        var s = surprise && !useReserve ? surprise : 0;
        CATS.forEach(function (c) { s += cur[c.k]; });
        return s;
      }
      function draw() {
        U.clear(rows);
        CATS.forEach(function (c) {
          var row = h('div', { class: 'brow' + (c.essential ? ' essential' : '') },
            h('span', { class: 'brow-name', text: c.icon + ' ' + t('household.cat.' + c.k) }),
            h('button', { class: 'pm', type: 'button', text: '−', attrs: { 'aria-label': '− ' + t('household.cat.' + c.k) }, disabled: cur[c.k] <= 0,
              on: { click: function () { cur[c.k] = Math.max(0, cur[c.k] - STEP); S50.Sound.play('tap'); draw(); } } }),
            h('span', { class: 'brow-amt', text: U.money(cur[c.k]) }),
            h('button', { class: 'pm', type: 'button', text: '+', attrs: { 'aria-label': '+ ' + t('household.cat.' + c.k) },
              on: { click: function () { cur[c.k] += STEP; S50.Sound.play('tap'); draw(); } } }));
          rows.appendChild(row);
        });
        if (surprise) {
          rows.appendChild(h('div', { class: 'brow surprise' + (useReserve ? ' covered' : '') },
            h('span', { class: 'brow-name', text: '❗ ' + t('household.cat.surprise') }),
            h('span', { class: 'brow-amt', text: useReserve ? '✓ ' + U.money(0) : U.money(surprise) })));
        }
        var s = spent();
        var left = monthIncome - s;
        U.clear(summary);
        summary.appendChild(h('div', { class: 'sum-line' }, h('span', { text: t('household.income') }), h('strong', { text: U.money(monthIncome) })));
        summary.appendChild(h('div', { class: 'sum-line' }, h('span', { text: t('household.spent') }), h('strong', { text: U.money(s) })));
        summary.appendChild(h('div', { class: 'sum-line ' + (left >= 0 ? 'ok' : 'bad') },
          h('span', { text: left >= 0 ? t('household.left') : t('household.over') }), h('strong', { text: (left >= 0 ? '' : '⚠ ') + U.money(Math.abs(left)) })));
        summary.appendChild(h('div', { class: 'sum-line' }, h('span', { text: '🛟 ' + t('household.reserve') }), h('strong', { text: U.money(st.reserve - (useReserve ? surprise : 0)) })));
        if (left >= 0) summary.appendChild(h('p', { class: 'balanced', text: t('household.balanced') }));
        confirm.disabled = left < 0;
        if (reserveBtn) {
          reserveBtn.classList.toggle('on', useReserve);
          reserveBtn.setAttribute('aria-pressed', useReserve ? 'true' : 'false');
          reserveBtn.textContent = (useReserve ? '✓ ' : '🛟 ') + t('household.useReserve') + ' (' + U.money(surprise) + ')';
        }
      }
      card.appendChild(rows);
      if (surprise && st.reserve >= surprise) {
        reserveBtn = h('button', { class: 'toggle reserve-btn', type: 'button', attrs: { 'aria-pressed': 'false' }, on: { click: function () { useReserve = !useReserve; draw(); } } });
        card.appendChild(reserveBtn);
      }
      card.appendChild(summary);
      card.appendChild(confirm);
      wrap.appendChild(card);
      draw();
      confirm.addEventListener('click', function () { evaluate(ev, cur, minEss, monthIncome, useReserve, surprise); });
    }

    function evaluate(ev, cur, minEss, monthIncome, usedReserve, surprise) {
      var msgs = [];
      var essOk = 0, essN = 0;
      Object.keys(minEss).forEach(function (k) { essN += 1; if (cur[k] >= minEss[k] * 0.9) essOk += 1; });
      var score = Math.round(40 * essOk / essN);
      if (essOk < essN) msgs.push(t('household.fb.essentials'));
      if (cur.medicine < minEss.medicine * 0.9) { score -= 10; msgs.push(t('household.fb.medicine')); }
      var saveTarget = income * 0.1;
      score += Math.round(30 * Math.min(1, cur.savings / saveTarget));
      if (cur.savings < saveTarget) msgs.push(t('household.fb.noSave'));
      if (usedReserve) {
        st.reserve -= surprise;
        if (ev.emergency) { score += 15; msgs.push(t('household.fb.reserveUsed')); } else score += 5;
      } else score += 15;
      var reserveFrac = st.reserve / reserve0;
      score += Math.round(15 * Math.min(1, reserveFrac / 0.5));
      if (reserveFrac < 0.5) msgs.push(t('household.fb.reserveLow'));
      score = Math.max(0, Math.min(100, score));
      if (!msgs.length || score >= 90) msgs.unshift(t('household.fb.great'));
      // Leftover money goes back into the emergency fund.
      var spentNow = (usedReserve ? 0 : surprise);
      CATS.forEach(function (c) { spentNow += cur[c.k]; });
      st.reserve += Math.max(0, monthIncome - spentNow);
      st.savingsKept += cur.savings;
      st.total += score;
      var good = score >= 70;
      if (good) st.good += 1;
      Store.recordAnswer('life', good);
      S50.Sound.play(good ? 'correct' : 'wrong');
      CATS.forEach(function (c) { if (c.k !== 'electricity') plan[c.k] = cur[c.k]; });
      U.clear(wrap);
      wrap.appendChild(UI.progressBar(st.month + 1, MONTHS, t('household.event', { n: st.month + 1, total: MONTHS })));
      var nb = h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: st.month + 1 >= MONTHS ? t('common.finish') : t('common.next'), on: { click: function () { st.month += 1; month(); } } });
      wrap.appendChild(h('div', { class: 'card' }, h('div', { class: 'feedback ' + (good ? 'fb-good' : 'fb-soft') },
        h('div', { class: 'fb-head' }, h('strong', { text: (good ? '✓ ' : '◐ ') + score + ' / 100' }), h('span', { class: 'fb-points', text: t('common.points', { n: Math.round(score * 2.5) }) })),
        h('ul', { class: 'clues' }, msgs.map(function (m) { return h('li', { text: m }); })),
        h('p', { class: 'stop-meta', text: '🛟 ' + t('household.reserve') + ': ' + U.money(st.reserve) })), nb));
      nb.focus();
    }

    function finish() {
      if (st.total >= MONTHS * 80) Store.flag('budgetExpert');
      UI.complete({ gameId: 'household', title: t('games.household.name'), cat: 'life', score: Math.round(st.total * 2.5), correct: st.good, total: MONTHS }, {
        back: 'games/life',
        extra: h('p', { class: 'complete-bonus', text: t('household.summary', { n: MONTHS, s: U.money(st.savingsKept), r: U.money(st.reserve) }) })
      });
    }
  }

  S50.Games.register({ id: 'household', cat: 'life', start: start });
})();

  <script>
/* SMART 50+ — games built on the shared quiz runner:
 * Life Experience Challenge, Everyday Grandmaster, Spot the Scam, Then & Now,
 * Finish the Memory, Missing Information, Words From My Childhood. */
(function () {
  'use strict';
  var S50 = window.S50;
  var U = S50.U, h = U.h, t = S50.t;
  var Bank = S50.Bank, UI = S50.UI, App = S50.App;

  function hasTag(tag) { return function (r) { return (r.t || []).indexOf(tag) >= 0; }; }
  function title(id) { return t('games.' + id + '.name'); }

  /* Draw n items: first from the preferred filter, then top up from the fallback filter. */
  function drawWithFallback(cat, n, prefer, fallback, sort) {
    var first = Bank.draw(cat, n, { filter: prefer, sort: sort });
    if (first.length >= n) return first;
    var ids = first.map(function (x) { return x.id; });
    var more = Bank.draw(cat, n - first.length, { filter: function (r) { return fallback(r) && ids.indexOf(r.id) < 0; }, sort: sort });
    return first.concat(more);
  }

  function simpleGame(id, cat, n, filter, extra) {
    S50.Games.register({
      id: id, cat: cat,
      start: function () {
        var items = Bank.draw(cat, n, { filter: filter, sort: true });
        UI.runQuiz(Object.assign({ gameId: id, title: title(id), icon: S50.GAME_ICON[id], cat: cat, items: items }, extra || {}));
      }
    });
  }

  simpleGame('lifeexp', 'life', 10, hasTag('exp'));
  simpleGame('grandmaster', 'life', 8, hasTag('gm'));
  simpleGame('scam', 'safety', 10, null, { timeLimit: 60 });
  simpleGame('finish', 'nostalgia', 10, hasTag('finish'));
  simpleGame('missing', 'reasoning', 10, hasTag('missing'));

  /* ---------- Then & Now: choose a decade first ---------- */
  var DECADES = ['1960s', '1970s', '1980s', '1990s', '2000s', 'today', 'all'];
  S50.Games.register({
    id: 'thennow', cat: 'nostalgia',
    start: function (p) {
      var dec = DECADES.indexOf(p[0]) >= 0 ? p[0] : null;
      if (!dec) {
        var body = UI.screen({ title: title('thennow'), icon: S50.GAME_ICON.thennow, cat: 'nostalgia', back: 'games/nostalgia' });
        body.appendChild(h('p', { class: 'lead', text: t('thennow.pick') }));
        body.appendChild(h('div', { class: 'decade-grid' }, DECADES.map(function (d) {
          var label = d === 'all' ? t('thennow.all') : d === 'today' ? t('thennow.today') : d;
          var icon = { '1960s': '📻', '1970s': '🎞️', '1980s': '📺', '1990s': '📟', '2000s': '💿', today: '📱', all: '🕰️' }[d];
          return h('a', { class: 'decade-card', href: '#/game/thennow/' + d },
            h('span', { class: 'decade-icon', attrs: { 'aria-hidden': 'true' }, text: icon }),
            h('span', { class: 'decade-name', text: label }));
        })));
        return;
      }
      var tn = hasTag('thennow');
      var items = drawWithFallback('nostalgia', 10, function (r) { return tn(r) && (dec === 'all' || r.dec === dec); }, tn, false);
      UI.runQuiz({ gameId: 'thennow', title: title('thennow') + (dec !== 'all' ? ' · ' + (dec === 'today' ? t('thennow.today') : dec) : ''),
        icon: S50.GAME_ICON.thennow, cat: 'nostalgia', items: items, back: 'game/thennow' });
    }
  });

  /* ---------- Words From My Childhood: general or regional words ---------- */
  var REGIONS = ['hindi', 'punjabi', 'bengali', 'marathi', 'gujarati', 'tamil', 'telugu', 'kannada', 'malayalam', 'odia'];
  S50.Games.register({
    id: 'words', cat: 'nostalgia',
    start: function (p) {
      var set = p[0] === 'general' || p[0] === 'regional' || REGIONS.indexOf(p[0]) >= 0 ? p[0] : null;
      if (!set) {
        var body = UI.screen({ title: title('words'), icon: S50.GAME_ICON.words, cat: 'nostalgia', back: 'games/nostalgia' });
        body.appendChild(h('p', { class: 'lead', text: t('words.pick') }));
        body.appendChild(h('a', { class: 'decade-card wide', href: '#/game/words/general' },
          h('span', { class: 'decade-icon', attrs: { 'aria-hidden': 'true' }, text: '📮' }), h('span', { class: 'decade-name', text: t('words.general') })));
        body.appendChild(h('a', { class: 'decade-card wide', href: '#/game/words/regional' },
          h('span', { class: 'decade-icon', attrs: { 'aria-hidden': 'true' }, text: '🇮🇳' }), h('span', { class: 'decade-name', text: t('words.regional') + ' — ' + t('thennow.all') })));
        body.appendChild(h('h2', { class: 'section-title', text: t('words.regional') }));
        body.appendChild(h('div', { class: 'chip-row' }, REGIONS.map(function (r) {
          return h('a', { class: 'chip chip-big', href: '#/game/words/' + r, text: t('regions.' + r) });
        })));
        body.appendChild(h('p', { class: 'hint', text: t('words.note') }));
        return;
      }
      var w = hasTag('words');
      var prefer = set === 'general' ? function (r) { return w(r) && r.region === 'general'; }
        : set === 'regional' ? function (r) { return w(r) && r.region !== 'general'; }
          : function (r) { return w(r) && r.region === set; };
      var items = drawWithFallback('nostalgia', 8, prefer, w, false);
      UI.runQuiz({ gameId: 'words', title: title('words'), icon: S50.GAME_ICON.words, cat: 'nostalgia', items: items, back: 'game/words',
        beforeQuestion: function (item, wrap) {
          var r = item.raw.region;
          if (r && r !== 'general') wrap.appendChild(h('p', { class: 'region-tag', text: '🗣 ' + t('regions.' + r) }));
        } });
    }
  });
})();
