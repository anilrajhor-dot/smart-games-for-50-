      ['प्रिय ग्राहक, आपके डेबिट कार्ड का KYC बाकी है। कार्ड चालू रखने के लिए इस चैट पर कार्ड के दोनों तरफ़ की फ़ोटो और PIN भेजें।', 'चैट में हरा निशान या आधिकारिक-सा नाम कुछ साबित नहीं करता। कार्ड की फ़ोटो या PIN कभी न भेजें।']),
    S('S27', 2, 'email', 'prize@intl-lottery-uk.example', true, ['prize', 'payment', 'sender'],
      ['You have been selected as the winner of the International E-mail Lottery 2025 of US$ 950,000. Send your full name, address, bank details and a transfer fee of $200.', 'Nobody wins a lottery they did not enter. The request for bank details and a fee confirms it.'],
      ['आपको अंतरराष्ट्रीय ई-मेल लॉटरी 2025 में 9,50,000 अमेरिकी डॉलर का विजेता चुना गया है। अपना पूरा नाम, पता, बैंक विवरण और $200 ट्रांसफ़र फ़ीस भेजें।', 'जिस लॉटरी में भाग ही नहीं लिया, उसे कोई नहीं जीतता। बैंक विवरण और फ़ीस की माँग इसकी पुष्टि करती है।']),
    S('S28', 2, 'sms', 'JD-SHYGBK', false, ['official', 'info'],
      ['Reminder: Never share your OTP, PIN or password with anyone. Sahyog Bank will never call or message you asking for them.', 'A safety reminder that asks for nothing. Banks do send such awareness messages.'],
      ['याद रखें: अपना OTP, PIN या पासवर्ड किसी को न बताएँ। सहयोग बैंक कभी फ़ोन या संदेश करके इन्हें नहीं माँगेगा।', 'एक सुरक्षा याद-दिहानी जिसमें कुछ नहीं माँगा गया। बैंक ऐसे जागरूकता संदेश भेजते हैं।']),
    S('S29', 3, 'call', 'Nephew (voice)', true, ['emotion', 'secrecy', 'urgency'],
      ['A voice that sounds like your nephew: “Chachi, I had a small accident. Please send ₹30,000 to my friend’s UPI. Don’t tell Papa, he will be angry.”', 'Voices can be faked and stories invented. Secrecy and urgency are the warning signs — verify by calling his parents.'],
      ['भतीजे जैसी आवाज़: “चाची, मेरा छोटा-सा एक्सीडेंट हो गया। मेरे दोस्त के UPI पर ₹30,000 भेज दो। पापा को मत बताना, नाराज़ होंगे।”', 'आवाज़ नक़ली हो सकती है और कहानी गढ़ी हुई। गोपनीयता और जल्दबाज़ी चेतावनी हैं — उसके माता-पिता को फ़ोन करके पुष्टि करें।']),
    S('S30', 3, 'email', 'hr@global-careers-hiring.example', true, ['job', 'payment', 'sender'],
      ['Dear Candidate, you are selected for a Work-From-Home Data Entry job, salary ₹45,000/month. Kindly deposit ₹3,500 for laptop security to receive your offer letter.', 'Genuine employers never charge candidates to get a job or an offer letter.'],
      ['प्रिय उम्मीदवार, आपको घर से डेटा एंट्री की नौकरी के लिए चुना गया है, वेतन ₹45,000/माह। ऑफ़र लेटर पाने के लिए लैपटॉप सिक्योरिटी के ₹3,500 जमा करें।', 'असली नियोक्ता नौकरी या ऑफ़र लेटर के लिए उम्मीदवार से पैसे नहीं लेते।']),
    S('S31', 3, 'sms', 'VK-FASTAG', true, ['link', 'urgency', 'kyc'],
      ['Your vehicle tag will be blacklisted tonight. Complete KYC at http://tag-kyc-now.in to avoid double toll charges.', 'An unknown link and a “tonight” deadline. Update vehicle tags only through your bank or official app.'],
      ['आपका वाहन टैग आज रात ब्लैकलिस्ट हो जाएगा। दोगुने टोल से बचने के लिए http://tag-kyc-now.in पर KYC पूरा करें।', 'अनजान लिंक और “आज रात” की समय-सीमा। वाहन टैग केवल अपने बैंक या आधिकारिक ऐप से अपडेट करें।']),
    S('S32', 3, 'social', 'Crypto Wealth Club', true, ['returns', 'payment', 'emotion'],
      ['A friendly person you met online says they made lakhs with a new crypto app and offers to “teach” you. First you must deposit ₹20,000 into the app they share.', 'Online friends who quickly bring up investments and special apps are a known “investment romance” trick.'],
      ['ऑनलाइन मिला एक मिलनसार व्यक्ति कहता है कि उसने एक नए क्रिप्टो ऐप से लाखों कमाए और आपको “सिखाने” की पेशकश करता है। पहले उसके बताए ऐप में ₹20,000 जमा करने होंगे।', 'ऑनलाइन दोस्त जो जल्दी निवेश और ख़ास ऐप की बात करें — यह जाना-माना “निवेश दोस्ती” वाला जाल है।']),
    S('S33', 3, 'call', 'Bank Manager', true, ['otp', 'sender', 'info'],

    S('S34', 3, 'sms', 'AD-HOSPTL', false, ['info', 'expected'],

    S('S35', 3, 'whatsapp', 'Wedding Invite 💌', true, ['link', 'remote', 'sender'],
      ['You are invited! Open the wedding card: “Wedding_Card.apk” (download and install to view).', 'Wedding cards are images or PDFs. A file ending in “.apk” is an app that can take over your phone.'],
      ['आपको निमंत्रण है! शादी का कार्ड खोलें: “Wedding_Card.apk” (देखने के लिए डाउनलोड करके इंस्टॉल करें)।', 'शादी के कार्ड तस्वीर या PDF होते हैं। “.apk” वाली फ़ाइल एक ऐप होती है जो आपका फ़ोन क़ब्ज़े में ले सकती है।']),
    S('S36', 3, 'upi', 'electricity-dept@upi', true, ['collect', 'urgency', 'sender'],

    S('S37', 3, 'email', 'it-helpdesk@yourcompany-mail.example', true, ['link', 'pin', 'urgency'],
      ['Your mailbox is 99% full and will stop working today. Log in at the link below with your password to get extra storage free.', 'Fake “mailbox full” messages are used to collect passwords. Check storage only inside your normal email app.'],

    S('S38', 3, 'sms', 'VM-PRGBNK', false, ['official', 'info'],

    S('S39', 3, 'call', 'Telecom Authority', true, ['fear', 'urgency', 'remote'],
      ['“This is the Telecom Department. Your Aadhaar was used for illegal SIMs. Press 9 to speak to the officer, or all your numbers will be blocked in 2 hours.”', 'Automated threats about your Aadhaar and “press 9” are well-known scam scripts.'],

    S('S40', 3, 'social', 'Free Laptop Yojana 2025', true, ['govt', 'link', 'info'],
      ['Government is giving FREE laptops to all citizens! Fill the form with your Aadhaar, bank account and phone number. Share with 10 groups to activate.', 'Free gifts that need your personal data and “share with 10 groups” are designed to spread and collect information.'],
      ['सरकार सभी नागरिकों को मुफ़्त लैपटॉप दे रही है! अपने आधार, बैंक खाते और फ़ोन नंबर से फ़ॉर्म भरें। चालू करने के लिए 10 ग्रुप में शेयर करें।', 'निजी जानकारी माँगने वाले मुफ़्त उपहार और “10 ग्रुप में शेयर करें” — ये जानकारी जुटाने और फैलने के लिए बनाए जाते हैं।']),
    S('S41', 3, 'whatsapp', 'Amit (friend)', false, ['expected', 'info'],
      ['Hi! Sending you the photos from yesterday’s get-together. Lovely evening. Let us meet again next month!', 'A familiar friend sharing photos after an event you attended — nothing to install, nothing to pay.'],
      ['नमस्ते! कल की मुलाक़ात की तस्वीरें भेज रहा हूँ। बहुत अच्छी शाम थी। अगले महीने फिर मिलते हैं!', 'जान-पहचान का दोस्त, आपके साथ हुए कार्यक्रम की तस्वीरें — न कुछ इंस्टॉल करना, न भुगतान।']),
    S('S42', 2, 'sms', 'BP-REWARD', true, ['prize', 'link', 'urgency'],
      ['Your credit card reward points worth ₹7,850 expire today! Redeem now at http://rewardz-redeem.club', 'Reward point expiry with a strange link is a common card-detail theft trick. Check points only in your official app.'],
      ['आपके क्रेडिट कार्ड के ₹7,850 के रिवॉर्ड पॉइंट आज ख़त्म हो रहे हैं! अभी http://rewardz-redeem.club पर भुनाएँ', 'अजीब लिंक के साथ पॉइंट ख़त्म होने की बात — कार्ड की जानकारी चुराने की आम चाल। पॉइंट केवल आधिकारिक ऐप में देखें।']),
    S('S43', 2, 'call', 'Gas Company', true, ['fear', 'payment', 'urgency'],
      ['“Your gas connection is unsafe and will be cut today. Pay ₹1,200 inspection fee on this number by UPI and our technician will come.”', 'Real gas agencies do not demand UPI payments to personal numbers over the phone.'],

    S('S44', 1, 'sms', 'AX-LIBRRY', false, ['info'],
      ['City Library: The book “Malgudi Days” you borrowed is due for return on 18-Oct. Thank you.', 'A simple reminder from a place you use. It asks for nothing.'],
      ['सिटी लाइब्रेरी: आपकी ली हुई किताब “मालगुडी डेज़” 18-अक्टूबर तक लौटानी है। धन्यवाद।', 'आपकी जानी-पहचानी जगह का सादा अनुस्मारक। इसमें कुछ नहीं माँगा गया।']),
    S('S45', 2, 'whatsapp', '+92 3xx xxx xx11', true, ['prize', 'sender', 'payment'],
      ['Congratulations from the TV quiz show! You won a car and ₹12 lakh. To claim, pay GST of ₹15,000 to our manager.', 'Calls or messages about winning TV shows you never entered, asking for “tax” first, are scams.'],

    S('S46', 3, 'email', 'orders@shopkart-support.example', true, ['link', 'fear', 'sender'],
      ['We have received your order for an iPhone worth ₹1,29,900. If you did not place this order, click here to cancel and enter your card details for refund.', 'Fake “big order” emails scare you into clicking. Check orders only in the shopping app you actually use.'],
      ['हमें ₹1,29,900 के आईफ़ोन का आपका ऑर्डर मिला है। अगर आपने यह ऑर्डर नहीं दिया, तो रद्द करने के लिए यहाँ क्लिक करें और रिफ़ंड के लिए कार्ड की जानकारी भरें।', 'नक़ली “बड़े ऑर्डर” वाले ईमेल डराकर क्लिक करवाते हैं। ऑर्डर केवल उसी शॉपिंग ऐप में देखें जिसे आप सच में इस्तेमाल करते हैं।']),
    S('S47', 1, 'call', 'Unknown caller', true, ['pin', 'sender'],
      ['“Hello uncle, I am calling for a bank survey. To verify you, please tell me your ATM PIN. It is only for our records.”', 'Nobody needs your PIN for a survey or for records. A PIN is for your fingers only.'],
      ['“नमस्ते अंकल, मैं बैंक सर्वे के लिए फ़ोन कर रहा हूँ। आपकी पुष्टि के लिए अपना ATM PIN बता दीजिए, सिर्फ़ रिकॉर्ड के लिए।”', 'सर्वे या रिकॉर्ड के लिए किसी को आपके PIN की ज़रूरत नहीं होती। PIN सिर्फ़ आपकी उँगलियों के लिए है।']),
    S('S48', 2, 'sms', 'VK-TRAINS', false, ['official', 'expected', 'info'],
      ['PNR 4521836790: Train 12951 confirmed, Coach B2 Berth 34. Chart prepared. Happy journey!', 'Booking details for a ticket you bought, with nothing to click or pay.'],
      ['PNR 4521836790: ट्रेन 12951 पक्की, कोच B2 बर्थ 34। चार्ट बन गया है। यात्रा मंगलमय हो!', 'आपके ख़रीदे टिकट का विवरण — न कुछ क्लिक करना, न भुगतान।']),
    S('S49', 3, 'social', 'Charity Help Page', true, ['emotion', 'payment', 'urgency'],
      ['URGENT: A child needs surgery tonight. Please send any amount to this personal UPI ID. Every second counts! 😢', 'Emotional pressure with a personal UPI ID and no verifiable organisation is a warning sign. Donate through known, registered charities.'],
      ['तत्काल: एक बच्चे का आज रात ऑपरेशन है। कृपया इस निजी UPI ID पर जितना हो सके भेजें। हर पल क़ीमती है! 😢', 'भावनात्मक दबाव, निजी UPI ID और कोई सत्यापित संस्था नहीं — चेतावनी का संकेत। दान केवल जानी-मानी, पंजीकृत संस्थाओं को दें।']),
    S('S50', 3, 'call', 'Pension Office', true, ['govt', 'otp', 'fear'],
      ['“Your pension will stop from next month because your life certificate is not updated. I will send an OTP to update it from here — please share it.”', 'Life certificates are updated through proper offices or official services. Never share an OTP with a caller.'],
      ['“आपका जीवन प्रमाण पत्र अपडेट नहीं है, इसलिए अगले महीने से पेंशन रुक जाएगी। यहीं से अपडेट करने के लिए OTP भेजता हूँ — कृपया बता दीजिए।”', 'जीवन प्रमाण पत्र सही दफ़्तर या आधिकारिक सेवाओं से अपडेट होता है। किसी कॉलर को कभी OTP न बताएँ।']),
    S('S51', 2, 'whatsapp', 'Priya (daughter)', false, ['expected', 'info'],
      ['Ma, I have booked your eye check-up for Saturday at 11. I will come to pick you up at 10:30. ❤️', 'Your daughter, on her usual number, sharing a plan — no money or codes involved.'],
      ['माँ, मैंने शनिवार 11 बजे आपकी आँखों की जाँच बुक कर दी है। 10:30 बजे लेने आऊँगी। ❤️', 'आपकी बेटी, अपने हमेशा वाले नंबर से, एक योजना बता रही है — न पैसे, न कोई कोड।']),
    S('S52', 3, 'sms', 'AD-LOANOK', true, ['returns', 'link', 'payment'],
      ['Pre-approved instant loan of ₹3,00,000 at 0% interest! No documents needed. Pay ₹999 file charge at http://easyloan-fast.app to get money in 5 minutes.', 'Instant loans with no checks and an upfront fee are a common trap — and some loan apps misuse your contacts and photos.'],
      ['₹3,00,000 का पहले से मंज़ूर इंस्टेंट लोन, 0% ब्याज पर! कोई दस्तावेज़ नहीं चाहिए। 5 मिनट में पैसे पाने के लिए http://easyloan-fast.app पर ₹999 फ़ाइल चार्ज भरें।', 'बिना जाँच के तुरंत लोन और पहले फ़ीस — यह आम जाल है, और कुछ लोन ऐप आपके संपर्क और फ़ोटो का ग़लत इस्तेमाल भी करते हैं।'])
  ]);

  <script>
/* SMART 50+ — Nostalgia bank: Then & Now (tag "thennow", dec), Words From My Childhood (tag "words", region),
 * Finish the Memory (tag "finish").
 * Copyright note: no song lyrics or long copyrighted text are reproduced. Questions use facts about
 * films, singers and advertising, plus traditional proverbs and public-domain sayings. */
(function () {
  'use strict';
  function Q(id, d, t, extra, en, hi) {
    var it = { id: id, d: d, t: t, a: 0, en: { q: en[0], o: en[1], e: en[2] }, hi: { q: hi[0], o: hi[1], e: hi[2] } };
    Object.keys(extra || {}).forEach(function (k) { it[k] = extra[k]; });
    return it;
  }
  var TN = ['thennow'], W = ['words'], F = ['finish'];
  window.S50.Bank.add('nostalgia', [
    /* ---------- THEN & NOW ---------- */
    Q('N01', 1, TN, { dec: '1960s' }, ['In the 1960s, how did most families hear the news at home?', ['On the radio', 'On a smartphone', 'On satellite TV', 'On the internet'], 'The radio was the heart of the home. Television reached most Indian homes only much later.'],
      ['1960 के दशक में ज़्यादातर परिवार घर पर ख़बरें कैसे सुनते थे?', ['रेडियो पर', 'स्मार्टफ़ोन पर', 'सैटेलाइट टीवी पर', 'इंटरनेट पर'], 'रेडियो घर की जान होता था। टेलीविज़न ज़्यादातर घरों में बहुत बाद में पहुँचा।']),
    Q('N02', 1, TN, { dec: '1960s' }, ['How were letters usually written at home in the 1960s?', ['With a fountain pen and an ink pot', 'On a laptop', 'On a touchscreen', 'By voice typing'], 'Fountain pens were refilled from ink bottles — and blotting paper saved the page from smudges.'],
      ['1960 के दशक में घर पर चिट्ठियाँ आमतौर पर कैसे लिखी जाती थीं?', ['फ़ाउंटेन पेन और दवात से', 'लैपटॉप पर', 'टचस्क्रीन पर', 'बोलकर टाइप करके'], 'फ़ाउंटेन पेन में दवात से स्याही भरी जाती थी — और सोख्ता काग़ज़ लिखावट फैलने से बचाता था।']),
    Q('N03', 1, TN, { dec: '1960s' }, ['What was a common way to keep drinking water cool in summer in the 1960s?', ['A clay pot — matka or surahi', 'A refrigerator in every home', 'A water dispenser', 'An ice machine'], 'Clay pots cool water naturally as a little water seeps out and evaporates.'],
      ['1960 के दशक में गर्मियों में पीने का पानी ठंडा रखने का आम तरीका क्या था?', ['मिट्टी का घड़ा — मटका या सुराही', 'हर घर में फ़्रिज', 'वॉटर डिस्पेंसर', 'बर्फ़ बनाने की मशीन'], 'मिट्टी के बर्तन से थोड़ा पानी रिसकर भाप बनता है, जिससे पानी अपने आप ठंडा रहता है।']),
    Q('N04', 2, TN, { dec: '1960s' }, ['From 1957 the rupee was divided in a new way, still new in the 1960s. How?', ['100 naye paise = 1 rupee', '16 annas = 1 rupee, for the first time', '12 annas = 1 rupee', '1,000 paise = 1 rupee'], 'Earlier 1 rupee was 16 annas. The decimal system brought the “naya paisa”.'],
      ['1957 से रुपये को एक नए तरीके से बाँटा गया, जो 1960 के दशक में भी नया था। कैसे?', ['100 नए पैसे = 1 रुपया', 'पहली बार 16 आने = 1 रुपया', '12 आने = 1 रुपया', '1,000 पैसे = 1 रुपया'], 'पहले 1 रुपया 16 आने का होता था। दशमलव प्रणाली से “नया पैसा” आया।']),
    Q('N05', 1, TN, { dec: '1960s' }, ['In the 1960s, how did people usually find out which film was playing?', ['Posters, newspapers and hand-painted hoardings', 'Mobile apps', 'Streaming menus', 'Email newsletters'], 'Giant hand-painted hoardings were an art form of their own.'],
      ['1960 के दशक में लोगों को कैसे पता चलता था कि कौन-सी फ़िल्म लगी है?', ['पोस्टर, अख़बार और हाथ से बने बड़े होर्डिंग से', 'मोबाइल ऐप से', 'स्ट्रीमिंग मेन्यू से', 'ईमेल से'], 'हाथ से पेंट किए बड़े होर्डिंग अपने आप में एक कला थे।']),
    Q('N06', 2, TN, { dec: '1970s' }, ['In the 1970s, getting a home telephone connection often meant…', ['Waiting a long time — sometimes years', 'Same-day installation', 'Ordering it online', 'Downloading an app'], 'Phone connections were scarce. A phone at home was a matter of pride for the whole street!'],
      ['1970 के दशक में घर पर टेलीफ़ोन कनेक्शन लेने का मतलब अक्सर होता था…', ['लंबा इंतज़ार — कभी-कभी सालों', 'उसी दिन लग जाना', 'ऑनलाइन मँगवाना', 'ऐप डाउनलोड करना'], 'फ़ोन कनेक्शन मुश्किल से मिलते थे। घर में फ़ोन पूरी गली के लिए गर्व की बात होती थी!']),
    Q('N07', 1, TN, { dec: '1970s' }, ['A family in the 1970s wanted photos of a wedding. What did they need?', ['A film camera — and patience while the prints were developed', 'A smartphone', 'A digital photo frame', 'Instant cloud upload'], 'Every click counted, because a roll had only 24 or 36 photos.'],
      ['1970 के दशक में एक परिवार को शादी की तस्वीरें चाहिए थीं। उन्हें क्या चाहिए था?', ['फ़िल्म वाला कैमरा — और प्रिंट बनने तक धैर्य', 'स्मार्टफ़ोन', 'डिजिटल फ़ोटो फ़्रेम', 'तुरंत क्लाउड अपलोड'], 'हर क्लिक क़ीमती था, क्योंकि एक रोल में सिर्फ़ 24 या 36 तस्वीरें होती थीं।']),
    Q('N08', 1, TN, { dec: '1970s' }, ['What did many households keep ready for power cuts in the 1970s?', ['A kerosene lantern or candles', 'A lithium-battery inverter', 'A solar power bank', 'Smart bulbs'], 'The lantern’s glass chimney had to be cleaned regularly — a familiar evening chore.'],
      ['1970 के दशक में बिजली जाने पर कई घरों में क्या तैयार रहता था?', ['केरोसिन की लालटेन या मोमबत्तियाँ', 'लिथियम बैटरी वाला इन्वर्टर', 'सोलर पावर बैंक', 'स्मार्ट बल्ब'], 'लालटेन की काँच की चिमनी रोज़ साफ़ करनी पड़ती थी — शाम का एक जाना-पहचाना काम।']),
    Q('N09', 1, TN, { dec: '1970s' }, ['Which TV channel was the main — often the only — channel for most Indians in the 1970s and early 1980s?', ['Doordarshan', 'Dozens of cable channels', 'Streaming apps', 'Satellite DTH'], 'Families gathered around one TV — sometimes the neighbours’ — to watch Doordarshan.'],

    Q('R03', 1, M, ['“Mr. Das wants to paint his room. The paint shop asks what he needs.” Which detail is most important?', ['The size of the walls', 'His favourite song', 'The day of the week', 'The name of his street'], 'The amount of paint depends on the wall area.'],

    Q('R04', 1, M, ['“Sunita bought 3 kg of apples and paid with a ₹500 note.” What do we need to work out her change?', ['The price per kg of apples', 'The colour of the apples', 'The shop’s opening time', 'Her age'], 'Change = amount paid − total cost, and the cost needs the price per kg.'],
      ['“सुनीता ने 3 किलो सेब ख़रीदे और ₹500 का नोट दिया।” उसके बचे पैसे निकालने के लिए क्या चाहिए?', ['सेब का प्रति किलो दाम', 'सेबों का रंग', 'दुकान खुलने का समय', 'उसकी उम्र'], 'बचे पैसे = दिए पैसे − कुल कीमत, और कीमत के लिए प्रति किलो दाम चाहिए।']),
    Q('R05', 1, M, ['“The bus leaves at 9:00. Arun is walking to the bus stop.” What do we need to know whether he will catch it?', ['How long his walk takes and when he started', 'The bus colour', 'The driver’s name', 'The number of seats'], 'His start time plus walking time must be before 9:00.'],

    Q('R06', 1, C, ['“The shop opens at 10 AM. Ravi bought milk there at 9 AM.” What is wrong?', ['Ravi could not buy from the shop before it opened', 'Milk is not sold in shops', 'Ravi should have bought bread', 'Nothing is wrong'], 'The times contradict each other: 9 AM is before opening time.'],

    Q('R07', 1, C, ['“Asha is 10 years older than her brother. Her brother is 40. Asha says she is 45.” What is wrong?', ['Asha should be 50, not 45', 'Her brother must be younger than 40', 'Brothers cannot be 40', 'Nothing is wrong'], '40 + 10 = 50.'],

    Q('R08', 1, C, ['“It rained heavily all day, so the ground was completely dry in the evening.” What does not make sense?', ['Heavy rain would make the ground wet, not dry', 'It cannot rain all day', 'Evenings are always wet', 'Nothing'], 'The cause and the result do not match.'],

    Q('R09', 2, M, ['“A recipe needs 2 cups of rice for 4 people. Kamala is cooking for a family gathering.” What is missing to know how much rice to cook?', ['How many people are at the gathering', 'The brand of rice', 'The colour of the pot', 'The time of the gathering'], 'Rice scales with the number of people: 2 cups per 4 people.'],

      ['“गोपाल ने ₹30,000 बचाए हैं और इस महीने टीवी ख़रीदना चाहता है।” क्या वह ख़रीद पाएगा, यह जानने के लिए क्या चाहिए?', ['उसे चाहिए वाले टीवी की कीमत', 'उसके कमरे का आकार', 'उसका पसंदीदा चैनल', 'दुकान का नाम'], 'सिर्फ़ कीमत ही बताएगी कि ₹30,000 काफ़ी हैं या नहीं।']),

  <!-- Screens and games -->
  <script>
/* SMART 50+ — main screens: onboarding, home, games list, daily challenge, progress, achievements, settings, about. */
(function () {
  'use strict';
  var S50 = window.S50;
  var U = S50.U, h = U.h, t = S50.t;
  var Store = S50.Store, UI = S50.UI, App = S50.App;
  var CATS = ['memory', 'attention', 'reasoning', 'life', 'safety', 'nostalgia'];
  var GAME_ICON = {
    wherekept: '🔑', trip: '🧳', changed: '🔍', missing: '🧐', familytree: '🌳', lifeexp: '🌟',
    household: '🏠', grandmaster: '♟️', scam: '🛡️', thennow: '📻', finish: '🎬', words: '✉️',
    pairs: '🃏', lamps: '🪔', oddone: '🔎', clock: '🕰️', sudoku: '🔢', kirana: '🛒',
    detective: '🕵️', escape: '🗝️', shapes: '🔷'
  };
  S50.GAME_ICON = GAME_ICON;

  function link(route, cls, children) {
    return h('a', { class: cls, href: '#/' + route }, children);
  }
  function statTile(label, value, icon) {
    return h('div', { class: 'stat' },
      h('span', { class: 'stat-icon', attrs: { 'aria-hidden': 'true' }, text: icon }),
      h('span', { class: 'stat-v', text: value }),
      h('span', { class: 'stat-l', text: label }));
  }
  function streakText(n) { return n === 1 ? t('stat.day1') : t('stat.days', { n: n }); }
  function greeting() {
    var hr = new Date().getHours();
    return t(hr < 12 ? 'greet.morning' : hr < 17 ? 'greet.afternoon' : 'greet.evening');
  }
  function quoteOfDay() {
    var q = t('quotes');
    return Array.isArray(q) ? q[U.hashStr(U.todayKey()) % q.length] : '';
  }
  function toggleBtn(label, value, onChange) {
    var b = h('button', { class: 'toggle' + (value ? ' on' : ''), type: 'button', attrs: { 'aria-pressed': value ? 'true' : 'false' } },
      h('span', { class: 'toggle-label', text: label }),
      h('span', { class: 'toggle-state', text: value ? '● ' + t('settings.on') : '○ ' + t('settings.off') }));
    b.addEventListener('click', function () { onChange(!value); });
    return b;
  }
  function choiceRow(options, value, onChange, cls) {
    return h('div', { class: 'choice-row ' + (cls || '') }, options.map(function (o) {
      var sel = o.value === value;
      return h('button', {
        class: 'choice' + (sel ? ' selected' : ''), type: 'button', attrs: { 'aria-pressed': sel ? 'true' : 'false', lang: o.lang || null },
        style: o.style || null, on: { click: function () { onChange(o.value); } }
      }, sel ? '✓ ' : '', o.label);
    }));
  }
  function fontChoices(onChange) {
    return choiceRow([
      { value: 'normal', label: 'A ' + t('settings.normal'), style: { fontSize: '1rem' } },
      { value: 'large', label: 'A ' + t('settings.large'), style: { fontSize: '1.2rem' } },
      { value: 'xl', label: 'A ' + t('settings.xl'), style: { fontSize: '1.4rem' } }
    ], Store.settings.fontSize, onChange, 'choice-col');
  }
  function langChoices(onChange) {
    return choiceRow(Object.keys(S50.LANGS).map(function (k) {
      return { value: k, label: S50.LANGS[k].native + (S50.LANGS[k].native !== S50.LANGS[k].name ? ' (' + S50.LANGS[k].name + ')' : ''), lang: k };
    }), Store.settings.lang, onChange);
  }

  /* ---------- Onboarding (3 screens) ---------- */
  App.route('onboarding', function (p) {
    var step = U.num(p[0]) || 1;
    var v = U.clear(document.getElementById('view'));
    var dots = h('div', { class: 'ob-dots', attrs: { 'aria-hidden': 'true' } }, [1, 2, 3].map(function (i) { return h('span', { class: 'ob-dot' + (i === step ? ' on' : '') }); }));
    var card = h('div', { class: 'onboard card' });
    if (step === 1) {
      card.appendChild(h('div', { class: 'ob-logo', text: 'SMART 50+' }));
      card.appendChild(h('h1', { text: t('onboard.s1t') }));
      card.appendChild(h('p', { class: 'lead', text: t('onboard.s1b') }));
      card.appendChild(h('h2', { class: 'ob-sub', text: t('onboard.lang') }));
      card.appendChild(langChoices(function (l) { Store.setSetting('lang', l); App.applySettings(); App.render(); }));
      card.appendChild(h('p', { class: 'credit', text: t('about.credit') }));
    } else if (step === 2) {
      card.appendChild(h('div', { class: 'big-emoji', attrs: { 'aria-hidden': 'true' }, text: '🌼' }));
      card.appendChild(h('h1', { text: t('onboard.s2t') }));
      card.appendChild(h('p', { class: 'lead', text: t('onboard.s2b') }));
      card.appendChild(h('p', { text: t('about.p1') }));
      card.appendChild(h('p', { text: t('about.p2') }));
      card.appendChild(h('p', { text: t('about.p3') }));
      card.appendChild(h('p', { class: 'disclaimer', text: t('about.disclaimer') }));
    } else {
      card.appendChild(h('div', { class: 'big-emoji', attrs: { 'aria-hidden': 'true' }, text: '🔠' }));
      card.appendChild(h('h1', { text: t('onboard.s3t') }));
      card.appendChild(fontChoices(function (f) { Store.setSetting('fontSize', f); App.applySettings(); App.render(); }));
      card.appendChild(h('p', { class: 'preview-text', text: t('settings.preview') }));
      card.appendChild(h('p', { class: 'hint', text: t('onboard.s3b') }));
    }
    var actions = h('div', { class: 'ob-actions' });
    if (step > 1) actions.appendChild(h('button', { class: 'btn btn-ghost', type: 'button', text: t('common.back'), on: { click: function () { App.go('onboarding/' + (step - 1)); } } }));
    if (step < 3) actions.appendChild(h('button', { class: 'btn btn-primary', type: 'button', text: t('common.next'), on: { click: function () { App.go('onboarding/' + (step + 1)); } } }));
    else actions.appendChild(h('button', { class: 'btn btn-primary btn-big', type: 'button', text: '▶ ' + t('onboard.lets'), on: { click: function () { Store.setOnboarded(); App.go('home'); } } }));
    card.appendChild(actions);
    v.appendChild(h('div', { class: 'onboard-wrap' }, dots, card));
    var h1 = card.querySelector('h1'); if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus(); }
  });

  /* ---------- Home ---------- */
  App.route('home', function () {
    var v = U.clear(document.getElementById('view'));
    var lvl = Store.levelInfo();
    var stats = Store.data.stats;
    var hero = h('section', { class: 'hero' },
      h('div', { class: 'hero-brand' },
        h('h1', { class: 'hero-title', text: t('app.name') }),
        h('p', { class: 'hero-tag', text: t('app.tagline') })),
      h('p', { class: 'hero-greet', text: greeting() + ' 🙏' }),
      h('p', { class: 'hero-ready', text: t('home.ready') }));
    v.appendChild(hero);

    v.appendChild(h('section', { class: 'stats', attrs: { 'aria-label': t('menu.progress') } },
      statTile(t('stat.today'), U.fmtNum(Store.todayPoints()), '⭐'),
      statTile(t('stat.streak'), streakText(Store.currentStreak()), '🔥'),
      statTile(t('stat.games'), U.fmtNum(stats.gamesPlayed), '🎲'),
      statTile(t('stat.best'), U.fmtNum(stats.bestScore), '🏅'),
      statTile(t('stat.level'), lvl.n + ' · ' + lvl.name, '📈')));

    var ds = Store.dailyScore();
    v.appendChild(h('a', { class: 'daily-cta', href: '#/daily' },
      h('span', { class: 'daily-cta-icon', attrs: { 'aria-hidden': 'true' }, text: '🎯' }),
      h('span', { class: 'daily-cta-text' },
        h('strong', { text: t('home.dailyBtn') }),
        ds !== null ? h('span', { text: t('home.dailyDone', { score: U.fmtNum(ds) }) }) : h('span', { text: t('menuDesc.daily') }))));

    v.appendChild(h('div', { class: 'level-bar card' },
      h('div', { class: 'level-row' }, h('strong', { text: t('common.level', { n: lvl.n }) + ' — ' + lvl.name }),
        h('span', { text: lvl.next ? t('level.next', { n: U.fmtNum(lvl.toNext), name: lvl.nextName }) : t('level.max') })),
      h('div', { class: 'bar' }, h('div', { class: 'bar-fill', style: { width: Math.round(lvl.frac * 100) + '%' } }))));

    var quick = h('section', { class: 'feat-grid quick' });
    var last = Store.data.lastGame && S50.Games.get(Store.data.lastGame) ? Store.data.lastGame : null;
    var all = S50.Games.ORDER;
    var sug = all[U.hashStr('sug-' + U.todayKey()) % all.length];
    if (sug === last) sug = all[(all.indexOf(sug) + 1) % all.length];
    [[last, 'home.cont', '↻'], [sug, 'home.suggest', '✨']].forEach(function (q) {
      if (!q[0]) return;
      quick.appendChild(link('game/' + q[0], 'feat-card', [h('span', { class: 'feat-icon', attrs: { 'aria-hidden': 'true' }, text: GAME_ICON[q[0]] }),
        h('span', { class: 'feat-text' }, h('span', { text: q[2] + ' ' + t(q[1]) }), h('strong', { text: t('games.' + q[0] + '.name') }))]));
    });
    if (quick.childNodes.length) v.appendChild(quick);
    v.appendChild(h('h2', { class: 'section-title', text: t('home.categories') }));
    v.appendChild(h('section', { class: 'cat-grid' }, CATS.map(function (c) {
      return link('games/' + c, 'cat-card cat-' + c, [
        h('span', { class: 'cat-icon', attrs: { 'aria-hidden': 'true' }, text: S50.CAT_ICON[c] }),
        h('span', { class: 'cat-name', text: t('cat.' + c).toUpperCase() }),
        h('span', { class: 'cat-desc', text: t('catDesc.' + c) })]);
    })));

    v.appendChild(h('h2', { class: 'section-title', text: '✨ ' + t('home.featured') }));
    var feat = [
      { r: 'mylife', icon: '👤', name: t('menu.mylife'), d: t('menuDesc.mylife') },
      { r: 'game/lifeexp', icon: GAME_ICON.lifeexp, name: t('games.lifeexp.name'), d: t('games.lifeexp.desc') },
      { r: 'game/thennow', icon: GAME_ICON.thennow, name: t('games.thennow.name'), d: t('games.thennow.desc') },
      { r: 'game/grandmaster', icon: GAME_ICON.grandmaster, name: t('games.grandmaster.name'), d: t('games.grandmaster.desc') },
      { r: 'game/scam', icon: GAME_ICON.scam, name: t('games.scam.name'), d: t('games.scam.desc') },
      { r: 'family/gc', icon: '👵🧒', name: t('fam.gc'), d: t('fam.gcDesc') }
    ];
    v.appendChild(h('section', { class: 'feat-grid' }, feat.map(function (f) {
      return link(f.r, 'feat-card', [h('span', { class: 'feat-icon', attrs: { 'aria-hidden': 'true' }, text: f.icon }),
        h('span', { class: 'feat-text' }, h('strong', { text: f.name }), h('span', { text: f.d }))]);
    })));

    var ml = Store.getMyLife();
    v.appendChild(link('mylife', 'personal-note card', [h('span', { class: 'feat-icon', attrs: { 'aria-hidden': 'true' }, text: '📖' }),
      h('span', { text: ml.city ? t('home.personal', { city: ml.city }) : t('home.personalEmpty') })]));

    v.appendChild(h('h2', { class: 'section-title', text: t('home.more') }));
    var more = [
      { r: 'daily', icon: '🎯', k: 'daily' }, { r: 'progress', icon: '🏆', k: 'progress' },
      { r: 'mylife', icon: '👤', k: 'mylife' }, { r: 'settings', icon: '⚙️', k: 'settings' },
      { r: 'family', icon: '👨‍👩‍👧', k: 'family' }, { r: 'achievements', icon: '🏅', k: 'achievements' },
      { r: 'help', icon: '📘', k: 'help' }
    ];
    v.appendChild(h('section', { class: 'more-grid' }, more.map(function (m) {
      return link(m.r, 'more-card', [h('span', { class: 'more-icon', attrs: { 'aria-hidden': 'true' }, text: m.icon }),
        h('span', { class: 'more-text' }, h('strong', { text: t('menu.' + m.k) }), h('span', { text: t('menuDesc.' + m.k) }))]);
    })));

    v.appendChild(h('div', { class: 'quote card' }, h('span', { class: 'quote-title', text: '💭 ' + t('home.quoteTitle') }), h('p', { text: '“' + quoteOfDay() + '”' })));
    v.appendChild(h('p', { class: 'footer-links' }, h('a', { href: '#/about', text: 'ℹ️ ' + t('menu.about') })));
    v.appendChild(h('p', { class: 'credit', text: t('about.credit') }));
    v.appendChild(h('p', { class: 'disclaimer', text: t('progress.disclaimer') }));
    window.scrollTo(0, 0);

  /* ---------- Games list ---------- */
  App.route('games', function (p) {
    var only = CATS.indexOf(p[0]) >= 0 ? p[0] : null;
    var body = UI.screen({ title: only ? t('cat.' + only) : t('games.title'), icon: only ? S50.CAT_ICON[only] : '🎲', cat: only, back: only ? 'games' : 'home' });
    body.appendChild(h('p', { class: 'lead', text: t('games.pick') }));
    (only ? [only] : CATS).forEach(function (c) {

      h('span', { class: 'game-play', attrs: { 'aria-hidden': 'true' }, text: '▶' })]));

  /* ---------- Daily challenge ---------- */
  function dailyItems(rnd) {
    var B = S50.Bank;
    var groups = [
      B.fresh('memory', 2, rnd),
      B.fresh('attention', 2, rnd),
      B.draw('reasoning', 2, { rnd: rnd, noAvoid: true, filter: function (r) { return !r.gen; } }),
      B.draw('life', 2, { rnd: rnd, noAvoid: true }),
      B.draw('safety', 1, { rnd: rnd, noAvoid: true }),
      B.draw('nostalgia', 1, { rnd: rnd, noAvoid: true })
    ];
    // Interleave so the categories alternate.
    var order = [0, 1, 2, 3, 4, 0, 1, 2, 3, 5];
    var idx = [0, 0, 0, 0, 0, 0];
    return order.map(function (g) { return groups[g][idx[g]++]; }).filter(Boolean);
  }
  App.route('daily', function (p) {

    FIELDS.forEach(function (f) {
      var id = 'ml-' + f;
      var field;
      if (f === 'decade') {
        field = h('select', { id: id, class: 'input' }, h('option', { value: '', text: '— ' + t('common.skip') + ' —' }),
          DECADES.map(function (d) { var o = h('option', { value: d, text: d }); if (a.decade === d) o.selected = true; return o; }));
      } else {
        field = h('input', { id: id, class: 'input', attrs: { type: 'text', maxlength: 40, placeholder: t('mylife.placeholder'), list: 'dl-' + f, autocomplete: 'off' }, value: a[f] || '' });
      }
      inputs[f] = field;
      var dl = POOLS[f] ? h('datalist', { id: 'dl-' + f }, POOLS[f].map(function (p) { return h('option', { value: S50.tx(p) }); })) : null;
      form.appendChild(h('div', { class: 'field' },
        h('label', { attrs: { for: id }, text: ICON[f] + ' ' + t('mylife.q.' + f) }),
        h('div', { class: 'field-row' }, field,
          h('button', { class: 'btn btn-ghost btn-small', type: 'button', text: t('common.skip'), on: { click: function () { field.value = ''; } } })),
        dl));
    });
    form.appendChild(h('button', { class: 'btn btn-primary btn-wide', type: 'submit', text: '✓ ' + t('common.save') }));

      });

    var a = answers();

      var correct = a[f];

})();

/* SMART 50+ — "How to play" help: per-game help page, in-game help panel, first-play guide,
 * Help & Guide page, and the shared pieces used by practice rounds. */
(function () {
  'use strict';
  var S50 = window.S50;
  var U = S50.U, h = U.h, t = S50.t, UI = S50.UI, Store = S50.Store, App = S50.App;

  /* Help entries that are modes rather than games: where "Start playing" should go. */
  var MODE_ROUTE = { daily: 'daily', mylife: 'mylife', family: 'family' };
  var MODE_ICON = { daily: '🎯', mylife: '👤', family: '👨‍👩‍👧' };
  var MODE_NAME = { daily: 'menu.daily', mylife: 'menu.mylife', family: 'menu.family' };

  function seen(id) { var m = Store.data.helpSeen; return !!(m && m[id]); }
  function markSeen(id) {
    if (!Store.data.helpSeen || typeof Store.data.helpSeen !== 'object') Store.data.helpSeen = {};
    Store.data.helpSeen[id] = true;
    Store.save();
  }
  function nameOf(id) { return MODE_NAME[id] ? t(MODE_NAME[id]) : t('games.' + id + '.name'); }
  function iconOf(id) { return MODE_ICON[id] || S50.GAME_ICON[id] || '❓'; }
  function hasPractice(id) { var g = S50.Games.get(id); return !!(g && g.practice); }
  function speakText(id) {
    var c = S50.L((S50.HELP || {})[id] || {});
    return [nameOf(id), c.a].concat((c.s || []).map(function (x, i) { return (i + 1) + '. ' + x; }), [t('help.tip') + ': ' + c.p]).join('. ');
  }

  /* The help card content used by the help page and the in-game panel. */
  function content(id, opts) {
    opts = opts || {};
    var c = S50.L((S50.HELP || {})[id] || {});
    if (!c.a) return h('p', { text: t('common.error') });
    var box = h('div', { class: 'help-content' },
      h('div', { class: 'help-head' }, h('span', { class: 'help-icon', attrs: { 'aria-hidden': 'true' }, text: iconOf(id) }), h('h2', { class: 'help-name', text: nameOf(id) })),
      h('p', { class: 'help-aim' }, h('strong', { text: '🎯 ' + t('help.aim') + ': ' }), c.a),
      h('h3', { class: 'help-sub', text: '👣 ' + t('help.steps') }),
      h('ol', { class: 'help-steps' }, c.s.map(function (s) { return h('li', { text: s }); })),
      h('div', { class: 'help-tip' }, h('strong', { text: '💡 ' + t('help.tip') + ': ' }), c.p),
      MODE_ROUTE[id] ? null : h('p', { class: 'help-points', text: '⭐ ' + t('help.points') }),
      h('p', { class: 'help-points', text: '🌿 ' + t('help.relaxed') }));
    if (UI.Speech.available()) {
      box.insertBefore(h('button', { class: 'btn btn-ghost btn-small', type: 'button', text: t('common.listen'), on: { click: function () { UI.Speech.say(speakText(id)); } } }), box.children[2]);
    }
    return box;
  }

  function startRoute(id) { return MODE_ROUTE[id] || 'game/' + id; }

  /* Full help page: #/help/<id>. Also used automatically the first time a game is opened. */
  function page(id, first) {
    var g = S50.Games.get(id);
    var back = first ? (g ? 'games/' + g.cat : 'games') : 'help';
    var body = UI.screen({ title: t('help.title'), icon: '❓', cat: g ? g.cat : null, back: back, noHelp: true });
    if (first) body.appendChild(h('p', { class: 'lead help-first', text: '👋 ' + t('help.firstTime') }));
    var card = h('div', { class: 'card help-card' }, content(id));
    var actions = h('div', { class: 'help-actions' },
      h('button', { class: 'btn btn-primary btn-big btn-wide', type: 'button', text: t('help.start'), on: { click: function () { markSeen(id); App.go(startRoute(id), true); } } }),
      hasPractice(id) ? h('button', { class: 'btn btn-secondary btn-wide', type: 'button', text: t('help.practice'), on: { click: function () { markSeen(id); App.go('practice/' + id); } } }) : null,
      h('a', { class: 'btn btn-ghost btn-wide', href: '#/help', text: '📘 ' + t('help.guide') }));
    card.appendChild(actions);
    body.appendChild(card);
  }

  /* In-game panel: opens over the game so the round is not lost. */
  function panel(id) {
    var prev = document.activeElement;
    var overlay = h('div', { class: 'modal-overlay', attrs: { role: 'dialog', 'aria-modal': 'true', 'aria-label': t('help.title') } });
    function close() {
      UI.Speech.stop();
      document.removeEventListener('keydown', onKey);
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if (prev && prev.focus) try { prev.focus(); } catch (e) { /* ignore */ }
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    var closeBtn = h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: '✓ ' + t('help.back'), on: { click: close } });
    var box = h('div', { class: 'modal help-modal' }, content(id), closeBtn);
    overlay.appendChild(box);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    document.body.appendChild(overlay);
    document.addEventListener('keydown', onKey);
    closeBtn.focus();
    markSeen(id);
  }

  /* Help & Guide page: #/help */
  function guide() {
    var body = UI.screen({ title: t('help.guide'), icon: '📘', back: 'settings' });
    body.appendChild(h('p', { class: 'lead', text: t('help.guideIntro') }));

    ['daily', 'mylife', 'family'].forEach(function (id) { more.appendChild(guideRow(id, 'cat-family')); });

        hasPractice(id) ? h('span', { class: 'game-best', text: '🎓 ' + t('help.hasPractice') }) : null),

  App.route('help', function (p) {
    if (p[0] && (S50.HELP || {})[p[0]]) return page(p[0], false);

  /* ---------- Practice rounds: shared helpers ---------- */
  var Practice = {
    /* Coach banner shown during practice rounds. */
    coach: function () {

  };
  var ROOMS = 4;

  function name(x) { return S50.tx(x.n); }
  function objIcon(o) {
    if (o.icon !== 'remote') return h('span', { class: 'obj-emoji', attrs: { 'aria-hidden': 'true' }, text: o.icon });
    // Simple drawn TV remote (there is no widely supported emoji for it).

      ['rect', { x: 7, y: 15, width: 4, height: 3, rx: 1, fill: '#d9dde5' }], ['rect', { x: 13, y: 15, width: 4, height: 3, rx: 1, fill: '#d9dde5' }],
      ['rect', { x: 7, y: 21, width: 4, height: 3, rx: 1, fill: '#d9dde5' }], ['rect', { x: 13, y: 21, width: 4, height: 3, rx: 1, fill: '#d9dde5' }],
      ['rect', { x: 7, y: 27, width: 10, height: 3, rx: 1, fill: '#8fd3c1' }]];
    parts.forEach(function (p) { var el = document.createElementNS(ns, p[0]); Object.keys(p[1]).forEach(function (k) { el.setAttribute(k, p[1][k]); }); svg.appendChild(el); });

  function whereQ(o) { return S50.lang === 'hi' ? o.q : t('wherekept.where', { obj: name(o).toLowerCase() }); }

  function makeRoom(cfg) {
    var locs = U.shuffle(LOCS);
    var pool = U.shuffle(OBJS);

    if (cfg.similar) {
      var pair = U.pick(SIMILAR);
      focus = OBJS.filter(function (o) { return o.id === pair[1]; })[0];
      objs.push(focus, pair[0]);
      pool = pool.filter(function (o) { return o.id !== focus.id; });
    }
    while (objs.length < cfg.objs) objs.push(pool.shift());

    var place = {};
    var spots = U.shuffle(locs.map(function (l) { return l.id; }));
    objs.forEach(function (o, i) { place[o.id] = spots[i]; });

  function locById(id) { return LOCS.filter(function (l) { return l.id === id; })[0]; }

  function roomView(room, showObjects, highlight) {
    return h('div', { class: 'room' }, room.locs.map(function (l) {
      var here = room.objs.filter(function (o) { return room.place[o.id] === l.id; })[0];

  }

  function locOptions(room, correctLoc, rnd) {
    var occupied = room.objs.map(function (o) { return room.place[o.id]; }).filter(function (l) { return l !== correctLoc; });

  function buildQuestions(room, cfg, movedId) {
    var qs = [];
    var asked = {};
    if (movedId) { qs.push({ type: 'one', obj: movedId }); asked[movedId] = true; }
    if (room.focus && !asked[room.focus.id]) { qs.push({ type: 'one', obj: room.focus.id }); asked[room.focus.id] = true; }
    var rest = U.shuffle(room.objs.filter(function (o) { return !asked[o.id]; }));
    if (cfg.both && rest.length >= 2) {
      qs.push({ type: 'both', a: rest[0].id, b: rest[1].id });

    var body = UI.screen({ title: t('games.wherekept.name'), icon: S50.GAME_ICON.wherekept, cat: 'memory', back: 'games/memory' });

      var content = h('div', {}, cfg.similar ? h('p', { class: 'hint', text: '⚠️ ' + t('wherekept.similar') }) : null, roomView(room, true));

    function afterHide(room, cfg) {

      wrap.appendChild(UI.progressBar(state.room + 1, ROOMS, t('wherekept.round', { n: state.room + 1, total: ROOMS }) + ' · ' + t('common.level', { n: level })));

          h('div', { class: 'big-emoji', attrs: { 'aria-hidden': 'true' } }, objIcon(o)),
          h('p', { class: 'lead', text: t('wherekept.moved', { obj: S50.lang === 'hi' ? name(o) : name(o).toLowerCase(), loc: name(dest) }) }),
          h('p', { class: 'hint', text: t('wherekept.movedHint') }),
          h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: t('common.cont'), on: { click: function () { ask(room, cfg, buildQuestions(room, cfg, movedId), 0, 0); } } }));
        wrap.appendChild(card);
        card.querySelector('button').focus();
        return;
      }
      ask(room, cfg, buildQuestions(room, cfg, null), 0, 0);
    }

    function ask(room, cfg, qs, qi, roomCorrect) {
      if (qi >= qs.length) {
        state.room += 1;
        if (roomCorrect === qs.length && level < 5) { level += 1; Store.setGameLevel('wherekept', level); UI.toast(t('wherekept.levelUp')); }
        return nextRoom();
      }
      var q = qs[qi];
      U.clear(wrap);
      wrap.appendChild(UI.progressBar(state.room + 1, ROOMS, t('wherekept.round', { n: state.room + 1, total: ROOMS }) + ' · ' + t('common.level', { n: level })));
      wrap.appendChild(h('p', { class: 'hint', text: '🙈 ' + t('wherekept.hidden') }));
      var options, correctIdx, text;
      if (q.type === 'one') {
        var o = objById(room, q.obj);
        var locs = locOptions(room, room.place[o.id]);
        options = locs.map(function (l) { return name(locById(l)); });
        correctIdx = locs.indexOf(room.place[o.id]);
        text = whereQ(o);
      } else {
        var a = objById(room, q.a), b = objById(room, q.b);

        var la = locOptions(room, pa), lb = locOptions(room, pb);
        var pairs = [[pa, pb], [pb, pa]];
        la.forEach(function (x) { lb.forEach(function (y) { if (x !== y && pairs.length < 12) pairs.push([x, y]); }); });
        var uniq = [];
        pairs.forEach(function (p) { if (!uniq.some(function (u) { return u[0] === p[0] && u[1] === p[1]; })) uniq.push(p); });
        var chosen = [uniq[0]].concat(U.shuffle(uniq.slice(1)).slice(0, 3));
        chosen = U.shuffle(chosen);
        options = chosen.map(function (p) { return t('wherekept.and', { a: name(locById(p[0])), b: name(locById(p[1])) }); });
        correctIdx = chosen.indexOf(uniq[0]);
        text = t('wherekept.both', { a: S50.lang === 'hi' ? name(a) : name(a).toLowerCase(), b: S50.lang === 'hi' ? name(b) : name(b).toLowerCase() });
      }
      var card = h('div', { class: 'qcard card' });
      var focusObj = q.type === 'one' ? objById(room, q.obj) : null;
      if (focusObj) card.appendChild(h('div', { class: 'qdisplay' }, objIcon(focusObj)));
      card.appendChild(h('h2', { class: 'qtext', text: text }));
      card.appendChild(roomView(room, false));
      var optsEl = h('div', { class: 'options' });
      var buttons = options.map(function (label, i) {
        var b = h('button', { class: 'opt', type: 'button', on: { click: function () { choose(i); } } }, h('span', { class: 'opt-text', text: label }));
        optsEl.appendChild(b);
        return b;
      });
      card.appendChild(optsEl);
      wrap.appendChild(card);
      buttons[0].focus({ preventScroll: true });
      var done = false;
      function choose(i) {
        if (done) return; done = true;
        var ok = i === correctIdx;
        state.total += 1;
        if (ok) { state.correct += 1; state.streak += 1; roomCorrect += 1; } else state.streak = 0;
        var pts = Store.Score.question({ correct: ok, difficulty: cfg.d, streak: state.streak });
        state.score += pts;
        Store.recordAnswer('memory', ok);
        S50.Sound.play(ok ? 'correct' : 'wrong');
        buttons.forEach(function (b, j) {
          b.disabled = true;
          if (j === correctIdx) { b.classList.add('is-correct'); b.appendChild(h('span', { class: 'opt-mark', text: '✓' })); }
          else if (j === i) { b.classList.add('is-wrong'); b.appendChild(h('span', { class: 'opt-mark', text: '✗' })); }
        });
        var fb = h('div', { class: 'feedback ' + (ok ? 'fb-good' : 'fb-soft'), attrs: { role: 'status' } },
          h('div', { class: 'fb-head' }, h('strong', { text: ok ? t('common.correct') : t('common.wrong') }), pts ? h('span', { class: 'fb-points', text: t('common.points', { n: pts }) }) : null),
          ok ? null : h('p', { class: 'fb-answer', text: t('common.correctAnswer', { a: options[correctIdx] }) }),
          roomView(room, true),
          h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: t('common.next'), on: { click: function () { ask(room, cfg, qs, qi + 1, roomCorrect); } } }));
        card.appendChild(fb);
        fb.querySelector('.btn').focus({ preventScroll: true });
        fb.scrollIntoView({ block: 'nearest' });
      }
    }

    function finish() {
      UI.complete({ gameId: 'wherekept', title: t('games.wherekept.name'), cat: 'memory', score: state.score, correct: state.correct, total: state.total }, { back: 'games/memory' });
    }
    nextRoom();
  }

  S50.Games.register({ id: 'wherekept', cat: 'memory', start: start });
})();

      }

      var next = h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: st.round + 1 >= ROUNDS ? t('common.finish') : t('common.next'), on: { click: function () { st.round += 1; nextRound(); } } });

          h('ul', { class: 'change-list' }, lines)),
        h('div', { class: 'compare' },
          h('div', {}, h('p', { class: 'hint', text: '1' }), grid(r.before, { scene: scene.id })),
          h('div', {}, h('p', { class: 'hint', text: '2' }), grid(r.after, { scene: scene.id, marks: marks }))),
        next));

      window.scrollTo(0, 0);
    }

    function finish() {
      UI.complete({ gameId: 'changed', title: t('games.changed.name'), cat: 'attention', score: st.score, correct: st.found, total: st.total }, { back: 'games/attention' });
    }
    nextRound();
  }

  S50.Games.register({ id: 'changed', cat: 'attention', start: start });
})();

  var TERMS = {

  function relation(F, A, B) {
    var gm = A.g === 'm';
    if (B.spouse === A.id) return gm ? R('husband') : R('wife');

      }

    var spSibs = sp ? F.siblings(sp) : [];
    for (i = 0; i < bSibs.length; i++) {
      if (F.children(bSibs[i]).indexOf(A) >= 0) return bSibs[i].g === 'm' ? (gm ? R('nephew', 'bhatija') : R('niece', 'bhatiji')) : (gm ? R('nephew', 'bhanja') : R('niece', 'bhanji'));
      if (bSibs[i].spouse === A.id) return gm ? R('brotherinlaw', 'jija') : R('sisterinlaw', 'bhabhi');
    }
    for (i = 0; i < spSibs.length; i++) {
      if (F.children(spSibs[i]).indexOf(A) >= 0) return spSibs[i].g === 'm' ? (gm ? R('nephew', 'bhatija') : R('niece', 'bhatiji')) : (gm ? R('nephew', 'bhanja') : R('niece', 'bhanji'));
      if (spSibs[i] === A) {
        if (gm) return B.g === 'f' ? R('brotherinlaw', 'devar') : R('brotherinlaw', 'sala');
        return B.g === 'f' ? R('sisterinlaw', 'nanad') : R('sisterinlaw', 'sali');
      }
    }
    if (sp && F.parents(sp).indexOf(A) >= 0) return gm ? R('fatherinlaw', 'sasur') : R('motherinlaw', 'saas');
    for (i = 0; i < kids.length; i++) if (kids[i].spouse === A.id) return gm ? R('soninlaw', 'damad') : R('daughterinlaw', 'bahu');
    return null;
  }

  function build(size) {
    var F = new Family();
    var males = U.shuffle(MALE), females = U.shuffle(FEMALE);
    function nm(g) { return g === 'm' ? males.shift() : females.shift(); }
    function rg() { return Math.random() < 0.5 ? 'm' : 'f'; }
    function other(g) { return g === 'm' ? 'f' : 'm'; }
    function couple(a, b) { F.marry(a, b); return a.g === 'm' ? [a, b] : [b, a]; }
    var top = couple(F.add('m', nm('m')), F.add('f', nm('f')));
    var nKids = size === 1 ? 2 : 3;
    var kids = [];
    var genders = size === 1 ? ['m', rg()] : U.shuffle(['m', 'f', rg()]);
    for (var i = 0; i < nKids; i++) kids.push(F.child(top[0], top[1], genders[i], nm(genders[i])));
    var married = size === 1 ? 1 : size === 2 ? 2 : 3;
    var couples = [];
    for (var k = 0; k < married; k++) {
      var c = kids[k];
      var s = F.add(other(c.g), nm(other(c.g)));
      couples.push(couple(c, s));
    }
    if (size >= 2) {
      var nGrand = size === 2 ? 1 : U.randInt(3, 5);
      for (var gIdx = 0; gIdx < nGrand; gIdx++) {
        var cp = couples[gIdx % couples.length];
        var gg = rg();
        F.child(cp[0], cp[1], gg, nm(gg));
      }
    }
    return F;
  }

  function nameOf(p) { return S50.tx(p.n); }
  function relText(r) { return S50.lang === 'hi' ? t('rel.' + r.hi) : t('rel.' + r.en); }

  function facts(F) {
    var out = [];
    var done = {};
    F.people.forEach(function (p) {
      if (p.spouse !== null && !done[p.id]) {
        var sp = F.get(p.spouse);
        done[p.id] = done[sp.id] = true;
        var m = p.g === 'm' ? p : sp, f = p.g === 'm' ? sp : p;
        out.push({ k: 'married', text: t('family.married', { a: nameOf(m), b: nameOf(f) }), order: Math.min(p.id, sp.id) * 2 });
      }
      if (p.parents.length) {
        var pp = F.parents(p);
        out.push({ k: 'child', order: p.id * 2 + 1, text: t(p.g === 'm' ? 'family.childOf' : 'family.childOfF', { c: nameOf(p), a: nameOf(pp[0]), b: nameOf(pp[1]), rel: t(p.g === 'm' ? 'family.son' : 'family.daughter') }) });
      }
    });
    return out.sort(function (a, b) { return a.order - b.order; });
  }

  var SIMPLE = ['husband', 'wife', 'father', 'mother', 'son', 'daughter'];
  function pickQuestions(F, n, hard) {
    var pairs = [];
    F.people.forEach(function (a) {
      F.people.forEach(function (b) {
        if (a === b) return;
        var r = relation(F, a, b);
        if (r) pairs.push({ a: a, b: b, r: r, simple: SIMPLE.indexOf(r.en) >= 0 });
      });
    });
    var complex = U.shuffle(pairs.filter(function (p) { return !p.simple; }));
    var simple = U.shuffle(pairs.filter(function (p) { return p.simple; }));
    var wantComplex = hard ? n : Math.ceil(n / 2);
    var chosen = [];
    var usedTerms = {};
    function take(list, max) {
      list.forEach(function (p) {
        if (chosen.length >= n || max <= 0) return;
        if (chosen.some(function (c) { return (c.a === p.a && c.b === p.b) || (c.a === p.b && c.b === p.a); })) return;
        if (usedTerms[p.r.en] && list.length > n) return;
        usedTerms[p.r.en] = true; chosen.push(p); max -= 1;
      });
    }
    take(complex, wantComplex);
    take(simple, n);
    take(complex, n);
    return U.shuffle(chosen).slice(0, n);
  }

  function toItem(F, q, idx) {
    var correct = relText(q.r);
    var pool = TERMS[q.a.g][S50.lang === 'hi' ? 'hi' : 'en'].map(function (k) { return t('rel.' + k); });
    var opts = [correct];
    U.shuffle(pool).forEach(function (x) { if (opts.length < 4 && opts.indexOf(x) < 0) opts.push(x); });
    opts = U.shuffle(opts);
    var qKey = S50.lang === 'hi' ? (q.a.g === 'm' ? 'family.qM' : 'family.qF') : 'family.q';
    var eKey = S50.lang === 'hi' ? (q.a.g === 'm' ? 'family.eM' : 'family.eF') : 'family.e';
    return {
      id: 'FT' + idx, category: 'reasoning', difficulty: q.simple ? 1 : 2, tags: ['family'],
      question: t(qKey, { a: nameOf(q.a), b: nameOf(q.b) }), options: opts, correctAnswer: opts.indexOf(correct),
      explanation: t(eKey, { a: nameOf(q.a), b: nameOf(q.b), rel: S50.lang === 'hi' ? correct : correct.toLowerCase() }), noShuffle: true
    };
  }

  function factsCard(F) {
    return h('div', { class: 'card family-card' },
      h('h2', { class: 'card-title', text: '🌳 ' + t('family.facts') }),
      h('div', { class: 'chip-row' }, F.people.map(function (p) { return h('span', { class: 'chip person ' + p.g, text: (p.g === 'm' ? '👨 ' : '👩 ') + nameOf(p) }); })),
      h('ul', { class: 'facts' }, facts(F).map(function (f) { return h('li', { text: f.text }); })));
  }

  function start() {
    var level = Store.gameLevel('familytree');
    var size = level <= 2 ? 1 : level === 3 ? 2 : 3;
    var ROUNDS = 2, PER = 4;
    var families = [build(size), build(Math.min(3, size + (level >= 2 ? 1 : 0)))];
    var items = [];
    var famOf = [];
    families.forEach(function (F, fi) {
      pickQuestions(F, PER, level >= 4).forEach(function (q, qi) { items.push(toItem(F, q, fi * 10 + qi)); famOf.push(fi); });
    });
    UI.runQuiz({
      gameId: 'familytree', title: t('games.familytree.name'), icon: S50.GAME_ICON.familytree, cat: 'reasoning', items: items, noShuffle: true,
      back: 'games/reasoning', timeLimit: 90,
      beforeQuestion: function (item, wrap, state) {
        var fi = famOf[state.i];
        wrap.appendChild(h('p', { class: 'hint', text: t('family.round', { n: fi + 1, total: ROUNDS }) + ' — ' + t('family.intro') }));
        wrap.appendChild(factsCard(families[fi]));
      },
      onFinish: function (res) {
        if (res.correct >= res.total - 1 && level < 5) Store.setGameLevel('familytree', level + 1);
        UI.complete(res, { back: 'games/reasoning' });
      }
    });
  }

  S50.Games.register({ id: 'familytree', cat: 'reasoning', start: start });
  S50.FamilyTree = { relation: relation, build: build };
})();

/* SMART 50+ — Game 9: Household Manager (practical budgeting, no personal financial advice) */
(function () {
  'use strict';
  var S50 = window.S50;
  var U = S50.U, h = U.h, t = S50.t, UI = S50.UI, Store = S50.Store;

  var CATS = [
    { k: 'food', icon: '🍚', pct: 25, essential: true },
    { k: 'electricity', icon: '💡', pct: 6, essential: true },
    { k: 'travel', icon: '🚌', pct: 8 },
    { k: 'medicine', icon: '💊', pct: 7, essential: true },
    { k: 'entertainment', icon: '🎬', pct: 7 },
    { k: 'gifts', icon: '🎁', pct: 5 },
    { k: 'household', icon: '🧹', pct: 17 },
    { k: 'savings', icon: '🏦', pct: 25 }
  ];
  var EVENTS = [
    { k: 'evRepair', type: 'cost', min: 2500, max: 6000, emergency: true },
    { k: 'evPhone', type: 'cost', min: 1500, max: 4000, emergency: true },
    { k: 'evWedding', type: 'cost', min: 3000, max: 8000, emergency: false },
    { k: 'evGuests', type: 'cost', min: 2000, max: 5000, emergency: false },
    { k: 'evCheckup', type: 'cost', min: 1500, max: 4000, emergency: true },
    { k: 'evSchool', type: 'cost', min: 2000, max: 6000, emergency: false },
    { k: 'evPlumber', type: 'cost', min: 1000, max: 3000, emergency: true },
    { k: 'evFestival', type: 'cost', min: 2000, max: 6000, emergency: false },
    { k: 'evPower', type: 'power', min: 500, max: 1500 },
    { k: 'evIncome', type: 'income', min: 3000, max: 8000 }
  ];
  var STEP = 500, MONTHS_GAME = 4;

  function r500(n) { return Math.max(0, Math.round(n / STEP) * STEP); }

  /* practice = guided one-month round with a fixed situation; nothing is recorded. */
  function start(practice) {
    var MONTHS = practice ? 1 : MONTHS_GAME;
    var income = practice ? 50000 : U.randInt(8, 24) * 5000;
    var plan = {};
    var base = {};
    var sum = 0;
    CATS.forEach(function (c) { plan[c.k] = r500(income * c.pct / 100); sum += plan[c.k]; });
    plan.savings += income - sum;
    CATS.forEach(function (c) { base[c.k] = plan[c.k]; });
    var reserve0 = r500(income * 1.5);
    var st = { month: 0, reserve: reserve0, total: 0, good: 0, savingsKept: 0 };
    function ofType(type) { return EVENTS.filter(function (e) { return e.type === type; }); }
    // Two surprise costs and a bill increase in random order; the income drop is always the final, hardest month.
    var events = practice ? [EVENTS[0]] : U.shuffle(U.sample(ofType('cost'), MONTHS - 2).concat(ofType('power'))).concat(ofType('income'));

    var body = practice ? S50.Practice.screen('household') : UI.screen({ title: t('games.household.name'), icon: S50.GAME_ICON.household, cat: 'life', back: 'games/life' });
    var coach = practice ? S50.Practice.coach() : null;
    if (practice) { body.appendChild(S50.Practice.note()); body.appendChild(coach); }
    var wrap = h('div', { class: 'quiz' });
    body.appendChild(wrap);
    if (!practice) wrap.appendChild(h('div', { class: 'card' },
      h('div', { class: 'big-emoji', attrs: { 'aria-hidden': 'true' }, text: '🏠💰' }),
      h('p', { class: 'lead', text: t('household.intro') }),
      h('p', { class: 'stop-meta', text: t('household.income') + ': ' + U.money(income) }),
      h('p', { class: 'stop-meta', text: t('household.reserve') + ': ' + U.money(reserve0) }),
      h('p', { class: 'disclaimer', text: t('household.disclaimer') }),
      h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: '▶ ' + t('common.start'), on: { click: function () { month(); } } })));

    if (practice) setTimeout(function () { month(); }, 0);
    function month() {
      if (st.month >= MONTHS) return finish();
      var ev = events[st.month];
      var amt = practice ? 3000 : r500(U.randInt(ev.min, ev.max));
      var monthIncome = ev.type === 'income' ? income - amt : income;
      var cur = {};
      CATS.forEach(function (c) { cur[c.k] = plan[c.k]; });
      var minEss = {};
      CATS.forEach(function (c) { if (c.essential) minEss[c.k] = base[c.k]; });
      if (ev.type === 'power') { cur.electricity += amt; minEss.electricity = base.electricity + amt; }
      var surprise = ev.type === 'cost' ? amt : 0;
      var useReserve = false;

      U.clear(wrap);
      wrap.appendChild(UI.progressBar(st.month + 1, MONTHS, t('household.event', { n: st.month + 1, total: MONTHS })));
      var card = h('div', { class: 'card budget' });
      card.appendChild(h('div', { class: 'event-box' }, h('span', { class: 'event-icon', attrs: { 'aria-hidden': 'true' }, text: ev.type === 'income' ? '📉' : ev.type === 'power' ? '⚡' : '🔧' }),
        h('p', { class: 'lead', text: t('household.' + ev.k, { amt: U.money(amt) }) })));
      card.appendChild(h('p', { class: 'hint', text: t('household.adjust') }));
      var rows = h('div', { class: 'budget-rows' });
      var summary = h('div', { class: 'budget-summary' });
      var confirm = h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: '✓ ' + t('household.confirm') });
      var reserveBtn = null;

      function spent() {
        var s = surprise && !useReserve ? surprise : 0;
        CATS.forEach(function (c) { s += cur[c.k]; });
        return s;
      }
      function draw() {
        U.clear(rows);
        CATS.forEach(function (c) {
          var row = h('div', { class: 'brow' + (c.essential ? ' essential' : '') },
            h('span', { class: 'brow-name', text: c.icon + ' ' + t('household.cat.' + c.k) }),
            h('button', { class: 'pm', type: 'button', text: '−', attrs: { 'aria-label': '− ' + t('household.cat.' + c.k) }, disabled: cur[c.k] <= 0,
              on: { click: function () { cur[c.k] = Math.max(0, cur[c.k] - STEP); S50.Sound.play('tap'); draw(); } } }),
            h('span', { class: 'brow-amt', text: U.money(cur[c.k]) }),
            h('button', { class: 'pm', type: 'button', text: '+', attrs: { 'aria-label': '+ ' + t('household.cat.' + c.k) },
              on: { click: function () { cur[c.k] += STEP; S50.Sound.play('tap'); draw(); } } }));
          rows.appendChild(row);
        });
        if (surprise) {
          rows.appendChild(h('div', { class: 'brow surprise' + (useReserve ? ' covered' : '') },
            h('span', { class: 'brow-name', text: '❗ ' + t('household.cat.surprise') }),
            h('span', { class: 'brow-amt', text: useReserve ? '✓ ' + U.money(0) : U.money(surprise) })));
        }
        var s = spent();
        var left = monthIncome - s;
        U.clear(summary);
        summary.appendChild(h('div', { class: 'sum-line' }, h('span', { text: t('household.income') }), h('strong', { text: U.money(monthIncome) })));
        summary.appendChild(h('div', { class: 'sum-line' }, h('span', { text: t('household.spent') }), h('strong', { text: U.money(s) })));
        summary.appendChild(h('div', { class: 'sum-line ' + (left >= 0 ? 'ok' : 'bad') },
          h('span', { text: left >= 0 ? t('household.left') : t('household.over') }), h('strong', { text: (left >= 0 ? '' : '⚠ ') + U.money(Math.abs(left)) })));
        summary.appendChild(h('div', { class: 'sum-line' }, h('span', { text: '🛟 ' + t('household.reserve') }), h('strong', { text: U.money(st.reserve - (useReserve ? surprise : 0)) })));
        if (left >= 0) summary.appendChild(h('p', { class: 'balanced', text: t('household.balanced') }));
        confirm.disabled = left < 0;
        if (coach) { if (left >= 0) coach.set(3, t('practice.hh.s3')); else if (s < monthIncome + surprise) coach.set(2, t('practice.hh.s2')); else coach.set(1, t('practice.hh.s1')); }
        if (reserveBtn) {
          reserveBtn.classList.toggle('on', useReserve);
          reserveBtn.setAttribute('aria-pressed', useReserve ? 'true' : 'false');
          reserveBtn.textContent = (useReserve ? '✓ ' : '🛟 ') + t('household.useReserve') + ' (' + U.money(surprise) + ')';
        }
      }
      card.appendChild(rows);
      if (surprise && st.reserve >= surprise) {
        reserveBtn = h('button', { class: 'toggle reserve-btn', type: 'button', attrs: { 'aria-pressed': 'false' }, on: { click: function () { useReserve = !useReserve; draw(); } } });
        card.appendChild(reserveBtn);
      }
      card.appendChild(summary);
      card.appendChild(confirm);
      wrap.appendChild(card);
      draw();
      confirm.addEventListener('click', function () { evaluate(ev, cur, minEss, monthIncome, useReserve, surprise); });
    }

    function evaluate(ev, cur, minEss, monthIncome, usedReserve, surprise) {
      var msgs = [];
      var essOk = 0, essN = 0;
      Object.keys(minEss).forEach(function (k) { essN += 1; if (cur[k] >= minEss[k] * 0.9) essOk += 1; });
      var score = Math.round(40 * essOk / essN);
      if (essOk < essN) msgs.push(t('household.fb.essentials'));
      if (cur.medicine < minEss.medicine * 0.9) { score -= 10; msgs.push(t('household.fb.medicine')); }
      var saveTarget = income * 0.1;
      score += Math.round(30 * Math.min(1, cur.savings / saveTarget));
      if (cur.savings < saveTarget) msgs.push(t('household.fb.noSave'));
      if (usedReserve) {
        st.reserve -= surprise;
        if (ev.emergency) { score += 15; msgs.push(t('household.fb.reserveUsed')); } else score += 5;
      } else score += 15;
      var reserveFrac = st.reserve / reserve0;
      score += Math.round(15 * Math.min(1, reserveFrac / 0.5));
      if (reserveFrac < 0.5) msgs.push(t('household.fb.reserveLow'));
      score = Math.max(0, Math.min(100, score));
      if (!msgs.length || score >= 90) msgs.unshift(t('household.fb.great'));
      // Leftover money goes back into the emergency fund.
      var spentNow = (usedReserve ? 0 : surprise);
      CATS.forEach(function (c) { spentNow += cur[c.k]; });
      st.reserve += Math.max(0, monthIncome - spentNow);
      st.savingsKept += cur.savings;
      st.total += score;
      var good = score >= 70;
      if (good) st.good += 1;
      if (!practice) Store.recordAnswer('life', good);
      if (coach) coach.set(4, t('practice.hh.s4'));
      S50.Sound.play(good ? 'correct' : 'wrong');
      CATS.forEach(function (c) { if (c.k !== 'electricity') plan[c.k] = cur[c.k]; });
      U.clear(wrap);
      wrap.appendChild(UI.progressBar(st.month + 1, MONTHS, t('household.event', { n: st.month + 1, total: MONTHS })));
      var nb = h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: st.month + 1 >= MONTHS ? t('common.finish') : t('common.next'), on: { click: function () { if (practice) { nb.disabled = true; return S50.Practice.done('household', wrap); } st.month += 1; month(); } } });
      wrap.appendChild(h('div', { class: 'card' }, h('div', { class: 'feedback ' + (good ? 'fb-good' : 'fb-soft') },
        h('div', { class: 'fb-head' }, h('strong', { text: (good ? '✓ ' : '◐ ') + score + ' / 100' }), h('span', { class: 'fb-points', text: t('common.points', { n: Math.round(score * 2.5) }) })),
        h('ul', { class: 'clues' }, msgs.map(function (m) { return h('li', { text: m }); })),
        h('p', { class: 'stop-meta', text: '🛟 ' + t('household.reserve') + ': ' + U.money(st.reserve) })), nb));
      nb.focus();
    }

    function finish() {
      if (st.total >= MONTHS * 80) Store.flag('budgetExpert');
      UI.complete({ gameId: 'household', title: t('games.household.name'), cat: 'life', score: Math.round(st.total * 2.5), correct: st.good, total: MONTHS }, {
        back: 'games/life',
        extra: h('p', { class: 'complete-bonus', text: t('household.summary', { n: MONTHS, s: U.money(st.savingsKept), r: U.money(st.reserve) }) })
      });
    }
  }

  S50.Games.register({ id: 'household', cat: 'life', start: function () { start(false); }, practice: function () { start(true); } });
})();

  <script>
/* SMART 50+ — games built on the shared quiz runner:
 * Life Experience Challenge, Everyday Grandmaster, Spot the Scam, Then & Now,
 * Finish the Memory, Missing Information, Words From My Childhood. */
(function () {
  'use strict';
  var S50 = window.S50;
  var U = S50.U, h = U.h, t = S50.t;
  var Bank = S50.Bank, UI = S50.UI, App = S50.App;

  function hasTag(tag) { return function (r) { return (r.t || []).indexOf(tag) >= 0; }; }
  function title(id) { return t('games.' + id + '.name'); }

  /* Draw n items: first from the preferred filter, then top up from the fallback filter. */
  function drawWithFallback(cat, n, prefer, fallback, sort) {
    var first = Bank.draw(cat, n, { filter: prefer, sort: sort });
    if (first.length >= n) return first;
    var ids = first.map(function (x) { return x.id; });
    var more = Bank.draw(cat, n - first.length, { filter: function (r) { return fallback(r) && ids.indexOf(r.id) < 0; }, sort: sort });
    return first.concat(more);
  }

  function simpleGame(id, cat, n, filter, extra) {
    S50.Games.register({
      id: id, cat: cat,
      start: function () {
        var items = Bank.draw(cat, n, { filter: filter, sort: true });
        UI.runQuiz(Object.assign({ gameId: id, title: title(id), icon: S50.GAME_ICON[id], cat: cat, items: items }, extra || {}));
      }
    });
  }

  simpleGame('lifeexp', 'life', 10, hasTag('exp'));
  simpleGame('grandmaster', 'life', 8, hasTag('gm'));
  simpleGame('scam', 'safety', 10, null, { timeLimit: 60 });
  simpleGame('finish', 'nostalgia', 10, hasTag('finish'));
  simpleGame('missing', 'reasoning', 10, hasTag('missing'));

  /* ---------- Then & Now: choose a decade first ---------- */
  var DECADES = ['1960s', '1970s', '1980s', '1990s', '2000s', 'today', 'all'];
  S50.Games.register({
    id: 'thennow', cat: 'nostalgia',
    start: function (p) {
      var dec = DECADES.indexOf(p[0]) >= 0 ? p[0] : null;
      if (!dec) {
        var body = UI.screen({ title: title('thennow'), icon: S50.GAME_ICON.thennow, cat: 'nostalgia', back: 'games/nostalgia' });
        body.appendChild(h('p', { class: 'lead', text: t('thennow.pick') }));
        body.appendChild(h('div', { class: 'decade-grid' }, DECADES.map(function (d) {
          var label = d === 'all' ? t('thennow.all') : d === 'today' ? t('thennow.today') : d;
          var icon = { '1960s': '📻', '1970s': '🎞️', '1980s': '📺', '1990s': '📟', '2000s': '💿', today: '📱', all: '🕰️' }[d];
          return h('a', { class: 'decade-card', href: '#/game/thennow/' + d },
            h('span', { class: 'decade-icon', attrs: { 'aria-hidden': 'true' }, text: icon }),
            h('span', { class: 'decade-name', text: label }));
        })));
        return;
      }

        S50.Sound.play('correct');
        if (step >= 4) {
          draw();
          Array.prototype.forEach.call(card.querySelectorAll('button'), function (b) { b.disabled = true; });
          coach.style.display = 'none';
          card.appendChild(h('div', { class: 'feedback fb-good' }, h('div', { class: 'fb-head' }, h('strong', { text: t('sudoku.solved') }))));
          return P.done('sudoku', body);
        }
        draw();
      } } }));
    })(d);
    draw();
  });

  /* ---------- Escape Room ---------- */
  attach('escape', function () {
    var body = P.screen('escape');
    var coach = P.coach();
    body.appendChild(P.note());
    body.appendChild(coach);
    var wrap = h('div', {});
    body.appendChild(wrap);
    var hints = 0;
    function inventory(found) {
      return h('div', { class: 'card inventory' }, h('h2', { class: 'card-title', text: t('escape.inventory') }),
        found ? h('ol', { class: 'inv-list' }, h('li', { text: t('practice.esc.r1') })) : h('p', { class: 'hint', text: t('escape.none') }));
    }
    function hintArea(card) {
      var hb = h('button', { class: 'btn btn-ghost', type: 'button', text: t('escape.hint1') });
      var box = h('div', { class: 'esc-hints' });
      hb.addEventListener('click', function () {
        hints += 1;
        box.appendChild(h('p', { class: 'esc-hint' }, h('strong', { text: t('escape.hintLabel') + ' ' }), hints === 1 ? t('practice.esc.h1') : t('practice.esc.h2')));
        if (hints >= 2) hb.style.display = 'none'; else hb.textContent = t('escape.hint2');
      });
      card.appendChild(box); card.appendChild(hb);
    }
    function stage1() {
      U.clear(wrap);
      wrap.appendChild(UI.progressBar(1, 2, '🌼 ' + t('practice.esc.t') + ' · ' + t('escape.stage', { n: 1, m: 2 })));
      wrap.appendChild(inventory(false));
      var card = h('div', { class: 'card esc-stage' }, h('div', { class: 'qdisplay', text: t('practice.esc.disp') }), h('h2', { class: 'qtext', text: t('practice.esc.st1') }));
      var msg = h('p', { class: 'esc-msg', attrs: { role: 'status' } });
      var opts = t('practice.esc.o');
      var box = h('div', { class: 'options options-big' });
      U.shuffle([0, 1, 2]).forEach(function (oi) {
        var b = h('button', { class: 'opt', type: 'button', on: { click: function () {
          if (oi !== 0) { b.disabled = true; markOpt(b, false); msg.textContent = '✗ ' + t('escape.wrong'); S50.Sound.play('wrong'); return; }
          markOpt(b, true); S50.Sound.play('correct');
          Array.prototype.forEach.call(box.querySelectorAll('button'), function (x) { x.disabled = true; });
          card.appendChild(h('div', { class: 'feedback fb-good' }, h('div', { class: 'fb-head' }, h('strong', { text: t('escape.right') })),
            h('div', { class: 'new-clue' }, h('strong', { text: t('escape.newClue') }), h('p', { text: t('practice.esc.r1') })),
            h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: t('escape.next'), on: { click: stage2 } })));
          coach.set(2, t('practice.esc.s2'));
        } } }, h('span', { class: 'opt-text', text: opts[oi] }));
        box.appendChild(b);
      });
      card.appendChild(box); card.appendChild(msg);
      hintArea(card);
      wrap.appendChild(card);
      coach.set(1, t('practice.esc.s1'));
    }
    function stage2() {
      hints = 0;
      U.clear(wrap);
      wrap.appendChild(UI.progressBar(2, 2, '🌼 ' + t('practice.esc.t') + ' · ' + t('escape.stage', { n: 2, m: 2 })));
      wrap.appendChild(inventory(true));
      var code = t('practice.esc.code'), entered = '';
      var card = h('div', { class: 'card esc-stage' }, h('h2', { class: 'qtext', text: t('practice.esc.st2') }));
      var slots = h('div', { class: 'code-slots', attrs: { 'aria-live': 'polite' } });
      var msg = h('p', { class: 'esc-msg', attrs: { role: 'status' } });
      function drawSlots() { U.clear(slots); for (var i = 0; i < code.length; i++) slots.appendChild(h('span', { class: 'code-slot' + (entered[i] ? ' filled' : ''), text: entered[i] || '' })); }
      var pad = h('div', { class: 'code-pad' });
      '1234567890'.split('').forEach(function (d) {
        pad.appendChild(h('button', { class: 'sk-num', type: 'button', text: d, on: { click: function () { if (entered.length < code.length) { entered += d; msg.textContent = ''; drawSlots(); } } } }));
      });
      pad.appendChild(h('button', { class: 'sk-num sk-erase', type: 'button', text: t('escape.del'), on: { click: function () { entered = entered.slice(0, -1); drawSlots(); } } }));
      card.appendChild(slots); card.appendChild(pad);
      card.appendChild(h('div', { class: 'sk-tools' },
        h('button', { class: 'btn btn-ghost', type: 'button', text: t('escape.clear'), on: { click: function () { entered = ''; drawSlots(); } } }),
        h('button', { class: 'btn btn-secondary', type: 'button', text: t('escape.check'), on: { click: function () {
          if (entered !== code) { msg.textContent = '✗ ' + t('escape.wrong'); S50.Sound.play('wrong'); entered = ''; drawSlots(); return; }
          S50.Sound.play('correct');
          Array.prototype.forEach.call(card.querySelectorAll('button'), function (b) { b.disabled = true; });
          card.appendChild(h('div', { class: 'feedback fb-good' }, h('div', { class: 'fb-head' }, h('strong', { text: t('escape.right') }))));
          coach.style.display = 'none';
          P.done('escape', wrap);
        } } })));
      card.appendChild(msg);
      hintArea(card);
      wrap.appendChild(card);
      drawSlots();
      coach.set(3, t('practice.esc.s3'));
    }
    stage1();
  });
})();

</script>
</body>
