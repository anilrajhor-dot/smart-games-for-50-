/* SMART 50+ — warm, high-legibility, mobile-first styles */
:root {
  --bg: #fff7ee;
  --surface: #ffffff;
  --surface-2: #fdf0e1;
  --text: #2a2118;
  --muted: #5b4f43;
  --border: #e6d5c1;
  --primary: #a63d17;
  --primary-ink: #ffffff;
  --primary-soft: #fbe3d6;
  --secondary: #1d5c68;
  --secondary-ink: #ffffff;
  --good: #1b6e3e;
  --good-bg: #e2f3e7;
  --bad: #a3271f;
  --bad-bg: #fbe8e5;
  --mid: #7a4f00;
  --mid-bg: #fff0d1;
  --focus: #1d5c68;
  --shadow: 0 2px 10px rgba(80, 50, 20, 0.08);
  --radius: 16px;
  --c-memory: #64399a;
  --c-attention: #0d6672;
  --c-reasoning: #27589f;
  --c-life: #2a7349;
  --c-safety: #a8352a;
  --c-nostalgia: #9b3263;
  --c-family: #7f521b;
  --nav-h: 76px;
  color-scheme: light;
}
:root.theme-dark {
  --bg: #1d1a17;
  --surface: #2a2622;
  --surface-2: #342f2a;
  --text: #f6eee4;
  --muted: #d3c5b5;
  --border: #4d443b;
  --primary: #f0956a;
  --primary-ink: #1d1a17;
  --primary-soft: #4a3226;
  --secondary: #7cc7d3;
  --secondary-ink: #10282c;
  --good: #8fdcaa;
  --good-bg: #1f3a29;
  --bad: #ffaaa1;
  --bad-bg: #45231f;
  --mid: #ffd27a;
  --mid-bg: #45361a;
  --focus: #ffd27a;
  --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}
:root.high-contrast {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #ffffff;
  --text: #000000;
  --muted: #000000;
  --border: #000000;
  --primary: #00307a;
  --primary-ink: #ffffff;
  --primary-soft: #e6eeff;
  --secondary: #000000;
  --secondary-ink: #ffffff;
  --good: #004d1a;
  --good-bg: #ffffff;
  --bad: #8a0000;
  --bad-bg: #ffffff;
  --mid: #5a3a00;
  --mid-bg: #ffffff;
  --focus: #c00000;
  --c-memory: #3d1466; --c-attention: #003f47; --c-reasoning: #0b2f66; --c-life: #0b4022; --c-safety: #6e0f06; --c-nostalgia: #5e0a33; --c-family: #4a2a00;
}
:root.high-contrast.theme-dark {
  --bg: #000000; --surface: #000000; --surface-2: #000000; --text: #ffffff; --muted: #ffffff; --border: #ffffff;
  --primary: #ffd400; --primary-ink: #000000; --primary-soft: #222; --secondary: #ffffff; --secondary-ink: #000000;
  --good: #7dff9a; --good-bg: #000; --bad: #ff8a80; --bad-bg: #000; --mid: #ffd400; --mid-bg: #000; --focus: #ffd400;
}

* { box-sizing: border-box; }
html { font-size: 112.5%; -webkit-text-size-adjust: 100%; }
html.fs-large { font-size: 125%; }
html.fs-xl { font-size: 142%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Nirmala UI", "Mangal", Ubuntu, "Helvetica Neue", Arial, sans-serif;
  font-weight: 450;
  line-height: 1.55;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5rem; font-weight: 750; }
p { margin: 0 0 .75rem; }
a { color: var(--secondary); }
button, input, select { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 8px; }
.high-contrast :focus-visible { outline-width: 4px; }

#app { min-height: 100vh; }
#view {
  max-width: 980px;
  margin: 0 auto;
  padding: 1rem 1rem calc(var(--nav-h) + 1.5rem);
  min-width: 0;
}
body.no-nav #nav { display: none; }
body.no-nav #view { padding-bottom: 2rem; }

/* ---------- Navigation ---------- */
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface);
  border-top: 1px solid var(--border);
  box-shadow: 0 -2px 12px rgba(0, 0, 0, .06);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-brand { display: none; }
.nav-list { display: flex; list-style: none; margin: 0; padding: 0; }
.nav-list li { flex: 1; min-width: 0; }
.nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: var(--nav-h); padding: 6px 2px; text-decoration: none; color: var(--muted);
  font-size: .78rem; font-weight: 650; text-align: center;
}
.nav-item .nav-icon { font-size: 1.5rem; line-height: 1; }
.nav-item .nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.nav-item.active { color: var(--primary); }
.nav-item.active .nav-label { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }

@media (min-width: 900px) {
  #nav {
    top: 0; right: auto; width: 250px; border-top: 0; border-right: 1px solid var(--border);
    box-shadow: none; padding: 1.25rem .75rem;
  }
  .nav-brand { display: flex; flex-direction: column; padding: 0 .75rem 1.25rem; }
  .nav-logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: .5px; }
  .nav-tag { font-size: .8rem; color: var(--muted); }
  .nav-list { flex-direction: column; gap: .25rem; }
  .nav-item { flex-direction: row; justify-content: flex-start; gap: .75rem; min-height: 56px; padding: .5rem .9rem; border-radius: 12px; font-size: 1rem; }
  .nav-item.active { background: var(--primary-soft); }
  .nav-item.active .nav-label { text-decoration: none; }
  #view { margin-left: 250px; margin-right: 0; padding: 1.5rem 2rem 2rem; max-width: 1000px; }
  body.no-nav #view { margin: 0 auto; }
}
@media (min-width: 1300px) { #view { margin-left: calc(250px + (100vw - 250px - 1000px) / 2); } }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 54px; padding: .7rem 1.25rem; border-radius: 14px; border: 2px solid transparent;
  font-weight: 750; font-size: 1rem; text-decoration: none; cursor: pointer; text-align: center;

}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-secondary { background: var(--secondary); color: var(--secondary-ink); }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn-danger { background: var(--bad); color: #fff; }
.theme-dark .btn-danger { color: #1d1a17; }
.btn-wide { width: 100%; margin-top: .75rem; }
.btn-big { min-height: 64px; font-size: 1.15rem; }
.btn-small { min-height: 44px; padding: .4rem .8rem; font-size: .9rem; }
.high-contrast .btn { border-color: var(--text); }

/* ---------- Cards & common ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.1rem; box-shadow: var(--shadow); margin-bottom: 1rem; min-width: 0;
}
.high-contrast .card { border-width: 2px; box-shadow: none; }
.card-title { font-size: 1.1rem; margin-bottom: .75rem; }
.lead { font-size: 1.1rem; }
.hint { color: var(--muted); font-size: .95rem; }
.disclaimer { color: var(--muted); font-size: .85rem; text-align: center; margin-top: 1.25rem; }
.section-title { font-size: 1.2rem; margin: 1.5rem 0 .75rem; }
.big-emoji { font-size: 3rem; line-height: 1.2; text-align: center; }
.private { background: var(--good-bg); color: var(--good); border-radius: 12px; padding: .6rem .9rem; font-weight: 650; }
.chip-row { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip {
  display: inline-flex; align-items: center; min-height: 44px; padding: .4rem .9rem; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text); text-decoration: none; font-weight: 650;
}
.chip-big { min-height: 52px; padding: .5rem 1.1rem; }
.bar { height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
.bar-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width .4s ease; }

/* ---------- Screen header ---------- */
.screen-head {
  display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
  margin: -.25rem 0 1rem; padding: .5rem 0 .75rem; border-bottom: 3px solid var(--primary-soft);
}
.screen-head.cat-memory { border-color: var(--c-memory); }
.screen-head.cat-attention { border-color: var(--c-attention); }
.screen-head.cat-reasoning { border-color: var(--c-reasoning); }
.screen-head.cat-life { border-color: var(--c-life); }
.screen-head.cat-safety { border-color: var(--c-safety); }
.screen-head.cat-nostalgia { border-color: var(--c-nostalgia); }
.screen-head.cat-family { border-color: var(--c-family); }
.btn-back {
  min-height: 48px; min-width: 48px; padding: .4rem 1rem; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--border); background: var(--surface); font-weight: 750; font-size: 1rem;
}
.screen-title { display: flex; align-items: center; gap: .5rem; min-width: 0; flex: 1; }
.screen-title h1 { font-size: 1.35rem; margin: 0; overflow-wrap: anywhere; }
.screen-title h1:focus { outline: none; }
.screen-icon { font-size: 1.6rem; }
.screen-body { min-width: 0; }

/* ---------- Home ---------- */
.hero {
  background: linear-gradient(135deg, #fbe0c9 0%, #fdf0e1 55%, #e5f0ee 100%);
  border-radius: 22px; padding: 1.25rem 1.25rem 1rem; margin-bottom: 1rem; border: 1px solid var(--border);
}
.theme-dark .hero { background: linear-gradient(135deg, #4a3226 0%, #342f2a 60%, #24363a 100%); }

.hero-title { font-size: 2.1rem; color: var(--primary); letter-spacing: .5px; margin: 0; }
.hero-tag { font-weight: 650; color: var(--muted); margin: 0 0 .75rem; }
.hero-greet { font-size: 1.3rem; font-weight: 750; margin: 0; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .6rem; margin-bottom: 1rem; }
.stats-3 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat {

  display: flex; flex-direction: column; min-width: 0;
}
.stat-icon { font-size: 1.2rem; }

.daily-cta {
  display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.2rem; border-radius: 20px; margin-bottom: 1rem;
  background: linear-gradient(135deg, var(--primary), #c7612e); color: #fff; text-decoration: none; box-shadow: var(--shadow);
}
.theme-dark .daily-cta, .high-contrast .daily-cta { background: var(--primary); color: var(--primary-ink); }
.daily-cta-icon { font-size: 2.6rem; }
.daily-cta-text { display: flex; flex-direction: column; min-width: 0; }
.daily-cta-text strong { font-size: 1.15rem; letter-spacing: .3px; }
.level-bar .level-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .25rem 1rem; margin-bottom: .5rem; }
.level-bar .level-row span { color: var(--muted); font-size: .9rem; }
.cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
@media (min-width: 640px) { .cat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.cat-card {
  display: flex; flex-direction: column; gap: .25rem; padding: 1rem; min-height: 130px; border-radius: 18px;
  color: #fff; text-decoration: none; box-shadow: var(--shadow); min-width: 0;
}
.cat-icon { font-size: 2.2rem; line-height: 1.1; }
.cat-name { font-size: 1.05rem; font-weight: 800; letter-spacing: .4px; overflow-wrap: anywhere; }
.cat-desc { font-size: .88rem; opacity: .95; }
.cat-card.cat-memory, .cat-bg-memory { background: linear-gradient(140deg, var(--c-memory), #8058b8); }
.cat-card.cat-attention, .cat-bg-attention { background: linear-gradient(140deg, var(--c-attention), #1b8a96); }
.cat-card.cat-reasoning, .cat-bg-reasoning { background: linear-gradient(140deg, var(--c-reasoning), #3d74c2); }
.cat-card.cat-life, .cat-bg-life { background: linear-gradient(140deg, var(--c-life), #3a9160); }
.cat-card.cat-safety, .cat-bg-safety { background: linear-gradient(140deg, var(--c-safety), #c4513f); }
.cat-card.cat-nostalgia, .cat-bg-nostalgia { background: linear-gradient(140deg, var(--c-nostalgia), #b84f80); }
.high-contrast .cat-card, .high-contrast [class*="cat-bg-"] { background: var(--c-memory); }
.high-contrast .cat-card.cat-attention, .high-contrast .cat-bg-attention { background: var(--c-attention); }
.high-contrast .cat-card.cat-reasoning, .high-contrast .cat-bg-reasoning { background: var(--c-reasoning); }
.high-contrast .cat-card.cat-life, .high-contrast .cat-bg-life { background: var(--c-life); }
.high-contrast .cat-card.cat-safety, .high-contrast .cat-bg-safety { background: var(--c-safety); }
.high-contrast .cat-card.cat-nostalgia, .high-contrast .cat-bg-nostalgia { background: var(--c-nostalgia); }
.feat-grid, .more-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: .6rem; }
@media (min-width: 640px) { .feat-grid, .more-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.feat-card, .more-card, .personal-note {
  display: flex; align-items: center; gap: .9rem; padding: .9rem 1rem; border-radius: 16px; min-height: 72px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text); text-decoration: none; min-width: 0;
}
.feat-card { border-left: 6px solid var(--primary); }
.personal-note { margin-top: 1rem; background: var(--surface-2); }
.feat-icon, .more-icon { font-size: 1.9rem; flex: 0 0 auto; }
.feat-text, .more-text { display: flex; flex-direction: column; min-width: 0; }
.feat-text span, .more-text span { color: var(--muted); font-size: .9rem; }
.quote { margin-top: 1rem; background: var(--surface-2); }
.quote-title { font-weight: 750; color: var(--muted); font-size: .9rem; }
.quote p { font-size: 1.15rem; font-style: italic; margin: .25rem 0 0; }
.footer-links { text-align: center; margin-top: 1rem; }
.footer-links a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 650; }

/* ---------- Games list ---------- */
.game-section { margin-bottom: .5rem; }
.cat-title { display: flex; align-items: center; gap: .25rem; }
.game-card {
  display: flex; align-items: center; gap: 1rem; padding: 1rem; margin-bottom: .6rem; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--border); border-left: 7px solid var(--primary);
  text-decoration: none; color: var(--text); min-height: 84px; min-width: 0;
}
.game-card.cat-memory { border-left-color: var(--c-memory); }
.game-card.cat-attention { border-left-color: var(--c-attention); }
.game-card.cat-reasoning { border-left-color: var(--c-reasoning); }
.game-card.cat-life { border-left-color: var(--c-life); }
.game-card.cat-safety { border-left-color: var(--c-safety); }
.game-card.cat-nostalgia { border-left-color: var(--c-nostalgia); }
.game-card.cat-family { border-left-color: var(--c-family); }
.game-icon { font-size: 2.1rem; flex: 0 0 auto; }
.game-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.game-text strong { font-size: 1.08rem; }
.game-text span { color: var(--muted); font-size: .92rem; }
.game-text .game-best { font-weight: 650; color: var(--secondary); }
.game-play {
  flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--primary); color: var(--primary-ink); font-size: 1.1rem;
}
.decade-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
@media (min-width: 640px) { .decade-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.decade-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25rem; padding: 1rem;
  min-height: 110px; border-radius: 16px; background: var(--surface); border: 2px solid var(--border);
  text-decoration: none; color: var(--text); font-weight: 750; font-size: 1.1rem; text-align: center;
}
.decade-card.wide { flex-direction: row; justify-content: flex-start; min-height: 76px; margin-bottom: .6rem; gap: .9rem; }
.decade-icon { font-size: 2rem; }
.region-tag { display: inline-block; background: var(--primary-soft); color: var(--text); border-radius: 999px; padding: .2rem .8rem; font-weight: 700; }

/* ---------- Quiz ---------- */
.qprogress { margin-bottom: .9rem; }
.qprogress-label { display: block; font-weight: 700; color: var(--muted); margin-bottom: .35rem; }
.qcard { padding: 1.2rem; }
.qintro { color: var(--muted); font-weight: 650; }
.qtext { font-size: 1.25rem; margin: .25rem 0 1rem; overflow-wrap: anywhere; }
.qdisplay {
  font-size: 1.6rem; font-weight: 800; letter-spacing: 2px; text-align: center; padding: .9rem; margin-bottom: .8rem;
  background: var(--surface-2); border-radius: 14px; overflow-wrap: anywhere; line-height: 1.6;
}
.qdisplay .obj-svg { width: 2.4rem; height: 3.2rem; }
.options { display: grid; grid-template-columns: minmax(0, 1fr); gap: .65rem; }
.options-big { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.options-big .opt { justify-content: center; text-align: center; font-size: 1.35rem; font-weight: 800; letter-spacing: 1px; }
.options-scam { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.options-scam .opt-unsure { grid-column: 1 / -1; }
.opt {
  display: flex; align-items: center; justify-content: space-between; gap: .75rem; width: 100%;
  min-height: 60px; padding: .8rem 1rem; border-radius: 14px; cursor: pointer; text-align: left;
  background: var(--surface); border: 2px solid var(--border); font-size: 1.05rem; font-weight: 600; color: var(--text);
  transition: border-color .15s ease, background .15s ease;
}
.opt:hover:not([disabled]) { border-color: var(--primary); }
.opt[disabled] { cursor: default; }
.opt-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt-mark { font-size: 1.4rem; font-weight: 900; flex: 0 0 auto; }
.opt.is-correct { background: var(--good-bg); border-color: var(--good); color: var(--good); border-width: 3px; }
.opt.is-wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); border-width: 3px; }
.opt.is-partial { background: var(--mid-bg); border-color: var(--mid); color: var(--mid); border-width: 3px; }
.opt-scam, .opt-safe { justify-content: center; text-align: center; font-size: 1.25rem; font-weight: 800; min-height: 72px; }
.opt-scam:not([disabled]) { border-color: var(--bad); }
.opt-safe:not([disabled]) { border-color: var(--good); }
.opt-unsure { justify-content: center; text-align: center; }
.feedback { border-radius: 14px; padding: 1rem; margin-top: 1rem; border: 2px solid; }
.fb-good { background: var(--good-bg); border-color: var(--good); }
.fb-soft { background: var(--surface-2); border-color: var(--border); }
.fb-mid { background: var(--mid-bg); border-color: var(--mid); }
.fb-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; font-size: 1.15rem; margin-bottom: .5rem; }
.fb-good .fb-head strong { color: var(--good); }
.fb-mid .fb-head strong { color: var(--mid); }
.fb-points { background: var(--surface); border-radius: 999px; padding: .15rem .7rem; font-weight: 800; color: var(--primary); }
.fb-answer { font-weight: 750; }
.fb-verdict { font-weight: 800; font-size: 1.1rem; }
.fb-sub { font-weight: 750; margin-bottom: .25rem; }
.fb-rule { font-weight: 750; background: var(--surface); border-radius: 10px; padding: .5rem .75rem; }
.clues { margin: 0 0 .75rem; padding-left: 1.4rem; }
.clues li { margin-bottom: .25rem; }
.timer { display: inline-block; font-weight: 800; color: var(--secondary); margin-bottom: .5rem; }
.memo-card { text-align: left; }
.memo-title { font-weight: 800; font-size: 1.15rem; color: var(--secondary); margin-bottom: .75rem; }
.memo-content { font-size: 1.3rem; font-weight: 700; background: var(--surface-2); padding: 1rem; border-radius: 14px; margin-bottom: .75rem; overflow-wrap: anywhere; }
.memo-content p:last-child { margin-bottom: 0; }
.btn-ready { min-height: 64px; font-size: 1.2rem; }

/* Spot the scam phone mock-up */
.phone { border: 2px solid var(--border); border-radius: 20px; overflow: hidden; margin-bottom: 1rem; background: var(--surface-2); }
.phone-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .25rem .75rem; padding: .6rem .9rem; background: var(--surface); border-bottom: 1px solid var(--border); font-size: .92rem; }

.phone-from { color: var(--muted); overflow-wrap: anywhere; }
.bubble {
  margin: .9rem; padding: .9rem 1rem; background: var(--surface); border-radius: 4px 18px 18px 18px;
  border: 1px solid var(--border); font-size: 1.08rem; overflow-wrap: anywhere; box-shadow: var(--shadow);
}

.high-contrast .ch-whatsapp .bubble { background: var(--surface); color: var(--text); }

/* ---------- Where did I keep it ---------- */
.room {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; padding: .6rem; border-radius: 16px;
  background: linear-gradient(180deg, #f6e4cf 0%, #f6e4cf 40%, #e6cba8 40%, #e6cba8 100%); margin-bottom: .9rem;
}

.spot {

}

.spot-icon { font-size: 1.6rem; line-height: 1.1; }

.obj { width: 100%; display: flex; flex-direction: column; align-items: center; background: var(--primary-soft); border: 2px solid var(--primary); border-radius: 10px; padding: .15rem .35rem; margin-top: .15rem; }
.obj-emoji { font-size: 1.6rem; line-height: 1.1; }
.obj-svg { width: 1.4rem; height: 2rem; }

/* ---------- What changed ---------- */

.scene-office { background: #e6edf5; } .scene-station { background: #ece6dc; } .scene-dining { background: #f8e6dd; } .scene-living { background: #f3e9df; }

.cell {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem;
  min-height: 74px; padding: .3rem .2rem; border-radius: 12px; background: rgba(255, 255, 255, .85); border: 2px solid transparent; min-width: 0;
}

.blink-card { text-align: center; padding: 2.5rem 1rem; }

/* ---------- Memory trip ---------- */

.stop-card { min-width: 0; }
.stop-city { font-size: 1.6rem; color: var(--primary); margin-bottom: .25rem; }

/* ---------- Family tree ---------- */

/* ---------- Household ---------- */

.brow { display: grid; grid-template-columns: minmax(0, 1fr) 48px minmax(96px, auto) 48px; align-items: center; gap: .4rem; padding: .35rem .5rem; border-radius: 12px; background: var(--surface-2); }

}
.brow.essential .brow-name::after { content: " •"; color: var(--primary); }
.brow.surprise { grid-template-columns: minmax(0, 1fr) auto; background: var(--mid-bg); }
.brow.surprise.covered { background: var(--good-bg); }
.brow-name { font-weight: 650; overflow-wrap: break-word; }
.brow-amt { font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
.pm { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); font-size: 1.5rem; font-weight: 800; cursor: pointer; }
.pm[disabled] { opacity: .4; cursor: default; }
.budget-summary { background: var(--surface-2); border-radius: 14px; padding: .75rem 1rem; margin-top: .5rem; }
.sum-line { display: flex; justify-content: space-between; gap: 1rem; padding: .25rem 0; }
.sum-line.ok strong { color: var(--good); }
.sum-line.bad strong { color: var(--bad); }
.balanced { color: var(--good); font-weight: 800; margin: .4rem 0 0; }
.reserve-btn { margin: .25rem 0 .5rem; }

/* ---------- Toggles / choices / forms ---------- */
.toggle {
  display: flex; justify-content: space-between; align-items: center; gap: 1rem; width: 100%; min-height: 58px;
  padding: .6rem 1rem; margin-bottom: .5rem; border-radius: 14px; border: 2px solid var(--border); background: var(--surface);
  cursor: pointer; font-weight: 700; text-align: left;
}
.toggle.on { border-color: var(--secondary); background: var(--primary-soft); }
.toggle-state { flex: 0 0 auto; font-weight: 800; color: var(--secondary); }
.choice-row { display: flex; flex-wrap: wrap; gap: .5rem; }
.choice-col { flex-direction: column; }
.choice {
  flex: 1 1 auto; min-height: 54px; padding: .6rem 1rem; border-radius: 14px; border: 2px solid var(--border); background: var(--surface);
  cursor: pointer; font-weight: 700; text-align: left;
}
.choice.selected { border-color: var(--primary); background: var(--primary-soft); border-width: 3px; }
.preview-text { margin-top: .75rem; padding: .75rem; border-radius: 12px; background: var(--surface-2); font-size: 1.05rem; }
.field { margin-bottom: 1rem; }
.field label { display: block; font-weight: 700; margin-bottom: .35rem; }
.field-row { display: flex; gap: .5rem; align-items: center; }
.input {
  width: 100%; min-height: 54px; padding: .6rem .9rem; border-radius: 12px; border: 2px solid var(--border);
  background: var(--surface); font-size: 1.05rem; min-width: 0;
}
.input:focus { border-color: var(--secondary); }
.form-error { color: var(--bad); font-weight: 700; min-height: 1.2em; }
.story-list { list-style: none; padding: 0; margin: 0; }
.story-list li { padding: .45rem 0; border-bottom: 1px solid var(--border); font-size: 1.05rem; }
.fq-list { list-style: none; padding: 0; margin: 0; }
.fq-item { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .6rem 0; border-bottom: 1px solid var(--border); }
.fq-text { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.fq-text span { color: var(--muted); font-size: .9rem; }
.turn-banner { display: flex; align-items: center; gap: .75rem; padding: .7rem 1rem; border-radius: 14px; margin-bottom: .75rem; font-size: 1.15rem; }
.turn-banner.old { background: var(--primary-soft); }
.turn-banner.now { background: var(--good-bg); }
.turn-icon { font-size: 2rem; }
.gc-scores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; margin: .75rem 0; }
.gc-player { display: flex; flex-direction: column; align-items: center; padding: .75rem; border-radius: 14px; background: var(--surface-2); }
.gc-num { font-size: 1.4rem; font-weight: 800; }

/* ---------- Completion ---------- */
.complete { text-align: center; }
.complete-emoji { font-size: 3.2rem; }
.complete-head { font-size: 1.9rem; color: var(--primary); }
.complete-score { display: flex; flex-direction: column; margin: .5rem 0; }
.complete-score .label { color: var(--muted); font-weight: 700; }
.complete-score .value { font-size: 2.6rem; font-weight: 850; }
.complete-bonus { font-weight: 750; color: var(--secondary); }
.complete-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; margin: 1rem 0; }
@media (min-width: 640px) { .complete-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.ctile { display: flex; flex-direction: column; padding: .7rem; border-radius: 12px; background: var(--surface-2); }
.ctile-v { font-size: 1.35rem; font-weight: 850; }
.ctile-l { color: var(--muted); font-size: .9rem; }
.complete-best { font-weight: 800; color: var(--good); }
.complete-fb { font-size: 1.15rem; font-weight: 700; }
.complete-quote { color: var(--muted); font-style: italic; }
.complete-actions { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
@media (min-width: 640px) { .complete-actions { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; } }

/* ---------- Daily / progress / badges ---------- */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .35rem; margin-bottom: .75rem; }
.week-day { display: flex; flex-direction: column; align-items: center; gap: .2rem; }
.week-dot { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface-2); border: 2px solid var(--border); font-weight: 900; }
.week-day.played .week-dot { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.week-day.today .week-name { font-weight: 900; text-decoration: underline; }
.week-name { font-size: .78rem; color: var(--muted); }
.mix { text-align: center; color: var(--muted); font-weight: 650; }
.done-note { text-align: center; font-weight: 800; color: var(--good); font-size: 1.1rem; }
.stats-wide { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.strength-row { display: grid; grid-template-columns: minmax(110px, 1fr) minmax(80px, 2fr); gap: .25rem .75rem; align-items: center; margin-bottom: .75rem; }
.strength-label { grid-column: 1 / -1; font-size: .9rem; color: var(--muted); font-weight: 650; }
@media (min-width: 640px) { .strength-row { grid-template-columns: 160px minmax(0, 1fr) 190px; } .strength-label { grid-column: auto; } }
.strength-name { font-weight: 700; }
.strength .bar { height: 18px; }
.chart { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .4rem; align-items: end; height: 190px; }
.chart-col { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; min-width: 0; }
.chart-bar-wrap { flex: 1; width: 70%; display: flex; align-items: flex-end; }
.chart-bar { width: 100%; background: var(--secondary); border-radius: 8px 8px 0 0; min-height: 2px; }
.chart-v { font-size: .7rem; font-weight: 700; color: var(--muted); min-height: 1.1em; }
.chart-l { font-size: .78rem; color: var(--muted); }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .75rem; }
.badge { display: flex; flex-direction: column; align-items: center; text-align: center; gap: .25rem; padding: 1rem .6rem; border-radius: 16px; background: var(--surface); border: 2px dashed var(--border); }
.badge.on { border-style: solid; border-color: var(--primary); background: var(--primary-soft); }
.badge-icon { font-size: 2.3rem; filter: grayscale(1); opacity: .55; }
.badge.on .badge-icon { filter: none; opacity: 1; }
.badge-desc { font-size: .85rem; color: var(--muted); }
.badge-state { font-size: .82rem; font-weight: 750; }

/* ---------- Onboarding ---------- */
.onboard-wrap { max-width: 620px; margin: 0 auto; padding-top: 1rem; }
.onboard { text-align: center; padding: 1.75rem 1.25rem; }
.onboard h1 { font-size: 1.6rem; }
.onboard h1:focus { outline: none; }
.ob-logo { font-size: 2.4rem; font-weight: 850; color: var(--primary); letter-spacing: 1px; }
.ob-sub { font-size: 1.05rem; margin-top: 1.25rem; }
.onboard .choice-row { justify-content: center; }
.ob-actions { display: flex; gap: .75rem; justify-content: center; margin-top: 1.5rem; flex-wrap: wrap; }
.ob-actions .btn { min-width: 140px; }
.ob-dots { display: flex; justify-content: center; gap: .5rem; margin-bottom: 1rem; }
.ob-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--border); }
.ob-dot.on { background: var(--primary); }
.about { text-align: center; }
.error-box { text-align: center; margin-top: 2rem; }

/* ---------- Modal & toast ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(20, 12, 5, .55); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50; }
.modal { background: var(--surface); color: var(--text); border-radius: 18px; padding: 1.4rem; max-width: 460px; width: 100%; box-shadow: 0 10px 40px rgba(0, 0, 0, .3); border: 2px solid var(--border); }
.modal-msg { font-size: 1.15rem; font-weight: 650; }
.modal-actions { display: flex; gap: .75rem; justify-content: flex-end; flex-wrap: wrap; margin-top: 1rem; }
.modal-actions .btn { flex: 1 1 140px; }
#toasts { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + 12px); display: flex; flex-direction: column; align-items: center; gap: .5rem; z-index: 60; pointer-events: none; padding: 0 1rem; }
.toast { background: var(--text); color: var(--bg); padding: .8rem 1.2rem; border-radius: 14px; font-weight: 700; max-width: 520px; box-shadow: var(--shadow); transition: opacity .4s ease; text-align: center; }
.toast.out { opacity: 0; }
@media (min-width: 900px) { #toasts { bottom: 24px; left: 250px; } }

/* ---------- Motion preferences ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }

/* ---------- Quiz helpers: listen, 50:50, receipts, clock ---------- */
.qtools { display: flex; flex-wrap: wrap; gap: .5rem; margin: -.25rem 0 .75rem; }
.qtools .btn { flex: 1 1 auto; }
.opt.is-removed { opacity: .35; text-decoration: line-through; }
.receipt { font-family: "Courier New", ui-monospace, monospace; background: #fffdf6; color: #2a2118; border: 2px dashed var(--border); border-radius: 10px; padding: .8rem 1rem; margin-bottom: .9rem; font-size: 1.02rem; }
.theme-dark .receipt { background: #2f2a24; color: var(--text); }
.high-contrast .receipt { background: var(--surface); color: var(--text); border-color: var(--text); }
.receipt-head { font-weight: 800; text-align: center; margin-bottom: .4rem; font-family: inherit; }
.receipt-line { display: flex; justify-content: space-between; gap: 1rem; padding: .2rem 0; border-bottom: 1px dotted var(--border); }
.receipt-line span { overflow-wrap: break-word; min-width: 0; }
.qclock { display: flex; justify-content: center; margin-bottom: .75rem; }
.clock-svg { width: min(240px, 70vw); height: auto; }
.clock-face { fill: var(--surface); stroke: var(--text); stroke-width: 5; }
.clock-tick { stroke: var(--muted); stroke-width: 1.5; }
.clock-tick5 { stroke: var(--text); stroke-width: 3.5; }
.clock-num { fill: var(--text); font-size: 20px; font-weight: 800; font-family: Arial, sans-serif; }
.clock-hour { stroke: var(--text); stroke-width: 8; stroke-linecap: round; }
.clock-min { stroke: var(--primary); stroke-width: 5; stroke-linecap: round; }
.clock-pin { fill: var(--primary); }

/* ---------- Memory Pairs ---------- */
.pairs-status { font-weight: 800; font-size: 1.1rem; text-align: center; }
.pairs-note { text-align: center; min-height: 1.6em; font-weight: 700; }
.pairs-grid { display: grid; gap: .55rem; margin: .5rem 0; }
.pairs-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pairs-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pcard {
  min-height: 92px; border-radius: 14px; border: 2px solid var(--primary); cursor: pointer; padding: .3rem;
  background: linear-gradient(135deg, var(--primary), #c7612e); color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem; transition: transform .2s ease;
}
.high-contrast .pcard, .theme-dark .pcard { background: var(--primary); color: var(--primary-ink); }
.pcard-back { font-size: 2rem; opacity: .9; }
.pcard.up { background: var(--surface); color: var(--text); border-color: var(--secondary); transform: scale(1.03); }
.pcard.matched { background: var(--good-bg); border-color: var(--good); border-width: 3px; cursor: default; opacity: 1; }
.pcard.matched::after { content: "✓"; font-weight: 900; color: var(--good); }
.pcard-emoji { font-size: 2.1rem; line-height: 1.1; }
.pcard-name { font-size: .78rem; font-weight: 800; line-height: 1.15; overflow-wrap: break-word; }

/* ---------- Follow the Lamps ---------- */
.lamps-info { font-size: 1.2rem; font-weight: 800; text-align: center; min-height: 1.6em; }
.lamps-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem; max-width: 460px; margin: 0 auto 1rem; }
.lamp {
  min-height: 140px; border-radius: 22px; border: 4px solid transparent; cursor: pointer; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: .3rem; color: #fff; font-weight: 800; font-size: 1.05rem; opacity: .55;
  transition: opacity .15s ease, transform .15s ease, box-shadow .15s ease;
}
.lamp[disabled] { cursor: default; }
.lamp-0 { background: #b3261e; } .lamp-1 { background: #1b6e3e; } .lamp-2 { background: #1f4fa3; } .lamp-3 { background: #9a6a00; }
.lamp-diya { font-size: 3rem; line-height: 1; }
.lamp.lit { opacity: 1; border-color: #ffe08a; box-shadow: 0 0 0 6px rgba(255, 210, 90, .55), 0 0 30px rgba(255, 200, 60, .9); transform: scale(1.05); }
.lamp.lit .lamp-label::before { content: "★ "; }
.reduce-motion .lamp.lit { transform: none; }

/* ---------- Mini Sudoku ---------- */
.sudoku-msg { font-weight: 750; text-align: center; min-height: 1.6em; }
.sudoku { display: flex; flex-direction: column; margin: .5rem auto 1rem; border: 3px solid var(--text); border-radius: 10px; overflow: hidden; width: min(100%, 420px); }
.sk-row { display: flex; }
.sk-cell {
  flex: 1 1 0; aspect-ratio: 1 / 1; min-height: 48px; min-width: 0; border: 1px solid var(--border); background: var(--surface);
  font-size: 1.6rem; font-weight: 800; color: var(--secondary); cursor: pointer; position: relative; padding: 0;
}
.sudoku.n6 .sk-cell { font-size: 1.3rem; }
.sk-cell.given { color: var(--text); background: var(--surface-2); cursor: default; }
.sk-cell.bR { border-right: 3px solid var(--text); }
.sk-cell.bB { border-bottom: 3px solid var(--text); }
.sk-cell.sel { background: var(--primary-soft); outline: 3px solid var(--primary); outline-offset: -3px; }
.sk-cell.bad { background: var(--bad-bg); color: var(--bad); }
.sk-x { position: absolute; top: 1px; right: 4px; font-size: .8rem; color: var(--bad); }
.sk-pad { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-bottom: .75rem; }
.sk-num { min-width: 56px; min-height: 56px; border-radius: 14px; border: 2px solid var(--secondary); background: var(--surface); font-size: 1.4rem; font-weight: 800; cursor: pointer; }
.sk-erase { font-size: 1rem; padding: 0 .8rem; border-color: var(--border); }
.sk-tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
.quick { margin-bottom: .5rem; }

/* ---------- Mystery Detective ---------- */
.case-title { font-size: 1.3rem; color: var(--primary); }
.case-label { font-weight: 800; color: var(--muted); margin: .75rem 0 .3rem; text-transform: uppercase; letter-spacing: .5px; font-size: .85rem; }
.case-story { font-size: 1.12rem; font-weight: 600; }
.clue-list { list-style: none; padding: 0; margin: 0 0 .5rem; display: grid; gap: .5rem; }
.clue-btn { width: 100%; min-height: 56px; border-radius: 12px; border: 2px dashed var(--secondary); background: var(--surface-2); font-weight: 750; cursor: pointer; text-align: left; padding: .6rem .9rem; }
.clue.open { display: flex; flex-direction: column; gap: .15rem; background: var(--surface-2); border-left: 5px solid var(--secondary); border-radius: 10px; padding: .6rem .9rem; }
.clue-num { font-size: .8rem; font-weight: 800; color: var(--secondary); }
.clue-text { font-size: 1.05rem; }
.key-q { margin-top: .75rem; border-top: 2px dashed var(--border); padding-top: .75rem; }
.opt-small { min-height: 52px; font-size: .98rem; }

/* ---------- Escape Room ---------- */
.esc-card { display: flex; align-items: center; gap: 1rem; width: 100%; padding: 1rem; margin-bottom: .6rem; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); border-left: 7px solid var(--c-reasoning); text-align: left; cursor: pointer; color: var(--text); min-height: 84px; }
.esc-continue { border: 3px solid var(--primary); }
.inventory { background: var(--surface-2); }
.inv-list { margin: 0; padding-left: 1.3rem; }
.inv-list li { margin-bottom: .4rem; }
.esc-msg { font-weight: 750; color: var(--bad); min-height: 1.4em; }
.esc-hints .esc-hint { background: var(--mid-bg); border-radius: 10px; padding: .55rem .8rem; margin: .4rem 0; }
.new-clue { background: var(--surface); border: 2px dashed var(--primary); border-radius: 12px; padding: .6rem .9rem; margin: .6rem 0; }
.new-clue p { margin: .3rem 0 0; }
.code-slots { display: flex; justify-content: center; gap: .5rem; margin: .5rem 0 .9rem; }
.code-slot { width: 52px; height: 60px; border-radius: 12px; border: 3px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 850; }
.code-slot.filled { border-color: var(--secondary); }
.code-pad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .45rem; margin-bottom: .75rem; }
.code-pad .sk-num { min-width: 0; }
.code-pad .sk-erase { grid-column: span 5; }
.order-tiles { display: grid; grid-template-columns: minmax(0, 1fr); gap: .5rem; margin-bottom: .75rem; }
.order-tile.used { opacity: .35; }
.order-row { margin: 0 0 .75rem; padding-left: 1.6rem; display: grid; gap: .3rem; }
.order-slot { padding: .35rem .6rem; border-radius: 8px; background: var(--surface-2); min-height: 2rem; font-weight: 650; }
.order-slot.filled { background: var(--primary-soft); }
.esc-map { display: inline-flex; flex-direction: column; gap: 4px; padding: .6rem; border-radius: 12px; background: #e9f3dc; margin: 0 auto .8rem; position: relative; }
.theme-dark .esc-map, .high-contrast .esc-map { background: var(--surface-2); border: 2px solid var(--border); }
.esc-stage .esc-map { display: flex; width: max-content; max-width: 100%; }
.esc-north { text-align: center; font-weight: 850; color: var(--secondary); }
.esc-map-row { display: flex; gap: 4px; }
.esc-map-cell { width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; background: rgba(255, 255, 255, .7); border-radius: 8px; border: 1px solid rgba(0, 0, 0, .1); }
.theme-dark .esc-map-cell { background: rgba(0, 0, 0, .3); }

/* ---------- Shape Shifter ---------- */
.shape-mode { background: var(--surface-2); border-radius: 12px; padding: .6rem .9rem; margin-bottom: .75rem; }
.shape-msg { font-weight: 750; text-align: center; min-height: 3em; }
.shape-board { display: grid; gap: 3px; width: min(100%, 440px); margin: .25rem auto 1rem; }
.sh-cell { aspect-ratio: 1 / 1; min-height: 44px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.1rem; position: relative; padding: 0; }
.sh-cell.off { background: transparent; }
.sh-cell.target { background: var(--surface); border: 3px dashed var(--secondary); cursor: pointer; color: #fff; }
.sh-cell.fixed { background: repeating-linear-gradient(45deg, #8d8072, #8d8072 6px, #a69a8c 6px, #a69a8c 12px); border: 2px solid var(--text); }
.sh-cell.mirror-edge { box-shadow: 4px 0 0 0 var(--primary); }
.sh-cell.bad { background: var(--bad-bg); border: 3px solid var(--bad); }
.sh-x { position: absolute; color: var(--bad); font-size: 1.2rem; }
.sh-cell.pc { border-style: solid; border-color: rgba(0, 0, 0, .55); text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
.pc-0.pc, .pc-0 .mini-cell.on { background: #a63d17; }
.pc-1.pc, .pc-1 .mini-cell.on { background: repeating-linear-gradient(45deg, #1d5c68, #1d5c68 6px, #2a7a88 6px, #2a7a88 12px); }
.pc-2.pc, .pc-2 .mini-cell.on { background: radial-gradient(circle, #7d5ab0 25%, #64399a 26%) 0 0 / 12px 12px; }
.pc-3.pc, .pc-3 .mini-cell.on { background: repeating-linear-gradient(0deg, #2a7349, #2a7349 6px, #3a9160 6px, #3a9160 12px); }
.pc-4.pc, .pc-4 .mini-cell.on { background: repeating-linear-gradient(90deg, #9b3263, #9b3263 6px, #b84f80 6px, #b84f80 12px); }
.pc-5.pc, .pc-5 .mini-cell.on { background: repeating-linear-gradient(-45deg, #7a4f00, #7a4f00 6px, #9a6a00 6px, #9a6a00 12px); }
.shape-tray { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: .5rem; margin-bottom: .9rem; }
.tray-piece { display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: .5rem; min-height: 96px; border-radius: 14px; border: 2px solid var(--border); background: var(--surface); cursor: pointer; }
.tray-piece.selected { border: 4px solid var(--primary); background: var(--primary-soft); }
.tray-piece.placed { opacity: .55; }
.tray-letter { font-weight: 900; font-size: 1.1rem; }
.tray-state { font-size: .78rem; font-weight: 750; color: var(--good); }
.mini { display: grid; gap: 2px; }
.mini-cell { width: 16px; height: 16px; border-radius: 3px; font-size: 10px; line-height: 16px; text-align: center; color: #fff; }
.mini-cell.on { border: 1px solid rgba(0, 0, 0, .5); }
.shape-tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }

/* SMART 50+ — small, dependency-free helpers.
 * Everything lives under the single global namespace `S50`. */
(function () {
  'use strict';
  var S50 = (window.S50 = window.S50 || {});

  /* Safe element builder: never uses innerHTML, all text goes through textContent. */
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = String(v);
      else if (k === 'on') {
        Object.keys(v).forEach(function (ev) { el.addEventListener(ev, v[ev]); });
      } else if (k === 'style') {
        Object.keys(v).forEach(function (s) { el.style[s] = v[s]; });
      } else if (k === 'attrs') {
        Object.keys(v).forEach(function (a) {
          if (v[a] !== null && v[a] !== undefined && v[a] !== false) el.setAttribute(a, v[a] === true ? '' : String(v[a]));
        });
      } else if (k === 'value') el.value = v;
      else el[k] = v;
    });
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) { child.forEach(function (c) { append(el, c); }); return; }
    if (typeof child === 'string' || typeof child === 'number') el.appendChild(document.createTextNode(String(child)));
    else el.appendChild(child);
  }
  function clear(el) { while (el && el.firstChild) el.removeChild(el.firstChild); return el; }

  /* Seeded random generator (mulberry32) so daily challenges are reproducible. */
  function rng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {
    var hsh = 2166136261;
    s = String(s);
    for (var i = 0; i < s.length; i++) { hsh ^= s.charCodeAt(i); hsh = Math.imul(hsh, 16777619); }
    return hsh >>> 0;
  }
  function shuffle(arr, rnd) {
    rnd = rnd || Math.random;
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(arr, rnd) { rnd = rnd || Math.random; return arr[Math.floor(rnd() * arr.length)]; }
  function sample(arr, n, rnd) { return shuffle(arr, rnd).slice(0, Math.max(0, n)); }
  function randInt(a, b, rnd) { rnd = rnd || Math.random; return a + Math.floor(rnd() * (b - a + 1)); }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function keyToDate(k) {
    var p = String(k).split('-');
    return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1);
  }
  function addDays(k, n) { var d = keyToDate(k); d.setDate(d.getDate() + n); return todayKey(d); }
  function dayDiff(a, b) { return Math.round((keyToDate(b) - keyToDate(a)) / 86400000); }

  /* Numbers are always made finite so NaN/Infinity can never reach the screen. */
  function num(n) { n = Number(n); return isFinite(n) ? Math.round(n) : 0; }
  function fmtNum(n) { return num(n).toLocaleString('en-IN'); }
  function money(n) { return '₹' + fmtNum(n); }
  function pct(a, b) { a = num(a); b = num(b); return b > 0 ? Math.round((a / b) * 100) : 0; }

  /* Removes control characters and limits length; result is plain text only. */
  function cleanText(s, max) {
    s = String(s === null || s === undefined ? '' : s);
    s = s.replace(/[\u0000-\u001F\u007F]/g, ' ').replace(/\s+/g, ' ').trim();
    return s.slice(0, max || 80);
  }
  function fmt(tpl, params) {
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
      var v = params ? params[k] : undefined;
      return v === undefined || v === null ? '' : String(v);
    });

    try {

    } catch (e) { return false; }

    reducedMotion: reducedMotion
  };
})();

  /* Analogue clock face as inline SVG. */
  function clockSvg(hh, mm) {
    var ns = 'http://www.w3.org/2000/svg';
    function el(tag, a) { var e = document.createElementNS(ns, tag); Object.keys(a).forEach(function (k) { e.setAttribute(k, a[k]); }); return e; }
    var svg = el('svg', { viewBox: '0 0 200 200', class: 'clock-svg', role: 'img', 'aria-label': t('clock.aria') });
    svg.appendChild(el('circle', { cx: 100, cy: 100, r: 94, class: 'clock-face' }));
    for (var i = 0; i < 60; i++) {
      var a = i * Math.PI / 30, r1 = i % 5 ? 86 : 80;
      svg.appendChild(el('line', { x1: 100 + r1 * Math.sin(a), y1: 100 - r1 * Math.cos(a), x2: 100 + 90 * Math.sin(a), y2: 100 - 90 * Math.cos(a), class: i % 5 ? 'clock-tick' : 'clock-tick5' }));
    }
    for (var n = 1; n <= 12; n++) {
      var an = n * Math.PI / 6;
      var tx = el('text', { x: 100 + 66 * Math.sin(an), y: 100 - 66 * Math.cos(an) + 7, 'text-anchor': 'middle', class: 'clock-num' });
      tx.textContent = String(n);
      svg.appendChild(tx);
    }
    var ha = ((hh % 12) + mm / 60) * Math.PI / 6, ma = mm * Math.PI / 30;
    svg.appendChild(el('line', { x1: 100, y1: 100, x2: 100 + 44 * Math.sin(ha), y2: 100 - 44 * Math.cos(ha), class: 'clock-hour' }));
    svg.appendChild(el('line', { x1: 100, y1: 100, x2: 100 + 70 * Math.sin(ma), y2: 100 - 70 * Math.cos(ma), class: 'clock-min' }));
    svg.appendChild(el('circle', { cx: 100, cy: 100, r: 6, class: 'clock-pin' }));
    return svg;
  }

  function root() { return document.getElementById('view'); }

  /* A screen with a header (back button + title). Returns the body element to fill. */
  function screen(opts) {
    var v = U.clear(root());
    var back = opts.back === false ? null : h('button', {
      class: 'btn-back', type: 'button', text: t('common.back'),
      attrs: { 'aria-label': t('common.back') },
      on: { click: function () { if (typeof opts.back === 'function') opts.back(); else S50.App.go(opts.back || 'home'); } }
    });
    var header = h('header', { class: 'screen-head' + (opts.cat ? ' cat-' + opts.cat : '') },
      back,
      h('div', { class: 'screen-title' },
        opts.icon ? h('span', { class: 'screen-icon', attrs: { 'aria-hidden': 'true' }, text: opts.icon }) : null,
        h('h1', { text: opts.title || '' })),
      opts.noHelp ? null : (opts.right || helpButton()));
    var body = h('div', { class: 'screen-body' });
    v.appendChild(header);
    v.appendChild(body);
    window.scrollTo(0, 0);
    var h1 = header.querySelector('h1');
    if (h1) { h1.setAttribute('tabindex', '-1'); try { h1.focus({ preventScroll: true }); } catch (e) { /* old browsers */ } }
    return body;
  }

  /* Every game screen gets a ❓ Help button that opens the how-to-play panel without leaving the game. */
  function helpButton() {
    var m = /^game\/([a-z]+)/.exec(S50.App && S50.App.current ? S50.App.current() : '');
    if (!m || !S50.Help || !S50.Help.has(m[1])) return null;
    var id = m[1];
    return h('button', { class: 'btn-help', type: 'button', text: t('help.btn'), attrs: { 'aria-label': t('help.btnLabel') }, on: { click: function () { S50.Help.panel(id); } } });
  }

  function toast(msg, ms) {
    var box = document.getElementById('toasts');
    if (!box) return;
    var el = h('div', { class: 'toast', attrs: { role: 'status' }, text: msg });
    box.appendChild(el);
    setTimeout(function () { el.classList.add('out'); }, ms || 2600);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, (ms || 2600) + 500);
  }

  /* Accessible confirm dialog. Returns a Promise<boolean>. */
  function confirmBox(message, okText, cancelText, danger) {
    return new Promise(function (resolve) {
      var prev = document.activeElement;
      var overlay = h('div', { class: 'modal-overlay', attrs: { role: 'dialog', 'aria-modal': 'true' } });
      function close(v) {
        document.removeEventListener('keydown', onKey);
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        if (prev && prev.focus) try { prev.focus(); } catch (e) { /* ignore */ }
        resolve(v);
      }
      function onKey(e) { if (e.key === 'Escape') close(false); }
      var ok = h('button', { class: 'btn ' + (danger ? 'btn-danger' : 'btn-primary'), type: 'button', text: okText || t('common.ok'), on: { click: function () { close(true); } } });
      var box = h('div', { class: 'modal' },
        h('p', { class: 'modal-msg', text: message }),
        h('div', { class: 'modal-actions' },
          h('button', { class: 'btn btn-ghost', type: 'button', text: cancelText || t('common.cancel'), on: { click: function () { close(false); } } }),
          ok));
      overlay.appendChild(box);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(false); });
      document.body.appendChild(overlay);
      document.addEventListener('keydown', onKey);
      ok.focus();
    });
  }

  function errorScreen() {
    stopTimers();
    var v = U.clear(root());
    v.appendChild(h('div', { class: 'error-box card' },
      h('div', { class: 'big-emoji', text: '🙏', attrs: { 'aria-hidden': 'true' } }),
      h('p', { class: 'lead', text: t('common.error') }),
      h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: '🏠 ' + t('common.home'), on: { click: function () { S50.App.go('home'); } } })));
  }

  function progressBar(n, total, label) {
    return h('div', { class: 'qprogress' },
      h('span', { class: 'qprogress-label', text: label || t('common.question', { n: n, total: total }) }),
      h('div', { class: 'bar', attrs: { role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': total, 'aria-valuenow': n } },
        h('div', { class: 'bar-fill', style: { width: U.pct(n, total) + '%' } })));
  }

  /* Memorise phase: shows content with an "I'm Ready" button. In challenge mode it also auto-continues. */
  function memorise(container, content, onReady, opts) {
    opts = opts || {};
    var done = false;
    var info = h('p', { class: 'hint', text: t('common.takeTime') });
    function go() { if (done) return; done = true; S50.Sound.play('tap'); onReady(); }
    var btn = h('button', { class: 'btn btn-primary btn-wide btn-ready', type: 'button', text: '✓ ' + t('common.ready'), on: { click: go } });
    container.appendChild(h('div', { class: 'memo-card card' },
      h('div', { class: 'memo-title', text: '👁 ' + (opts.title || t('common.rememberThis')) }),
      content,
      info,
      btn));
    if (S50.Store.settings.mode === 'challenge') {
      var left = opts.seconds || 10;
      info.textContent = t('common.autoHide', { n: left });
      every(function () {
        if (done) return;
        left -= 1;
        if (left <= 0) go(); else info.textContent = t('common.autoHide', { n: left });
      }, 1000);
    }
    btn.focus();
  }

  function memoContent(memo) {
    var lines = Array.isArray(memo) ? memo : String(memo).split('\n');
    return h('div', { class: 'memo-content' }, lines.map(function (l) { return h('p', { text: l }); }));
  }

  function scamBubble(msg) {
    var ch = msg.channel || 'sms';
    var chIcon = { sms: '💬', whatsapp: '🟢', email: '✉️', call: '📞', upi: '💳', social: '🌐' }[ch] || '💬';
    return h('div', { class: 'phone ch-' + ch },
      h('div', { class: 'phone-top' },
        h('span', { class: 'phone-ch', text: chIcon + ' ' + t('scam.channel.' + ch) }),
        h('span', { class: 'phone-from', text: t('scam.from') + ': ' + (msg.from || '—') })),
      h('div', { class: 'bubble', text: msg.text }));
  }

  /* ---------- Generic quiz runner used by most games ---------- */
  function runQuiz(cfg) {
    var items = (cfg.items || []).filter(function (it) { return it && it.question && it.options && it.options.length >= 2; });
    if (!items.length) { errorScreen(); return; }
    var state = { i: 0, score: 0, correct: 0, streak: 0, results: [] };
    var mode = S50.Store.settings.mode;
    var body = screen({ title: cfg.title, icon: cfg.icon, cat: cfg.cat, back: cfg.back || 'games' });
    var wrap = h('div', { class: 'quiz' });
    body.appendChild(wrap);

    function next() {
      stopTimers();
      if (state.i >= items.length) return finish();
      var item = items[state.i];
      U.clear(wrap);
      wrap.appendChild(progressBar(state.i + 1, items.length));
      if (cfg.beforeQuestion) cfg.beforeQuestion(item, wrap, state);
      if (item.memo) {
        memorise(wrap, memoContent(item.memo), function () { U.clear(wrap); wrap.appendChild(progressBar(state.i + 1, items.length)); ask(item); });
      } else ask(item);
    }

    function ask(item) {
      var card = h('div', { class: 'qcard card' + (item.kind === 'scam' ? ' qcard-scam' : '') });
      if (item.intro) card.appendChild(h('p', { class: 'qintro', text: item.intro }));
      if (item.message) card.appendChild(scamBubble(item.message));
      if (item.display) card.appendChild(h('div', { class: 'qdisplay', attrs: { 'aria-label': item.display }, text: item.display }));
      if (item.receipt) card.appendChild(receiptView(item.receipt));
      if (item.clock) card.appendChild(h('div', { class: 'qclock' }, clockSvg(item.clock.h, item.clock.m)));
      card.appendChild(h('h2', { class: 'qtext', text: item.question }));
      var order = item.options.map(function (o, i) { return i; });
      if (!cfg.noShuffle && item.kind !== 'scam' && !item.noShuffle) order = U.shuffle(order);
      var opts = h('div', { class: 'options' + (item.bigOptions ? ' options-big' : '') + (item.kind === 'scam' ? ' options-scam' : '') });
      var buttons = [];
      order.forEach(function (oi) {
        var b = h('button', {
          class: 'opt' + (item.kind === 'scam' ? (oi === 0 ? ' opt-scam' : ' opt-safe') : ''), type: 'button',
          on: { click: function () { answer(item, oi, buttons, card); } }
        }, h('span', { class: 'opt-text', text: item.options[oi] }));
        b.dataset.idx = String(oi);
        buttons.push(b);
        opts.appendChild(b);
      });
      if (cfg.allowNotSure || item.kind === 'scam' && cfg.allowNotSure !== false) {
        var ns = h('button', { class: 'opt opt-unsure', type: 'button', on: { click: function () { answer(item, -1, buttons.concat([ns]), card); } } },
          h('span', { class: 'opt-text', text: '🤔 ' + t('common.notSure') }));
        ns.dataset.idx = '-1';
        buttons.push(ns);
        opts.appendChild(ns);
      }
      card.appendChild(opts);
      // Helper tools: read aloud and a 50:50 hint (half points).
      var tools = h('div', { class: 'qtools' });
      if (Speech.available()) {
        tools.appendChild(h('button', { class: 'btn btn-ghost btn-small', type: 'button', text: t('common.listen'),
          on: { click: function () { Speech.say(item.question + '. ' + order.map(function (oi) { return item.options[oi]; }).join('. ')); } } }));
      }
      var wrongIdx = item.options.map(function (o, i) { return i; }).filter(function (i) { return i !== item.correctAnswer; });
      if (!item.scores && item.kind !== 'scam' && wrongIdx.length >= 3 && !cfg.noHint) {
        var hb = h('button', { class: 'btn btn-ghost btn-small btn-hint', type: 'button', text: t('common.hint'), on: { click: function () {
          if (state.answered === state.i) return;
          state.hinted = state.i;
          U.shuffle(wrongIdx).slice(0, 2).forEach(function (wi) {
            buttons.forEach(function (b) { if (+b.dataset.idx === wi) { b.disabled = true; b.classList.add('is-removed'); } });
          });
          hb.disabled = true;
          hb.textContent = t('common.hintUsed');
        } } });
        tools.appendChild(hb);
      }
      if (tools.childNodes.length) card.insertBefore(tools, opts);
      wrap.appendChild(card);
      if (S50.Store.settings.readAloud && Speech.available()) Speech.say(item.question + '. ' + order.map(function (oi) { return item.options[oi]; }).join('. '));
      state.askedAt = Date.now();
      state.timeLimit = 0;
      if (mode === 'challenge' && !cfg.noTimer) {
        var limit = cfg.timeLimit || 40;
        state.timeLimit = limit;
        var left = limit;
        var tEl = h('div', { class: 'timer', attrs: { 'aria-live': 'off' }, text: '⏱ ' + t('common.timeLeft', { n: left }) });
        card.insertBefore(tEl, card.firstChild);
        every(function () {
          left -= 1;
          if (left <= 0) { stopTimers(); answer(item, -2, buttons, card); } else tEl.textContent = '⏱ ' + t('common.timeLeft', { n: left });
        }, 1000);
      }
      if (buttons[0]) try { buttons[0].focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    }

    function answer(item, chosen, buttons, card) {
      if (state.answered === state.i) return;
      state.answered = state.i;
      stopTimers();
      var partial;
      var isCorrect = chosen === item.correctAnswer;
      if (item.scores && chosen >= 0) {
        partial = (item.scores[chosen] || 0) / 100;
        isCorrect = partial >= 1;
      }
      // "Not sure" on a scam: caution earns a little credit, but it is not counted as correct.
      if (chosen === -1 && item.kind === 'scam' && item.isScam) partial = 0.3;
      if (isCorrect) state.streak += 1; else state.streak = 0;
      var speedFrac = 0;
      if (state.timeLimit && isCorrect) speedFrac = Math.max(0, 1 - (Date.now() - state.askedAt) / (state.timeLimit * 1000));
      var pts = S50.Store.Score.question({ correct: isCorrect, partial: isCorrect ? undefined : partial, difficulty: item.difficulty, streak: state.streak, speedFrac: speedFrac });
      if (cfg.flatScoring) pts = isCorrect ? 100 : 0;
      if (state.hinted === state.i) pts = Math.round(pts / 2);
      Array.prototype.forEach.call(card.querySelectorAll('.btn-hint'), function (b) { b.disabled = true; });
      Speech.stop();
      state.score += pts;
      if (isCorrect) state.correct += 1;
      state.results.push({ id: item.id, correct: isCorrect, chosen: chosen });
      S50.Store.recordAnswer(item.category || cfg.cat, isCorrect);
      if (item.kind === 'scam' && isCorrect) S50.Store.bump('scamsSpotted');
      S50.Sound.play(isCorrect ? 'correct' : 'wrong');

      buttons.forEach(function (b) {
        b.disabled = true;
        var idx = +b.dataset.idx;
        if (idx === item.correctAnswer) { b.classList.add('is-correct'); b.appendChild(h('span', { class: 'opt-mark', text: '✓' })); }
        else if (idx === chosen) { b.classList.add('is-wrong'); b.appendChild(h('span', { class: 'opt-mark', text: '✗' })); }
        if (item.scores && idx >= 0 && idx !== item.correctAnswer && item.scores[idx] >= 50 && idx === chosen) {
          b.classList.remove('is-wrong'); b.classList.add('is-partial');
        }
      });

      var verdict;
      if (chosen === -2) verdict = t('common.timeUp');
      else if (isCorrect) verdict = t('common.correct');
      else if (partial >= 0.5 && item.scores) verdict = t('common.partial');
      else verdict = t('common.wrong');
      var fb = h('div', { class: 'feedback ' + (isCorrect ? 'fb-good' : partial >= 0.5 && item.scores ? 'fb-mid' : 'fb-soft'), attrs: { role: 'status', 'aria-live': 'polite' } },
        h('div', { class: 'fb-head' },
          h('strong', { text: verdict }),
          pts > 0 ? h('span', { class: 'fb-points', text: t('common.points', { n: pts }) }) : null));
      if (item.kind === 'scam') {
        fb.appendChild(h('p', { class: 'fb-verdict', text: item.isScam ? t('scam.wasScam') : t('scam.wasSafe') }));
        if (chosen === -1) fb.appendChild(h('p', { text: t('scam.unsure') }));
        if (item.clues.length) {
          fb.appendChild(h('p', { class: 'fb-sub', text: t('scam.clues') }));
          fb.appendChild(h('ul', { class: 'clues' }, item.clues.map(function (c) { return h('li', { text: t('scam.clue.' + c) }); })));
        }
      } else if (!isCorrect) {
        fb.appendChild(h('p', { class: 'fb-answer', text: t('common.correctAnswer', { a: item.options[item.correctAnswer] }) }));
      }
      if (cfg.customFeedback) cfg.customFeedback(item, isCorrect, fb);
      if (item.explanation) fb.appendChild(h('p', { class: 'fb-explain', text: item.explanation }));
      if (item.kind === 'scam') fb.appendChild(h('p', { class: 'fb-rule', text: t('scam.rule') }));
      var last = state.i === items.length - 1;
      var nb = h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: last ? t('common.finish') : t('common.next'), on: { click: function () { state.i += 1; next(); } } });
      fb.appendChild(nb);
      card.appendChild(fb);
      try { nb.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
      if (!U.reducedMotion()) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      else fb.scrollIntoView({ block: 'nearest' });
    }

    function finish() {
      stopTimers();
      var res = { gameId: cfg.gameId, title: cfg.title, cat: cfg.cat, score: state.score, correct: state.correct, total: items.length, results: state.results };
      if (cfg.onFinish) cfg.onFinish(res); else complete(res);
    }
    next();
  }

  /* ---------- Completion screen ---------- */
  function complete(res, opts) {
    opts = opts || {};
    stopTimers();
    var total = U.num(res.total), correct = U.num(res.correct);
    var bonus = opts.noBonus ? 0 : S50.Store.Score.accuracyBonus(correct, total);
    var score = U.num(res.score) + bonus;
    var rec = opts.noRecord ? { best: score, badges: [] } : S50.Store.recordGame({ gameId: res.gameId, cat: res.cat, score: score, correct: correct, total: total });
    if (opts.afterRecord) opts.afterRecord(score, rec);
    var acc = U.pct(correct, total);
    var head = acc >= 90 ? 'excellent' : acc >= 70 ? 'verygood' : acc >= 50 ? 'good' : 'keep';
    S50.Sound.play('complete');
    var body = screen({ title: res.title, cat: res.cat, back: opts.back || 'games' });
    var fbKey = acc >= 50 ? 'feedback.' + (res.cat || 'life') : 'feedback.low';
    var quotes = t('quotes');
    var box = h('div', { class: 'complete card' },
      h('div', { class: 'complete-emoji', attrs: { 'aria-hidden': 'true' }, text: acc >= 70 ? '🌟' : acc >= 50 ? '👍' : '🌱' }),
      h('h2', { class: 'complete-head', text: t('complete.' + head) }),
      h('div', { class: 'complete-score' }, h('span', { class: 'label', text: t('complete.score') }), h('span', { class: 'value', text: U.fmtNum(score) })),
      bonus ? h('p', { class: 'complete-bonus', text: t('complete.bonus', { n: bonus }) }) : null,
      opts.extra || null,
      h('div', { class: 'complete-grid' },
        tile(t('complete.accuracy'), correct + '/' + total),
        tile(t('complete.correct'), '✓ ' + correct),
        tile(t('complete.incorrect'), '✗ ' + (total - correct)),
        tile(t('complete.best'), U.fmtNum(Math.max(rec.best, score)))),
      rec.isBest ? h('p', { class: 'complete-best', text: t('complete.newBest') }) : null,
      h('p', { class: 'complete-fb', text: t(fbKey) }),
      Array.isArray(quotes) ? h('p', { class: 'complete-quote', text: '“' + U.pick(quotes) + '”' }) : null);
    body.appendChild(box);
    var actions = h('div', { class: 'complete-actions' },
      h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: '↻ ' + t('common.playAgain'), on: { click: opts.again || function () { S50.App.go('game/' + res.gameId, true); } } }),
      opts.noNext ? null : h('button', { class: 'btn btn-secondary btn-wide', type: 'button', text: '→ ' + t('common.nextGame'), on: { click: function () { S50.App.go('game/' + S50.Games.nextId(res.gameId)); } } }),
      h('button', { class: 'btn btn-ghost btn-wide', type: 'button', text: '🏠 ' + t('common.home'), on: { click: function () { S50.App.go('home'); } } }));
    body.appendChild(actions);
    (rec.badges || []).forEach(function (b, i) {
      setTimeout(function () { toast(t('complete.badge', { name: t('ach.' + b.id + '.name') }), 3500); }, 600 + i * 900);
    });
    body.appendChild(h('p', { class: 'disclaimer', text: t('progress.disclaimer') }));
  }
  function tile(label, value) {
    return h('div', { class: 'ctile' }, h('span', { class: 'ctile-v', text: value }), h('span', { class: 'ctile-l', text: label }));
  }

  S50.UI = {
    screen: screen, toast: toast, confirm: confirmBox, errorScreen: errorScreen, progressBar: progressBar,
    memorise: memorise, memoContent: memoContent, runQuiz: runQuiz, complete: complete, tile: tile,
    scamBubble: scamBubble, later: later, every: every, stopTimers: stopTimers, Speech: Speech, clockSvg: clockSvg
  };
})();

</script>
  <script>
/* SMART 50+ — game registry, router and start-up. */
(function () {
  'use strict';
  var S50 = window.S50;
  var U = S50.U, h = U.h, t = S50.t;

  /* ---------- Game registry ---------- */
  var ORDER = ['wherekept', 'trip', 'pairs', 'changed', 'oddone', 'clock', 'lamps', 'shapes', 'missing', 'familytree', 'sudoku', 'detective', 'escape', 'lifeexp', 'household', 'grandmaster', 'kirana', 'scam', 'thennow', 'finish', 'words'];
  var games = {};
  S50.Games = {
    ORDER: ORDER,
    register: function (g) { games[g.id] = g; },
    get: function (id) { return games[id] || null; },
    list: function () { return ORDER.map(function (id) { return games[id]; }).filter(Boolean); },
    byCat: function (cat) { return S50.Games.list().filter(function (g) { return g.cat === cat; }); },
    nextId: function (id) { var i = ORDER.indexOf(id); return ORDER[(i + 1) % ORDER.length]; }
  };
  S50.CAT_ICON = { memory: '🧠', attention: '👀', reasoning: '🧩', life: '💰', safety: '🛡️', nostalgia: '❤️', family: '👨‍👩‍👧', mylife: '👤' };

  /* ---------- Settings → page appearance ---------- */
  function applySettings() {
    var s = S50.Store.settings;
    S50.lang = S50.LANGS[s.lang] ? s.lang : 'en';
    var de = document.documentElement;
    de.lang = S50.lang;
    de.classList.toggle('fs-large', s.fontSize === 'large');
    de.classList.toggle('fs-xl', s.fontSize === 'xl');
    de.classList.toggle('high-contrast', !!s.contrast);
    de.classList.toggle('reduce-motion', !!s.reduceMotion);
    de.classList.toggle('theme-dark', s.theme === 'dark');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', s.theme === 'dark' ? '#1d1a17' : '#fff7ee');
    document.title = t('app.name') + ' — ' + t('app.tagline');
  }

  /* ---------- Navigation bar ---------- */
  var NAV = [
    { route: 'home', icon: '🏠', key: 'nav.home' },
    { route: 'games', icon: '🎲', key: 'nav.games' },
    { route: 'daily', icon: '🎯', key: 'nav.daily' },
    { route: 'progress', icon: '🏆', key: 'nav.progress' },
    { route: 'settings', icon: '⚙️', key: 'nav.settings' }
  ];

  /* ---------------- CLOCK READER ---------------- */
  function fmtTime(hh, mm) {

    var after = level >= 0.7;

      var ans = note - bill;
      var opts = nums(ans, [ans + 10, ans - 10, ans + 100, ans - 5, ans + 50]);
      return item(ans % 10 ? 2 : 1, ['kirana'], function (l) {
        return { rc: [[T(l, 'kirana.bill'), m(bill)], [T(l, 'kirana.paid'), m(note)]], q: T(l, 'kirana.qChange'), o: opts.map(m), e: m(note) + ' − ' + m(bill) + ' = ' + m(ans) };
      });
    },
    function unitPrice(r) {
      var g = pick(GOODS.filter(function (x) { return x.u === 'kg' || x.u === 'litre'; }), r);
      var small = ri(g.p[0] / 5, g.p[1] / 5, r) * 5;
      var bigQ = pick([2, 5], r);
      var cheaperBig = r() < 0.6;
      var bigPrice = bigQ * small + (cheaperBig ? -ri(2, 6, r) * 5 * bigQ / 2 : ri(2, 6, r) * 5);
      bigPrice = Math.round(bigPrice / 5) * 5;
      if (bigPrice === bigQ * small) bigPrice -= 5;
      var perBig = bigPrice / bigQ;
      var bigBetter = perBig < small;
      return item(2, ['kirana'], function (l) {
        var A = '1 ' + unit(g.u, l) + ' ' + L(g.n, l) + ' — ' + m(small);

        var o = bigBetter ? [Bp, A] : [A, Bp];
        o.push(T(l, 'kirana.same'));
        return { q: T(l, 'kirana.qUnit'), o: o,
          e: T(l, 'kirana.eUnit', { a: m(small), b: m(bigPrice), q: bigQ, per: m(Math.round(perBig * 100) / 100), u: unit(g.u, l) }) };
      });
    },
    function discount(r) {
      var g = pick([['Pressure cooker', 'प्रेशर कुकर'], ['Bedsheet', 'चादर'], ['Ceiling fan', 'छत का पंखा'], ['Umbrella', 'छाता'], ['Shawl', 'शॉल'], ['Wall clock', 'दीवार घड़ी']], r);
      var price = ri(4, 40, r) * 100;

      });
    },
    function split(r) {
      var n = ri(2, 6, r);
      var each = ri(8, 80, r) * 10;

      });
    }
  ];
  B.addGenerator('life', function (r) { return pick(KIRANA, r)(r); }, 'kirana');
})();

    S('S12', 1, 'whatsapp', '+44 7xxx xxx 908', true, ['job', 'payment', 'returns'],

      ['पार्ट-टाइम नौकरी! घर बैठे सिर्फ़ वीडियो लाइक करके रोज़ ₹5,000 कमाएँ। आज शुरू करने के लिए ₹1,500 रजिस्ट्रेशन भरें। सीमित सीटें!', 'आसान काम के लिए आसान पैसा और पहले फ़ीस — नौकरी के नाम पर ठगी का पुराना तरीका।']),
    S('S13', 2, 'call', '+91 140 xxx xxxx', true, ['remote', 'fear', 'urgency'],
      ['“Sir, your phone has a virus that is stealing bank data. Please install the app called ScreenHelp so our engineer can fix it for you right now.”', 'Screen-sharing apps let strangers see and control your phone, including OTPs. Never install them on a caller’s request.'],

    S('S14', 2, 'sms', 'VD-PMYOJN', true, ['govt', 'link', 'payment'],
      ['Govt Senior Citizen Scheme: Get ₹10,000 monthly pension. Register at http://pension-yojana-reg.in and pay ₹299 verification fee.', 'Government schemes do not ask for fees through random SMS links. Check only on official government websites or offices.'],
      ['सरकारी वरिष्ठ नागरिक योजना: हर महीने ₹10,000 पेंशन पाएँ। http://pension-yojana-reg.in पर पंजीकरण करें और ₹299 सत्यापन शुल्क भरें।', 'सरकारी योजनाएँ किसी भी SMS लिंक से फ़ीस नहीं माँगतीं। केवल आधिकारिक सरकारी वेबसाइट या दफ़्तर से जाँचें।']),
    S('S15', 2, 'whatsapp', 'Unknown number', true, ['emotion', 'payment', 'sender'],
      ['Hi Mummy, this is my new number, old phone fell in water. I need to pay a hospital bill urgently, please send ₹18,000 to this account. Don’t call, I can’t talk now.', 'A “new number” plus urgent money and “don’t call” is a common impersonation trick. Call your child on the old number first.'],
      ['हाय मम्मी, यह मेरा नया नंबर है, पुराना फ़ोन पानी में गिर गया। अस्पताल का बिल तुरंत भरना है, इस खाते में ₹18,000 भेज दो। फ़ोन मत करना, अभी बात नहीं कर सकता।', '“नया नंबर”, तुरंत पैसे और “फ़ोन मत करना” — यह किसी का रूप धरकर ठगी का तरीका है। पहले बच्चे को पुराने नंबर पर फ़ोन करें।']),
    S('S16', 2, 'sms', 'AM-PRGBNK', false, ['official', 'info'],
      ['Your Pragati Bank fixed deposit of ₹50,000 matures on 15-Nov. Visit your branch or use the official app to renew or close.', 'A plain reminder that points you to your own branch or the official app — no link, no request for details.'],
      ['आपकी प्रगति बैंक की ₹50,000 की एफ़डी 15-नवंबर को पूरी हो रही है। नवीनीकरण या बंद करने के लिए अपनी शाखा जाएँ या आधिकारिक ऐप इस्तेमाल करें।', 'एक सादा अनुस्मारक जो आपको अपनी शाखा या आधिकारिक ऐप पर भेजता है — कोई लिंक नहीं, कोई जानकारी नहीं माँगी।']),
    S('S17', 2, 'social', 'Stock Guru Official', true, ['returns', 'urgency', 'secrecy'],
      ['Join our VIP group! Our tips give 300% returns in one month, 100% guaranteed. Only 10 seats left. Do not share with anyone.', 'Guaranteed huge returns, a deadline and secrecy are three warning signs together.'],
      ['हमारे VIP ग्रुप से जुड़ें! हमारी टिप्स से एक महीने में 300% मुनाफ़ा, 100% गारंटी। सिर्फ़ 10 सीटें बाकी। किसी को न बताएँ।', 'पक्का भारी मुनाफ़ा, समय-सीमा और गोपनीयता — तीनों चेतावनी के संकेत एक साथ।']),
    S('S18', 2, 'call', 'Courier Office', true, ['fear', 'otp', 'remote'],
      ['“Madam, a parcel in your name with illegal items was seized. To avoid police action, connect on video call and share your Aadhaar and bank OTP for verification.”', 'Fear of police plus requests for OTP and ID is a known “parcel scam”. Real authorities do not work like this.'],
      ['“मैडम, आपके नाम का एक पार्सल ग़ैरक़ानूनी सामान के साथ पकड़ा गया है। पुलिस कार्रवाई से बचने के लिए वीडियो कॉल पर जुड़ें और सत्यापन के लिए आधार और बैंक OTP बताएँ।”', 'पुलिस का डर और OTP व पहचान की माँग — यह जाना-माना “पार्सल घोटाला” है। असली अधिकारी ऐसे काम नहीं करते।']),
    S('S19', 2, 'email', 'noreply@cityelectric.example', false, ['official', 'info'],
      ['Your electricity bill for September is ₹1,240, due on 20-Oct. You can pay at the counter or through your usual payment method. No action needed if already paid.', 'Bill information with no threats, no strange link and no request for personal details.'],
      ['सितंबर का आपका बिजली बिल ₹1,240 है, अंतिम तिथि 20-अक्टूबर। आप काउंटर पर या अपने सामान्य तरीके से भुगतान कर सकते हैं। पहले ही भर दिया है तो कुछ करने की ज़रूरत नहीं।', 'बिल की जानकारी — न धमकी, न अजीब लिंक, न निजी जानकारी की माँग।']),
    S('S20', 2, 'sms', 'TX-REFUND', true, ['link', 'kyc', 'sender'],
      ['Income Tax refund of ₹15,490 approved. Update your bank account at http://it-refund-claim.site to receive it today.', 'Tax refunds go directly to the account you already registered. They never need a link from a random SMS.'],
      ['₹15,490 का आयकर रिफ़ंड मंज़ूर। आज ही पाने के लिए http://it-refund-claim.site पर अपना बैंक खाता अपडेट करें।', 'टैक्स रिफ़ंड सीधे आपके पहले से दर्ज खाते में आता है। इसके लिए किसी SMS लिंक की ज़रूरत नहीं होती।']),
    S('S21', 2, 'whatsapp', 'Sunita (neighbour)', false, ['expected', 'info'],
      ['Good morning! The society meeting is on Sunday at 11 am in the community hall. Tea will be served. 🙏', 'An ordinary message from someone you know, about something real, asking nothing from you.'],
      ['सुप्रभात! सोसाइटी की बैठक रविवार सुबह 11 बजे सामुदायिक भवन में है। चाय की व्यवस्था रहेगी। 🙏', 'किसी जानने वाले का साधारण संदेश, असली बात के बारे में, आपसे कुछ नहीं माँगा।']),
    S('S22', 2, 'upi', 'olx-buyer@upi', true, ['qr', 'collect'],
      ['A buyer for your old sofa says: “I’ll pay ₹8,000 now. Just scan this QR code and enter your PIN to receive the payment.”', 'Scanning a QR code and entering a PIN always sends money. To receive money you do nothing.'],
      ['आपके पुराने सोफ़े का ख़रीदार कहता है: “मैं अभी ₹8,000 देता हूँ। पैसे पाने के लिए बस यह QR कोड स्कैन करके अपना PIN डालिए।”', 'QR स्कैन करके PIN डालने पर हमेशा पैसे जाते हैं। पैसे पाने के लिए आपको कुछ नहीं करना पड़ता।']),
    S('S23', 2, 'sms', 'VM-SIMUPD', true, ['urgency', 'fear', 'sender'],
      ['Your SIM card will be deactivated in 2 hours due to pending e-KYC. Call 7XXXXXXX45 now to avoid disconnection.', 'Mobile companies do not threaten to cut your SIM within hours via SMS from unknown numbers.'],

    S('S24', 2, 'call', 'Insurance Desk', true, ['payment', 'returns', 'urgency'],
      ['“Your old insurance policy has a bonus of ₹4,80,000 waiting. Just deposit ₹12,000 as release charges today and the money will come tomorrow.”', 'Paying money to release money is a classic advance-fee scam.'],
      ['“आपकी पुरानी बीमा पॉलिसी पर ₹4,80,000 का बोनस रुका है। आज ₹12,000 रिलीज़ चार्ज जमा कर दीजिए, कल पैसा आ जाएगा।”', 'पैसे छुड़ाने के लिए पैसे भरना — यह पहले फ़ीस वाली ठगी का पुराना तरीका है।']),
    S('S25', 2, 'sms', 'AD-PHARMA', false, ['info', 'expected'],

    S('S26', 2, 'whatsapp', 'Bank Help Center ✅', true, ['sender', 'pin', 'kyc'],
