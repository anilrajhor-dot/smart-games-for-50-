/* SMART 50+ — warm, high-legibility, mobile-first styles */
:root {
  --bg: #fff7ee;
  --surface: #ffffff;
  --surface-2: #fdf0e1;
  --text: #2a2118;
  --muted: #5b4f43;
  --border: #e6d5c1;
  --primary: #a63d17;
  --primary-ink: #ffffff;
  --primary-soft: #fbe3d6;
  --secondary: #1d5c68;
  --secondary-ink: #ffffff;
  --good: #1b6e3e;
  --good-bg: #e2f3e7;
  --bad: #a3271f;
  --bad-bg: #fbe8e5;
  --mid: #7a4f00;
  --mid-bg: #fff0d1;
  --focus: #1d5c68;
  --shadow: 0 2px 10px rgba(80, 50, 20, 0.08);
  --radius: 16px;
  --c-memory: #64399a;
  --c-attention: #0d6672;
  --c-reasoning: #27589f;
  --c-life: #2a7349;
  --c-safety: #a8352a;
  --c-nostalgia: #9b3263;
  --c-family: #7f521b;
  --nav-h: 76px;
  color-scheme: light;
}
:root.theme-dark {
  --bg: #1d1a17;
  --surface: #2a2622;
  --surface-2: #342f2a;
  --text: #f6eee4;
  --muted: #d3c5b5;
  --border: #4d443b;
  --primary: #f0956a;
  --primary-ink: #1d1a17;
  --primary-soft: #4a3226;
  --secondary: #7cc7d3;
  --secondary-ink: #10282c;
  --good: #8fdcaa;
  --good-bg: #1f3a29;
  --bad: #ffaaa1;
  --bad-bg: #45231f;
  --mid: #ffd27a;
  --mid-bg: #45361a;
  --focus: #ffd27a;
  --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}
:root.high-contrast {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #ffffff;
  --text: #000000;
  --muted: #000000;
  --border: #000000;
  --primary: #00307a;
  --primary-ink: #ffffff;
  --primary-soft: #e6eeff;
  --secondary: #000000;
  --secondary-ink: #ffffff;
  --good: #004d1a;
  --good-bg: #ffffff;
  --bad: #8a0000;
  --bad-bg: #ffffff;
  --mid: #5a3a00;
  --mid-bg: #ffffff;
  --focus: #c00000;
  --c-memory: #3d1466; --c-attention: #003f47; --c-reasoning: #0b2f66; --c-life: #0b4022; --c-safety: #6e0f06; --c-nostalgia: #5e0a33; --c-family: #4a2a00;
}
:root.high-contrast.theme-dark {
  --bg: #000000; --surface: #000000; --surface-2: #000000; --text: #ffffff; --muted: #ffffff; --border: #ffffff;
  --primary: #ffd400; --primary-ink: #000000; --primary-soft: #222; --secondary: #ffffff; --secondary-ink: #000000;
  --good: #7dff9a; --good-bg: #000; --bad: #ff8a80; --bad-bg: #000; --mid: #ffd400; --mid-bg: #000; --focus: #ffd400;
}

* { box-sizing: border-box; }
html { font-size: 112.5%; -webkit-text-size-adjust: 100%; }
html.fs-large { font-size: 125%; }
html.fs-xl { font-size: 142%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Nirmala UI", "Mangal", Ubuntu, "Helvetica Neue", Arial, sans-serif;
  font-weight: 450;
  line-height: 1.55;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5rem; font-weight: 750; }
p { margin: 0 0 .75rem; }
a { color: var(--secondary); }
button, input, select { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 8px; }
.high-contrast :focus-visible { outline-width: 4px; }

#app { min-height: 100vh; }
#view {
  max-width: 980px;
  margin: 0 auto;
  padding: 1rem 1rem calc(var(--nav-h) + 1.5rem);
  min-width: 0;
}
body.no-nav #nav { display: none; }
body.no-nav #view { padding-bottom: 2rem; }

/* ---------- Navigation ---------- */
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface);
  border-top: 1px solid var(--border);
  box-shadow: 0 -2px 12px rgba(0, 0, 0, .06);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-brand { display: none; }
.nav-list { display: flex; list-style: none; margin: 0; padding: 0; }
.nav-list li { flex: 1; min-width: 0; }
.nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: var(--nav-h); padding: 6px 2px; text-decoration: none; color: var(--muted);
  font-size: .78rem; font-weight: 650; text-align: center;
}
.nav-item .nav-icon { font-size: 1.5rem; line-height: 1; }
.nav-item .nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.nav-item.active { color: var(--primary); }
.nav-item.active .nav-label { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }

@media (min-width: 900px) {
  #nav {
    top: 0; right: auto; width: 250px; border-top: 0; border-right: 1px solid var(--border);
    box-shadow: none; padding: 1.25rem .75rem;
  }
  .nav-brand { display: flex; flex-direction: column; padding: 0 .75rem 1.25rem; }
  .nav-logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: .5px; }
  .nav-tag { font-size: .8rem; color: var(--muted); }
  .nav-list { flex-direction: column; gap: .25rem; }
  .nav-item { flex-direction: row; justify-content: flex-start; gap: .75rem; min-height: 56px; padding: .5rem .9rem; border-radius: 12px; font-size: 1rem; }
  .nav-item.active { background: var(--primary-soft); }
  .nav-item.active .nav-label { text-decoration: none; }
  #view { margin-left: 250px; margin-right: 0; padding: 1.5rem 2rem 2rem; max-width: 1000px; }
  body.no-nav #view { margin: 0 auto; }
}
@media (min-width: 1300px) { #view { margin-left: calc(250px + (100vw - 250px - 1000px) / 2); } }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 54px; padding: .7rem 1.25rem; border-radius: 14px; border: 2px solid transparent;
  font-weight: 750; font-size: 1rem; text-decoration: none; cursor: pointer; text-align: center;

}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-secondary { background: var(--secondary); color: var(--secondary-ink); }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn-danger { background: var(--bad); color: #fff; }
.theme-dark .btn-danger { color: #1d1a17; }
.btn-wide { width: 100%; margin-top: .75rem; }
.btn-big { min-height: 64px; font-size: 1.15rem; }
.btn-small { min-height: 44px; padding: .4rem .8rem; font-size: .9rem; }
.high-contrast .btn { border-color: var(--text); }

/* ---------- Cards & common ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1.1rem; box-shadow: var(--shadow); margin-bottom: 1rem; min-width: 0;
}
.high-contrast .card { border-width: 2px; box-shadow: none; }
.card-title { font-size: 1.1rem; margin-bottom: .75rem; }
.lead { font-size: 1.1rem; }
.hint { color: var(--muted); font-size: .95rem; }
.disclaimer { color: var(--muted); font-size: .85rem; text-align: center; margin-top: 1.25rem; }
.section-title { font-size: 1.2rem; margin: 1.5rem 0 .75rem; }
.big-emoji { font-size: 3rem; line-height: 1.2; text-align: center; }
.private { background: var(--good-bg); color: var(--good); border-radius: 12px; padding: .6rem .9rem; font-weight: 650; }
.chip-row { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip {
  display: inline-flex; align-items: center; min-height: 44px; padding: .4rem .9rem; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text); text-decoration: none; font-weight: 650;
}
.chip-big { min-height: 52px; padding: .5rem 1.1rem; }
.bar { height: 14px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
.bar-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width .4s ease; }

/* ---------- Screen header ---------- */
.screen-head {
  display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
  margin: -.25rem 0 1rem; padding: .5rem 0 .75rem; border-bottom: 3px solid var(--primary-soft);
}
.screen-head.cat-memory { border-color: var(--c-memory); }
.screen-head.cat-attention { border-color: var(--c-attention); }
.screen-head.cat-reasoning { border-color: var(--c-reasoning); }
.screen-head.cat-life { border-color: var(--c-life); }
.screen-head.cat-safety { border-color: var(--c-safety); }
.screen-head.cat-nostalgia { border-color: var(--c-nostalgia); }
.screen-head.cat-family { border-color: var(--c-family); }
.btn-back {
  min-height: 48px; min-width: 48px; padding: .4rem 1rem; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--border); background: var(--surface); font-weight: 750; font-size: 1rem;
}
.screen-title { display: flex; align-items: center; gap: .5rem; min-width: 0; flex: 1; }
.screen-title h1 { font-size: 1.35rem; margin: 0; overflow-wrap: anywhere; }
.screen-title h1:focus { outline: none; }
.screen-icon { font-size: 1.6rem; }
.screen-body { min-width: 0; }

/* ---------- Home ---------- */
.hero {
  background: linear-gradient(135deg, #fbe0c9 0%, #fdf0e1 55%, #e5f0ee 100%);
  border-radius: 22px; padding: 1.25rem 1.25rem 1rem; margin-bottom: 1rem; border: 1px solid var(--border);
}
.theme-dark .hero { background: linear-gradient(135deg, #4a3226 0%, #342f2a 60%, #24363a 100%); }

.hero-title { font-size: 2.1rem; color: var(--primary); letter-spacing: .5px; margin: 0; }
.hero-tag { font-weight: 650; color: var(--muted); margin: 0 0 .75rem; }
.hero-greet { font-size: 1.3rem; font-weight: 750; margin: 0; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .6rem; margin-bottom: 1rem; }
.stats-3 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat {

  display: flex; flex-direction: column; min-width: 0;
}
.stat-icon { font-size: 1.2rem; }

.daily-cta {
  display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.2rem; border-radius: 20px; margin-bottom: 1rem;
  background: linear-gradient(135deg, var(--primary), #c7612e); color: #fff; text-decoration: none; box-shadow: var(--shadow);
}
.theme-dark .daily-cta, .high-contrast .daily-cta { background: var(--primary); color: var(--primary-ink); }
.daily-cta-icon { font-size: 2.6rem; }
.daily-cta-text { display: flex; flex-direction: column; min-width: 0; }
.daily-cta-text strong { font-size: 1.15rem; letter-spacing: .3px; }
.level-bar .level-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .25rem 1rem; margin-bottom: .5rem; }
.level-bar .level-row span { color: var(--muted); font-size: .9rem; }
.cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
@media (min-width: 640px) { .cat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.cat-card {
  display: flex; flex-direction: column; gap: .25rem; padding: 1rem; min-height: 130px; border-radius: 18px;
  color: #fff; text-decoration: none; box-shadow: var(--shadow); min-width: 0;
}
.cat-icon { font-size: 2.2rem; line-height: 1.1; }
.cat-name { font-size: 1.05rem; font-weight: 800; letter-spacing: .4px; overflow-wrap: anywhere; }
.cat-desc { font-size: .88rem; opacity: .95; }
.cat-card.cat-memory, .cat-bg-memory { background: linear-gradient(140deg, var(--c-memory), #8058b8); }
.cat-card.cat-attention, .cat-bg-attention { background: linear-gradient(140deg, var(--c-attention), #1b8a96); }
.cat-card.cat-reasoning, .cat-bg-reasoning { background: linear-gradient(140deg, var(--c-reasoning), #3d74c2); }
.cat-card.cat-life, .cat-bg-life { background: linear-gradient(140deg, var(--c-life), #3a9160); }
.cat-card.cat-safety, .cat-bg-safety { background: linear-gradient(140deg, var(--c-safety), #c4513f); }
.cat-card.cat-nostalgia, .cat-bg-nostalgia { background: linear-gradient(140deg, var(--c-nostalgia), #b84f80); }
.high-contrast .cat-card, .high-contrast [class*="cat-bg-"] { background: var(--c-memory); }
.high-contrast .cat-card.cat-attention, .high-contrast .cat-bg-attention { background: var(--c-attention); }
.high-contrast .cat-card.cat-reasoning, .high-contrast .cat-bg-reasoning { background: var(--c-reasoning); }
.high-contrast .cat-card.cat-life, .high-contrast .cat-bg-life { background: var(--c-life); }
.high-contrast .cat-card.cat-safety, .high-contrast .cat-bg-safety { background: var(--c-safety); }
.high-contrast .cat-card.cat-nostalgia, .high-contrast .cat-bg-nostalgia { background: var(--c-nostalgia); }
.feat-grid, .more-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: .6rem; }
@media (min-width: 640px) { .feat-grid, .more-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.feat-card, .more-card, .personal-note {
  display: flex; align-items: center; gap: .9rem; padding: .9rem 1rem; border-radius: 16px; min-height: 72px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text); text-decoration: none; min-width: 0;
}
.feat-card { border-left: 6px solid var(--primary); }
.personal-note { margin-top: 1rem; background: var(--surface-2); }
.feat-icon, .more-icon { font-size: 1.9rem; flex: 0 0 auto; }
.feat-text, .more-text { display: flex; flex-direction: column; min-width: 0; }
.feat-text span, .more-text span { color: var(--muted); font-size: .9rem; }
.quote { margin-top: 1rem; background: var(--surface-2); }
.quote-title { font-weight: 750; color: var(--muted); font-size: .9rem; }
.quote p { font-size: 1.15rem; font-style: italic; margin: .25rem 0 0; }
.footer-links { text-align: center; margin-top: 1rem; }
.footer-links a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 650; }

/* ---------- Games list ---------- */
.game-section { margin-bottom: .5rem; }
.cat-title { display: flex; align-items: center; gap: .25rem; }
.game-card {
  display: flex; align-items: center; gap: 1rem; padding: 1rem; margin-bottom: .6rem; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--border); border-left: 7px solid var(--primary);
  text-decoration: none; color: var(--text); min-height: 84px; min-width: 0;
}
.game-card.cat-memory { border-left-color: var(--c-memory); }
.game-card.cat-attention { border-left-color: var(--c-attention); }
.game-card.cat-reasoning { border-left-color: var(--c-reasoning); }
.game-card.cat-life { border-left-color: var(--c-life); }
.game-card.cat-safety { border-left-color: var(--c-safety); }
.game-card.cat-nostalgia { border-left-color: var(--c-nostalgia); }
.game-card.cat-family { border-left-color: var(--c-family); }
.game-icon { font-size: 2.1rem; flex: 0 0 auto; }
.game-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.game-text strong { font-size: 1.08rem; }
.game-text span { color: var(--muted); font-size: .92rem; }
.game-text .game-best { font-weight: 650; color: var(--secondary); }
.game-play {
  flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--primary); color: var(--primary-ink); font-size: 1.1rem;
}
.decade-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
@media (min-width: 640px) { .decade-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.decade-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25rem; padding: 1rem;
  min-height: 110px; border-radius: 16px; background: var(--surface); border: 2px solid var(--border);
  text-decoration: none; color: var(--text); font-weight: 750; font-size: 1.1rem; text-align: center;
}
.decade-card.wide { flex-direction: row; justify-content: flex-start; min-height: 76px; margin-bottom: .6rem; gap: .9rem; }
.decade-icon { font-size: 2rem; }
.region-tag { display: inline-block; background: var(--primary-soft); color: var(--text); border-radius: 999px; padding: .2rem .8rem; font-weight: 700; }

/* ---------- Quiz ---------- */
.qprogress { margin-bottom: .9rem; }
.qprogress-label { display: block; font-weight: 700; color: var(--muted); margin-bottom: .35rem; }
.qcard { padding: 1.2rem; }
.qintro { color: var(--muted); font-weight: 650; }
.qtext { font-size: 1.25rem; margin: .25rem 0 1rem; overflow-wrap: anywhere; }
.qdisplay {
  font-size: 1.6rem; font-weight: 800; letter-spacing: 2px; text-align: center; padding: .9rem; margin-bottom: .8rem;
  background: var(--surface-2); border-radius: 14px; overflow-wrap: anywhere; line-height: 1.6;
}
.qdisplay .obj-svg { width: 2.4rem; height: 3.2rem; }
.options { display: grid; grid-template-columns: minmax(0, 1fr); gap: .65rem; }
.options-big { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.options-big .opt { justify-content: center; text-align: center; font-size: 1.35rem; font-weight: 800; letter-spacing: 1px; }
.options-scam { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.options-scam .opt-unsure { grid-column: 1 / -1; }
.opt {
  display: flex; align-items: center; justify-content: space-between; gap: .75rem; width: 100%;
  min-height: 60px; padding: .8rem 1rem; border-radius: 14px; cursor: pointer; text-align: left;
  background: var(--surface); border: 2px solid var(--border); font-size: 1.05rem; font-weight: 600; color: var(--text);
  transition: border-color .15s ease, background .15s ease;
}
.opt:hover:not([disabled]) { border-color: var(--primary); }
.opt[disabled] { cursor: default; }
.opt-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt-mark { font-size: 1.4rem; font-weight: 900; flex: 0 0 auto; }
.opt.is-correct { background: var(--good-bg); border-color: var(--good); color: var(--good); border-width: 3px; }
.opt.is-wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); border-width: 3px; }
.opt.is-partial { background: var(--mid-bg); border-color: var(--mid); color: var(--mid); border-width: 3px; }
.opt-scam, .opt-safe { justify-content: center; text-align: center; font-size: 1.25rem; font-weight: 800; min-height: 72px; }
.opt-scam:not([disabled]) { border-color: var(--bad); }
.opt-safe:not([disabled]) { border-color: var(--good); }
.opt-unsure { justify-content: center; text-align: center; }
.feedback { border-radius: 14px; padding: 1rem; margin-top: 1rem; border: 2px solid; }
.fb-good { background: var(--good-bg); border-color: var(--good); }
.fb-soft { background: var(--surface-2); border-color: var(--border); }
.fb-mid { background: var(--mid-bg); border-color: var(--mid); }
.fb-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; font-size: 1.15rem; margin-bottom: .5rem; }
.fb-good .fb-head strong { color: var(--good); }
.fb-mid .fb-head strong { color: var(--mid); }
.fb-points { background: var(--surface); border-radius: 999px; padding: .15rem .7rem; font-weight: 800; color: var(--primary); }
.fb-answer { font-weight: 750; }
.fb-verdict { font-weight: 800; font-size: 1.1rem; }
.fb-sub { font-weight: 750; margin-bottom: .25rem; }
.fb-rule { font-weight: 750; background: var(--surface); border-radius: 10px; padding: .5rem .75rem; }
.clues { margin: 0 0 .75rem; padding-left: 1.4rem; }
.clues li { margin-bottom: .25rem; }
.timer { display: inline-block; font-weight: 800; color: var(--secondary); margin-bottom: .5rem; }
.memo-card { text-align: left; }
.memo-title { font-weight: 800; font-size: 1.15rem; color: var(--secondary); margin-bottom: .75rem; }
.memo-content { font-size: 1.3rem; font-weight: 700; background: var(--surface-2); padding: 1rem; border-radius: 14px; margin-bottom: .75rem; overflow-wrap: anywhere; }
.memo-content p:last-child { margin-bottom: 0; }
.btn-ready { min-height: 64px; font-size: 1.2rem; }

/* Spot the scam phone mock-up */
.phone { border: 2px solid var(--border); border-radius: 20px; overflow: hidden; margin-bottom: 1rem; background: var(--surface-2); }
.phone-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .25rem .75rem; padding: .6rem .9rem; background: var(--surface); border-bottom: 1px solid var(--border); font-size: .92rem; }

.phone-from { color: var(--muted); overflow-wrap: anywhere; }
.bubble {
  margin: .9rem; padding: .9rem 1rem; background: var(--surface); border-radius: 4px 18px 18px 18px;
  border: 1px solid var(--border); font-size: 1.08rem; overflow-wrap: anywhere; box-shadow: var(--shadow);
}

.high-contrast .ch-whatsapp .bubble { background: var(--surface); color: var(--text); }

/* ---------- Where did I keep it ---------- */
.room {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; padding: .6rem; border-radius: 16px;
  background: linear-gradient(180deg, #f6e4cf 0%, #f6e4cf 40%, #e6cba8 40%, #e6cba8 100%); margin-bottom: .9rem;
}

.spot {

}

.spot-icon { font-size: 1.6rem; line-height: 1.1; }

.obj { width: 100%; display: flex; flex-direction: column; align-items: center; background: var(--primary-soft); border: 2px solid var(--primary); border-radius: 10px; padding: .15rem .35rem; margin-top: .15rem; }
.obj-emoji { font-size: 1.6rem; line-height: 1.1; }
.obj-svg { width: 1.4rem; height: 2rem; }

/* ---------- What changed ---------- */

.scene-office { background: #e6edf5; } .scene-station { background: #ece6dc; } .scene-dining { background: #f8e6dd; } .scene-living { background: #f3e9df; }

.cell {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem;
  min-height: 74px; padding: .3rem .2rem; border-radius: 12px; background: rgba(255, 255, 255, .85); border: 2px solid transparent; min-width: 0;
}

.blink-card { text-align: center; padding: 2.5rem 1rem; }

/* ---------- Memory trip ---------- */

.stop-card { min-width: 0; }
.stop-city { font-size: 1.6rem; color: var(--primary); margin-bottom: .25rem; }

/* ---------- Family tree ---------- */

/* ---------- Household ---------- */

.brow { display: grid; grid-template-columns: minmax(0, 1fr) 48px minmax(96px, auto) 48px; align-items: center; gap: .4rem; padding: .35rem .5rem; border-radius: 12px; background: var(--surface-2); }

/* SMART 50+ — soft sounds made with the Web Audio API (no audio files needed). */
(function () {
  'use strict';
  var S50 = window.S50;
  var ctx = null;

  function getCtx() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC(); } catch (e) { ctx = null; }
    return ctx;
  }
  function tone(c, freq, start, dur, vol, type) {
    var o = c.createOscillator();
    var g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    var t0 = c.currentTime + start;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  var PATTERNS = {
    correct: [[659, 0, 0.18], [880, 0.12, 0.28]],
    wrong: [[330, 0, 0.3]],
    tap: [[520, 0, 0.08]],
    complete: [[523, 0, 0.22], [659, 0.15, 0.22], [784, 0.3, 0.25], [1047, 0.45, 0.45]]
  };

  S50.Sound = {
    play: function (name, force) {
      if (!force && !(S50.Store && S50.Store.settings.sound)) return;
      var c = getCtx();
      if (!c) return;
      try {
        if (c.state === 'suspended') c.resume();
        (PATTERNS[name] || PATTERNS.tap).forEach(function (p) { tone(c, p[0], p[1], p[2], name === 'wrong' ? 0.06 : 0.08, name === 'wrong' ? 'triangle' : 'sine'); });
      } catch (e) { /* sound is optional */ }
    }
  };
})();

/* SMART 50+ — question engine.
 * Raw bank items are compact; normalize() turns them into the full schema:
 *   { id, category, difficulty, question, options, correctAnswer, explanation, language, tags, ... }
 */
(function () {
  'use strict';
  var S50 = window.S50;
  var U = S50.U;

  var raw = {};          // category -> [raw items]
  var generators = {};   // category -> [fn(rnd, index) -> raw item]
  var sessionSeen = {};  // id -> true (this session only)

  function add(cat, items) {
    raw[cat] = (raw[cat] || []).concat(items.map(function (it) { it.cat = it.cat || cat; return it; }));
  }
  function addGenerator(cat, fn) { (generators[cat] = generators[cat] || []).push(fn); }

  /* Build the static generated bank once (fixed seed so ids stay stable). */
  function buildGenerated(perGenerator) {
    Object.keys(generators).forEach(function (cat) {
      generators[cat].forEach(function (fn, gi) {
        var rnd = U.rng(1000 + gi * 77 + U.hashStr(cat));
        var items = [];
        for (var i = 0; i < perGenerator; i++) {
          var it = fn(rnd, i);
          if (it) { it.id = it.id || (cat.charAt(0).toUpperCase() + 'G' + gi + '-' + i); it.gen = true; items.push(it); }
        }
        add(cat, items);
      });
    });
  }

  function normalize(r) {
    var lang = S50.lang;
    var L = r[lang] || r.en || {};
    var E = r.en || {};
    var base = {
      id: r.id, category: r.cat, difficulty: r.d || 1, language: r[lang] ? lang : 'en',
      tags: r.t || [], raw: r
    };
    if (r.kind === 'scam') {
      base.kind = 'scam';
      base.question = S50.t('scam.q');
      base.options = [S50.t('scam.isScam'), S50.t('scam.isSafe')];
      base.correctAnswer = r.scam ? 0 : 1;
      base.explanation = L.e || E.e || '';
      base.message = { channel: r.ch, from: r.from, text: L.m || E.m || '' };
      base.clues = r.clues || [];
      base.isScam = !!r.scam;
      return base;
    }
    base.question = L.q || E.q || '';
    base.options = (L.o && L.o.length ? L.o : E.o || []).slice();
    base.correctAnswer = r.a || 0;
    base.explanation = L.e || E.e || '';
    if (L.m || E.m) base.memo = L.m || E.m;
    if (L.disp || E.disp) base.display = L.disp || E.disp;
    if (r.s) base.scores = r.s.slice();
    if (r.big) base.bigOptions = true;
    return base;
  }

  function count(cat, filter) {
    return (raw[cat] || []).filter(filter || function () { return true; }).length;
  }

  /* Draw n items, preferring ones not seen this session or recently. */
  function draw(cat, n, opts) {
    opts = opts || {};
    var rnd = opts.rnd || Math.random;
    var pool = (raw[cat] || []).filter(opts.filter || function () { return true; });
    var chosen;
    if (opts.noAvoid) {
      chosen = U.sample(pool, n, rnd);
    } else {
      var recent = S50.Store.recent(cat);
      var fresh = pool.filter(function (r) { return !sessionSeen[r.id] && recent.indexOf(r.id) < 0; });
      var notSession = pool.filter(function (r) { return !sessionSeen[r.id] && fresh.indexOf(r) < 0; });
      var rest = pool.filter(function (r) { return fresh.indexOf(r) < 0 && notSession.indexOf(r) < 0; });
      chosen = U.shuffle(fresh, rnd).concat(U.shuffle(notSession, rnd), U.shuffle(rest, rnd)).slice(0, n);
      chosen.forEach(function (r) { sessionSeen[r.id] = true; });
      S50.Store.markSeen(cat, chosen.map(function (r) { return r.id; }));
    }
    if (opts.sort) chosen.sort(function (a, b) { return (a.d || 1) - (b.d || 1); });
    return chosen.map(normalize);
  }

  /* Freshly generated items (e.g. for the daily challenge, seeded by date). */
  function fresh(cat, n, rnd) {
    var gens = generators[cat] || [];
    if (!gens.length) return [];
    var out = [];
    for (var i = 0; i < n; i++) {
      var gi = Math.floor(rnd() * gens.length);
      var it = gens[gi](rnd, i);
      it.id = 'D-' + cat + '-' + gi + '-' + i;
      it.cat = cat;
      out.push(normalize(it));
    }
    return out;
  }

  S50.Bank = {
    add: add, addGenerator: addGenerator, buildGenerated: buildGenerated, normalize: normalize,
    draw: draw, fresh: fresh, count: count,
    all: function (cat) { return (raw[cat] || []).slice(); },
    categories: function () { return Object.keys(raw); }
  };
})();

/* SMART 50+ — procedural question generators (Memory, Attention, Reasoning).

  B.addGenerator('memory', function (r) {

    if (n === 0) { row[1] = d; n = 1; }
    var opts = uniqueNums(n, [n + 1, n - 1, n + 2, n - 2]);
    return item(2, ['count'], function (l) {
      return { disp: row.join(' '), q: T(l, 'gen.attCountDigit', { d: d }), o: opts.map(String), e: T(l, 'gen.eRecall', { ans: n }) };
    });
  });
  var PICS = ['🍎', '🍌', '🍇', '🥭', '🍋', '🍉', '🥥', '🍒', '🌸', '🌻', '🍀', '⭐', '🔔', '🎈'];
  B.addGenerator('attention', function (r) {
    var set = sample(PICS, 5, r);
    var once = set[0];
    var row = [once];
    set.slice(1).forEach(function (p) { var k = ri(2, 3, r); for (var i = 0; i < k; i++) row.push(p); });

    var others = sample(set.slice(1), 3, r);
    var it = item(row.length > 11 ? 2 : 1, ['once'], function (l) {
      return { disp: row.join(' '), q: T(l, 'gen.attOnce'), o: [once].concat(others), e: T(l, 'gen.eRecall', { ans: once }) };
    });

    return it;
  });

  /* ---------------- REASONING ---------------- */
  B.addGenerator('reasoning', function (r) {
    var type = pick(['add', 'sub', 'mul', 'sq'], r);
    var seq = [], next, ruleKey, ruleN;

  });
  B.addGenerator('reasoning', function (r) {
    var day = ri(0, 6, r), n = ri(2, 10, r);

    });
  });
  B.addGenerator('reasoning', function (r) {
    var a = ri(11, 190, r) * 5;
    var notes = [100, 200, 500, 1000, 2000];
    var b = notes.filter(function (x) { return x > a; })[0];
    var ans = b - a;

    return item(ans % 10 ? 2 : 1, ['money'], function (l) {
      return { q: T(l, 'gen.resChange', { a: U.money(a), b: U.money(b) }), o: opts.map(U.money), e: T(l, 'gen.eChange', { a: U.money(a), b: U.money(b), ans: U.money(ans) }) };
    });
  });
  function clock(mins) {
    mins = ((mins % 1440) + 1440) % 1440;
    var hh = Math.floor(mins / 60), mm = mins % 60;
    var ap = hh >= 12 ? 'PM' : 'AM';

  B.addGenerator('reasoning', function (r) {
    var start = ri(60, 160, r) * 5;

    var ans = start + dur;

      var d = T(l, 'gen.hrs', { h: Math.floor(dur / 60), m: dur % 60 });

  B.addGenerator('reasoning', function (r) {
    var p = sample(PEOPLE, 3, r);

      var a = L(p[0], l), b = L(p[1], l), c = L(p[2], l);

        e: T(l, 'gen.eAge', { a: a, b: b, c: c }) };
    });
  });
})();

  <script>

    S('S02', 1, 'sms', 'AD-SHYGBK', false, ['official', 'info'],

    S('S03', 1, 'whatsapp', '+91 98xxx 12345', true, ['prize', 'payment', 'sender'],
      ['Congratulations!! Your number has won ₹25,00,000 in the Lucky Mobile Draw. Pay ₹4,999 processing fee to claim. Send money to this UPI ID now.', 'You cannot win a lottery you never entered, and real prizes never ask for a fee first.'],
      ['बधाई हो!! आपके नंबर ने लकी मोबाइल ड्रॉ में ₹25,00,000 जीते हैं। इनाम पाने के लिए ₹4,999 प्रोसेसिंग फ़ीस भरें। अभी इस UPI ID पर पैसे भेजें।', 'जिस लॉटरी में आपने भाग ही नहीं लिया, उसे आप जीत नहीं सकते। असली इनाम पहले फ़ीस नहीं माँगते।']),
    S('S04', 1, 'sms', 'JM-OTPMSG', false, ['official', 'expected', 'info'],
      ['123456 is your OTP to log in to the Sahyog Bank app. Valid for 5 minutes. Never share this OTP with anyone, including bank staff.', 'If you just tried to log in yourself, this OTP message is normal. It even warns you not to share it.'],
      ['सहयोग बैंक ऐप में लॉग-इन के लिए आपका OTP 123456 है। 5 मिनट तक मान्य। यह OTP किसी को न बताएँ, बैंक कर्मचारियों को भी नहीं।', 'अगर आपने अभी ख़ुद लॉग-इन किया है तो यह संदेश सामान्य है। इसमें तो OTP न बताने की चेतावनी भी है।']),
    S('S05', 1, 'call', 'Unknown number', true, ['otp', 'urgency', 'fear'],
      ['“Hello, I am calling from your bank. Your card will be blocked in 10 minutes. Please tell me the OTP you just received so I can stop it.”', 'No bank employee will ever ask for your OTP. Hang up and call the number on your card if you are worried.'],
      ['“नमस्ते, मैं आपके बैंक से बोल रहा हूँ। आपका कार्ड 10 मिनट में बंद हो जाएगा। रोकने के लिए अभी आया OTP बताइए।”', 'कोई भी बैंक कर्मचारी कभी OTP नहीं माँगता। चिंता हो तो फ़ोन काटकर कार्ड पर लिखे नंबर पर फ़ोन करें।']),
    S('S06', 1, 'sms', 'BZ-QKSHIP', true, ['link', 'payment', 'sender'],
      ['QuickShip: Your parcel is on hold due to incomplete address. Pay Rs 25 re-delivery charge at http://qkship-redeliver.co/pay within 24 hrs.', 'Small “re-delivery” payments through links are a common trick to steal card details.'],
      ['क्विकशिप: अधूरे पते के कारण आपका पार्सल रुका है। 24 घंटे में http://qkship-redeliver.co/pay पर ₹25 री-डिलीवरी शुल्क भरें।', 'लिंक से छोटी-सी “री-डिलीवरी” रकम माँगना कार्ड की जानकारी चुराने की आम चाल है।']),
    S('S07', 1, 'whatsapp', 'Rahul (son)', false, ['expected', 'info'],

    S('S08', 1, 'upi', 'cashback-offer@upi', true, ['collect', 'prize'],
      ['UPI request: “Cashback Reward ₹2,000” — Enter your UPI PIN to receive the money.', 'You never need your UPI PIN to RECEIVE money. Entering the PIN here would send ₹2,000 out of your account.'],

    S('S09', 1, 'sms', 'VM-ELECTR', true, ['urgency', 'fear', 'sender'],
      ['Dear consumer, your electricity will be disconnected TONIGHT at 9.30 pm as last month bill was not updated. Call officer 98XXXXXX21 immediately.', 'Power companies send notices through official bills, not threats from a mobile number at night.'],

    S('S10', 1, 'email', 'support@sahyog-bank-security.info', true, ['link', 'pin', 'sender'],
      ['Security Alert: Unusual login detected. Verify your identity by entering your internet banking password and ATM PIN at the secure link below.', 'No genuine bank asks for your password or PIN by email. The web address also looks unofficial.'],

    S('S11', 1, 'sms', 'AX-GASAGN', false, ['official', 'info'],
      ['Your LPG refill booking no. 448201 is confirmed. Delivery expected in 2 days. Pay only the amount on the cash memo. -City Gas Agency', 'A simple confirmation for something you booked, with no link and a reminder to pay only the printed amount.'],
      ['आपकी LPG रिफ़िल बुकिंग नं. 448201 पक्की हो गई है। 2 दिन में डिलीवरी होगी। केवल कैश मेमो पर लिखी रकम ही दें। -सिटी गैस एजेंसी', 'आपकी की हुई बुकिंग की साधारण पुष्टि — न कोई लिंक, और छपी रकम ही देने की सलाह।']),
    S('S12', 1, 'whatsapp', '+44 7xxx xxx 908', true, ['job', 'payment', 'returns'],
      ['Part-time job! Earn ₹5,000 daily just by liking videos from home. Pay ₹1,500 registration to start today. Limited seats!', 'Easy money for simple tasks plus an upfront fee — a classic job scam.'],
      ['पार्ट-टाइम नौकरी! घर बैठे सिर्फ़ वीडियो लाइक करके रोज़ ₹5,000 कमाएँ। आज शुरू करने के लिए ₹1,500 रजिस्ट्रेशन भरें। सीमित सीटें!', 'आसान काम के लिए आसान पैसा और पहले फ़ीस — नौकरी के नाम पर ठगी का पुराना तरीका।']),
    S('S13', 2, 'call', '+91 140 xxx xxxx', true, ['remote', 'fear', 'urgency'],
      ['“Sir, your phone has a virus that is stealing bank data. Please install the app called ScreenHelp so our engineer can fix it for you right now.”', 'Screen-sharing apps let strangers see and control your phone, including OTPs. Never install them on a caller’s request.'],

    S('S14', 2, 'sms', 'VD-PMYOJN', true, ['govt', 'link', 'payment'],

      ['Hi Mummy, this is my new number, old phone fell in water. I need to pay a hospital bill urgently, please send ₹18,000 to this account. Don’t call, I can’t talk now.', 'A “new number” plus urgent money and “don’t call” is a common impersonation trick. Call your child on the old number first.'],

    S('S16', 2, 'sms', 'AM-PRGBNK', false, ['official', 'info'],

    S('S18', 2, 'call', 'Courier Office', true, ['fear', 'otp', 'remote'],
      ['“Madam, a parcel in your name with illegal items was seized. To avoid police action, connect on video call and share your Aadhaar and bank OTP for verification.”', 'Fear of police plus requests for OTP and ID is a known “parcel scam”. Real authorities do not work like this.'],
      ['“मैडम, आपके नाम का एक पार्सल ग़ैरक़ानूनी सामान के साथ पकड़ा गया है। पुलिस कार्रवाई से बचने के लिए वीडियो कॉल पर जुड़ें और सत्यापन के लिए आधार और बैंक OTP बताएँ।”', 'पुलिस का डर और OTP व पहचान की माँग — यह जाना-माना “पार्सल घोटाला” है। असली अधिकारी ऐसे काम नहीं करते।']),
    S('S19', 2, 'email', 'noreply@cityelectric.example', false, ['official', 'info'],
      ['Your electricity bill for September is ₹1,240, due on 20-Oct. You can pay at the counter or through your usual payment method. No action needed if already paid.', 'Bill information with no threats, no strange link and no request for personal details.'],
      ['सितंबर का आपका बिजली बिल ₹1,240 है, अंतिम तिथि 20-अक्टूबर। आप काउंटर पर या अपने सामान्य तरीके से भुगतान कर सकते हैं। पहले ही भर दिया है तो कुछ करने की ज़रूरत नहीं।', 'बिल की जानकारी — न धमकी, न अजीब लिंक, न निजी जानकारी की माँग।']),
    S('S20', 2, 'sms', 'TX-REFUND', true, ['link', 'kyc', 'sender'],
      ['Income Tax refund of ₹15,490 approved. Update your bank account at http://it-refund-claim.site to receive it today.', 'Tax refunds go directly to the account you already registered. They never need a link from a random SMS.'],
      ['₹15,490 का आयकर रिफ़ंड मंज़ूर। आज ही पाने के लिए http://it-refund-claim.site पर अपना बैंक खाता अपडेट करें।', 'टैक्स रिफ़ंड सीधे आपके पहले से दर्ज खाते में आता है। इसके लिए किसी SMS लिंक की ज़रूरत नहीं होती।']),
    S('S21', 2, 'whatsapp', 'Sunita (neighbour)', false, ['expected', 'info'],
      ['Good morning! The society meeting is on Sunday at 11 am in the community hall. Tea will be served. 🙏', 'An ordinary message from someone you know, about something real, asking nothing from you.'],
      ['सुप्रभात! सोसाइटी की बैठक रविवार सुबह 11 बजे सामुदायिक भवन में है। चाय की व्यवस्था रहेगी। 🙏', 'किसी जानने वाले का साधारण संदेश, असली बात के बारे में, आपसे कुछ नहीं माँगा।']),
    S('S22', 2, 'upi', 'olx-buyer@upi', true, ['qr', 'collect'],
      ['A buyer for your old sofa says: “I’ll pay ₹8,000 now. Just scan this QR code and enter your PIN to receive the payment.”', 'Scanning a QR code and entering a PIN always sends money. To receive money you do nothing.'],
      ['आपके पुराने सोफ़े का ख़रीदार कहता है: “मैं अभी ₹8,000 देता हूँ। पैसे पाने के लिए बस यह QR कोड स्कैन करके अपना PIN डालिए।”', 'QR स्कैन करके PIN डालने पर हमेशा पैसे जाते हैं। पैसे पाने के लिए आपको कुछ नहीं करना पड़ता।']),
    S('S23', 2, 'sms', 'VM-SIMUPD', true, ['urgency', 'fear', 'sender'],
      ['Your SIM card will be deactivated in 2 hours due to pending e-KYC. Call 7XXXXXXX45 now to avoid disconnection.', 'Mobile companies do not threaten to cut your SIM within hours via SMS from unknown numbers.'],
      ['पेंडिंग e-KYC के कारण आपका सिम 2 घंटे में बंद हो जाएगा। कनेक्शन बचाने के लिए अभी 7XXXXXXX45 पर फ़ोन करें।', 'मोबाइल कंपनियाँ अनजान नंबर से SMS भेजकर घंटों में सिम बंद करने की धमकी नहीं देतीं।']),
    S('S24', 2, 'call', 'Insurance Desk', true, ['payment', 'returns', 'urgency'],
      ['“Your old insurance policy has a bonus of ₹4,80,000 waiting. Just deposit ₹12,000 as release charges today and the money will come tomorrow.”', 'Paying money to release money is a classic advance-fee scam.'],
      ['“आपकी पुरानी बीमा पॉलिसी पर ₹4,80,000 का बोनस रुका है। आज ₹12,000 रिलीज़ चार्ज जमा कर दीजिए, कल पैसा आ जाएगा।”', 'पैसे छुड़ाने के लिए पैसे भरना — यह पहले फ़ीस वाली ठगी का पुराना तरीका है।']),
    S('S25', 2, 'sms', 'AD-PHARMA', false, ['info', 'expected'],
      ['Your medicine order #5521 from Care Chemist is ready for pickup. Store timings 9 am to 9 pm.', 'A pickup reminder for something you ordered, with nothing to click or pay online.'],
      ['केयर केमिस्ट से आपका दवा ऑर्डर #5521 तैयार है, ले जा सकते हैं। दुकान का समय सुबह 9 से रात 9 बजे।', 'आपके दिए ऑर्डर की सूचना — न कुछ क्लिक करना, न ऑनलाइन भुगतान।']),
    S('S26', 2, 'whatsapp', 'Bank Help Center ✅', true, ['sender', 'pin', 'kyc'],
      ['Dear customer, your debit card KYC is pending. Send a photo of both sides of your card and your PIN on this chat to keep it active.', 'A green tick or official-sounding name in a chat does not prove anything. Never share card photos or PIN.'],
      ['प्रिय ग्राहक, आपके डेबिट कार्ड का KYC बाकी है। कार्ड चालू रखने के लिए इस चैट पर कार्ड के दोनों तरफ़ की फ़ोटो और PIN भेजें।', 'चैट में हरा निशान या आधिकारिक-सा नाम कुछ साबित नहीं करता। कार्ड की फ़ोटो या PIN कभी न भेजें।']),
    S('S27', 2, 'email', 'prize@intl-lottery-uk.example', true, ['prize', 'payment', 'sender'],
      ['You have been selected as the winner of the International E-mail Lottery 2025 of US$ 950,000. Send your full name, address, bank details and a transfer fee of $200.', 'Nobody wins a lottery they did not enter. The request for bank details and a fee confirms it.'],
      ['आपको अंतरराष्ट्रीय ई-मेल लॉटरी 2025 में 9,50,000 अमेरिकी डॉलर का विजेता चुना गया है। अपना पूरा नाम, पता, बैंक विवरण और $200 ट्रांसफ़र फ़ीस भेजें।', 'जिस लॉटरी में भाग ही नहीं लिया, उसे कोई नहीं जीतता। बैंक विवरण और फ़ीस की माँग इसकी पुष्टि करती है।']),
    S('S28', 2, 'sms', 'JD-SHYGBK', false, ['official', 'info'],
      ['Reminder: Never share your OTP, PIN or password with anyone. Sahyog Bank will never call or message you asking for them.', 'A safety reminder that asks for nothing. Banks do send such awareness messages.'],
      ['याद रखें: अपना OTP, PIN या पासवर्ड किसी को न बताएँ। सहयोग बैंक कभी फ़ोन या संदेश करके इन्हें नहीं माँगेगा।', 'एक सुरक्षा याद-दिहानी जिसमें कुछ नहीं माँगा गया। बैंक ऐसे जागरूकता संदेश भेजते हैं।']),
    S('S29', 3, 'call', 'Nephew (voice)', true, ['emotion', 'secrecy', 'urgency'],
      ['A voice that sounds like your nephew: “Chachi, I had a small accident. Please send ₹30,000 to my friend’s UPI. Don’t tell Papa, he will be angry.”', 'Voices can be faked and stories invented. Secrecy and urgency are the warning signs — verify by calling his parents.'],
      ['भतीजे जैसी आवाज़: “चाची, मेरा छोटा-सा एक्सीडेंट हो गया। मेरे दोस्त के UPI पर ₹30,000 भेज दो। पापा को मत बताना, नाराज़ होंगे।”', 'आवाज़ नक़ली हो सकती है और कहानी गढ़ी हुई। गोपनीयता और जल्दबाज़ी चेतावनी हैं — उसके माता-पिता को फ़ोन करके पुष्टि करें।']),
    S('S30', 3, 'email', 'hr@global-careers-hiring.example', true, ['job', 'payment', 'sender'],
      ['Dear Candidate, you are selected for a Work-From-Home Data Entry job, salary ₹45,000/month. Kindly deposit ₹3,500 for laptop security to receive your offer letter.', 'Genuine employers never charge candidates to get a job or an offer letter.'],
      ['प्रिय उम्मीदवार, आपको घर से डेटा एंट्री की नौकरी के लिए चुना गया है, वेतन ₹45,000/माह। ऑफ़र लेटर पाने के लिए लैपटॉप सिक्योरिटी के ₹3,500 जमा करें।', 'असली नियोक्ता नौकरी या ऑफ़र लेटर के लिए उम्मीदवार से पैसे नहीं लेते।']),
    S('S31', 3, 'sms', 'VK-FASTAG', true, ['link', 'urgency', 'kyc'],
      ['Your vehicle tag will be blacklisted tonight. Complete KYC at http://tag-kyc-now.in to avoid double toll charges.', 'An unknown link and a “tonight” deadline. Update vehicle tags only through your bank or official app.'],
      ['आपका वाहन टैग आज रात ब्लैकलिस्ट हो जाएगा। दोगुने टोल से बचने के लिए http://tag-kyc-now.in पर KYC पूरा करें।', 'अनजान लिंक और “आज रात” की समय-सीमा। वाहन टैग केवल अपने बैंक या आधिकारिक ऐप से अपडेट करें।']),
    S('S32', 3, 'social', 'Crypto Wealth Club', true, ['returns', 'payment', 'emotion'],
      ['A friendly person you met online says they made lakhs with a new crypto app and offers to “teach” you. First you must deposit ₹20,000 into the app they share.', 'Online friends who quickly bring up investments and special apps are a known “investment romance” trick.'],
      ['ऑनलाइन मिला एक मिलनसार व्यक्ति कहता है कि उसने एक नए क्रिप्टो ऐप से लाखों कमाए और आपको “सिखाने” की पेशकश करता है। पहले उसके बताए ऐप में ₹20,000 जमा करने होंगे।', 'ऑनलाइन दोस्त जो जल्दी निवेश और ख़ास ऐप की बात करें — यह जाना-माना “निवेश दोस्ती” वाला जाल है।']),
    S('S33', 3, 'call', 'Bank Manager', true, ['otp', 'sender', 'info'],
      ['“Namaste, I am the manager of your branch. We are upgrading cards. I will send a code to your phone; just read it out to confirm your new card.”', 'The “code” is an OTP. Even a real manager would never ask you to read it out.'],
      ['“नमस्ते, मैं आपकी शाखा का मैनेजर हूँ। हम कार्ड अपग्रेड कर रहे हैं। आपके फ़ोन पर एक कोड भेजूँगा; नया कार्ड पक्का करने के लिए बस पढ़कर बता दीजिए।”', 'वह “कोड” असल में OTP है। असली मैनेजर भी कभी इसे पढ़कर बताने को नहीं कहेगा।']),
    S('S34', 3, 'sms', 'AD-HOSPTL', false, ['info', 'expected'],
      ['Reminder: Your appointment with Dr. Mehta is tomorrow at 10:30 am at City Clinic. Reply C to cancel. Please bring previous reports.', 'A normal appointment reminder from a clinic you booked with. It asks for no money or personal details.'],
      ['याद दिलाना: कल सुबह 10:30 बजे सिटी क्लिनिक में डॉ. मेहता से आपकी मुलाक़ात है। रद्द करने के लिए C लिखकर भेजें। पुरानी रिपोर्ट साथ लाएँ।', 'आपके बुक किए क्लिनिक का सामान्य अनुस्मारक। इसमें न पैसे माँगे, न निजी जानकारी।']),
    S('S35', 3, 'whatsapp', 'Wedding Invite 💌', true, ['link', 'remote', 'sender'],
      ['You are invited! Open the wedding card: “Wedding_Card.apk” (download and install to view).', 'Wedding cards are images or PDFs. A file ending in “.apk” is an app that can take over your phone.'],
      ['आपको निमंत्रण है! शादी का कार्ड खोलें: “Wedding_Card.apk” (देखने के लिए डाउनलोड करके इंस्टॉल करें)।', 'शादी के कार्ड तस्वीर या PDF होते हैं। “.apk” वाली फ़ाइल एक ऐप होती है जो आपका फ़ोन क़ब्ज़े में ले सकती है।']),
    S('S36', 3, 'upi', 'electricity-dept@upi', true, ['collect', 'urgency', 'sender'],
      ['A collect request of ₹2,350 from “electricity-dept” with the note “Pay now to avoid disconnection today”.', 'Paying through an unexpected collect request from an unknown ID is risky. Pay bills only through the official app or counter.'],
      ['“electricity-dept” से ₹2,350 का कलेक्ट अनुरोध, संदेश के साथ: “आज कनेक्शन कटने से बचने के लिए अभी भुगतान करें”।', 'किसी अनजान ID के अचानक आए कलेक्ट अनुरोध से भुगतान जोखिम भरा है। बिल केवल आधिकारिक ऐप या काउंटर से भरें।']),
    S('S37', 3, 'email', 'it-helpdesk@yourcompany-mail.example', true, ['link', 'pin', 'urgency'],
      ['Your mailbox is 99% full and will stop working today. Log in at the link below with your password to get extra storage free.', 'Fake “mailbox full” messages are used to collect passwords. Check storage only inside your normal email app.'],
      ['आपका मेलबॉक्स 99% भर चुका है और आज बंद हो जाएगा। मुफ़्त अतिरिक्त जगह के लिए नीचे दिए लिंक पर पासवर्ड से लॉग-इन करें।', 'नक़ली “मेलबॉक्स भरा” संदेश पासवर्ड चुराने के लिए होते हैं। जगह केवल अपने सामान्य ईमेल ऐप में ही देखें।']),
    S('S38', 3, 'sms', 'VM-PRGBNK', false, ['official', 'info'],
      ['You have added a new payee “R KUMAR” on 10-Oct, 4:12 pm. If this was not you, please call the number on the back of your card. -Pragati Bank', 'This alert gives information and tells you to call the number on your own card. That is how genuine alerts behave.'],
      ['आपने 10-अक्टूबर, शाम 4:12 बजे नया लाभार्थी “R KUMAR” जोड़ा है। अगर यह आपने नहीं किया, तो अपने कार्ड के पीछे लिखे नंबर पर फ़ोन करें। -प्रगति बैंक', 'यह चेतावनी केवल जानकारी देती है और आपके कार्ड का नंबर इस्तेमाल करने को कहती है। असली अलर्ट ऐसे ही होते हैं।']),
    S('S39', 3, 'call', 'Telecom Authority', true, ['fear', 'urgency', 'remote'],
      ['“This is the Telecom Department. Your Aadhaar was used for illegal SIMs. Press 9 to speak to the officer, or all your numbers will be blocked in 2 hours.”', 'Automated threats about your Aadhaar and “press 9” are well-known scam scripts.'],
      ['“यह दूरसंचार विभाग है। आपके आधार से ग़ैरक़ानूनी सिम लिए गए हैं। अधिकारी से बात करने के लिए 9 दबाएँ, वरना 2 घंटे में आपके सारे नंबर बंद हो जाएँगे।”', 'आधार को लेकर स्वचालित धमकियाँ और “9 दबाएँ” — यह जानी-मानी ठगी की स्क्रिप्ट है।']),
    S('S40', 3, 'social', 'Free Laptop Yojana 2025', true, ['govt', 'link', 'info'],
      ['Government is giving FREE laptops to all citizens! Fill the form with your Aadhaar, bank account and phone number. Share with 10 groups to activate.', 'Free gifts that need your personal data and “share with 10 groups” are designed to spread and collect information.'],
      ['सरकार सभी नागरिकों को मुफ़्त लैपटॉप दे रही है! अपने आधार, बैंक खाते और फ़ोन नंबर से फ़ॉर्म भरें। चालू करने के लिए 10 ग्रुप में शेयर करें।', 'निजी जानकारी माँगने वाले मुफ़्त उपहार और “10 ग्रुप में शेयर करें” — ये जानकारी जुटाने और फैलने के लिए बनाए जाते हैं।']),
    S('S41', 3, 'whatsapp', 'Amit (friend)', false, ['expected', 'info'],
      ['Hi! Sending you the photos from yesterday’s get-together. Lovely evening. Let us meet again next month!', 'A familiar friend sharing photos after an event you attended — nothing to install, nothing to pay.'],
      ['नमस्ते! कल की मुलाक़ात की तस्वीरें भेज रहा हूँ। बहुत अच्छी शाम थी। अगले महीने फिर मिलते हैं!', 'जान-पहचान का दोस्त, आपके साथ हुए कार्यक्रम की तस्वीरें — न कुछ इंस्टॉल करना, न भुगतान।']),
    S('S42', 2, 'sms', 'BP-REWARD', true, ['prize', 'link', 'urgency'],
      ['Your credit card reward points worth ₹7,850 expire today! Redeem now at http://rewardz-redeem.club', 'Reward point expiry with a strange link is a common card-detail theft trick. Check points only in your official app.'],
      ['आपके क्रेडिट कार्ड के ₹7,850 के रिवॉर्ड पॉइंट आज ख़त्म हो रहे हैं! अभी http://rewardz-redeem.club पर भुनाएँ', 'अजीब लिंक के साथ पॉइंट ख़त्म होने की बात — कार्ड की जानकारी चुराने की आम चाल। पॉइंट केवल आधिकारिक ऐप में देखें।']),
    S('S43', 2, 'call', 'Gas Company', true, ['fear', 'payment', 'urgency'],
      ['“Your gas connection is unsafe and will be cut today. Pay ₹1,200 inspection fee on this number by UPI and our technician will come.”', 'Real gas agencies do not demand UPI payments to personal numbers over the phone.'],
      ['“आपका गैस कनेक्शन असुरक्षित है और आज काट दिया जाएगा। इस नंबर पर UPI से ₹1,200 जाँच शुल्क भेजिए, हमारा मिस्त्री आ जाएगा।”', 'असली गैस एजेंसियाँ फ़ोन पर निजी नंबर पर UPI से पैसे नहीं माँगतीं।']),
    S('S44', 1, 'sms', 'AX-LIBRRY', false, ['info'],
      ['City Library: The book “Malgudi Days” you borrowed is due for return on 18-Oct. Thank you.', 'A simple reminder from a place you use. It asks for nothing.'],
      ['सिटी लाइब्रेरी: आपकी ली हुई किताब “मालगुडी डेज़” 18-अक्टूबर तक लौटानी है। धन्यवाद।', 'आपकी जानी-पहचानी जगह का सादा अनुस्मारक। इसमें कुछ नहीं माँगा गया।']),
    S('S45', 2, 'whatsapp', '+92 3xx xxx xx11', true, ['prize', 'sender', 'payment'],

    Q('N04', 2, TN, { dec: '1960s' }, ['From 1957 the rupee was divided in a new way, still new in the 1960s. How?', ['100 naye paise = 1 rupee', '16 annas = 1 rupee, for the first time', '12 annas = 1 rupee', '1,000 paise = 1 rupee'], 'Earlier 1 rupee was 16 annas. The decimal system brought the “naya paisa”.'],

    Q('N19', 2, TN, { dec: '1990s' }, ['When mobile phones arrived in India in the mid-1990s, what were calls like?', ['Very expensive — even incoming calls were charged', 'Completely free', 'Cheaper than a landline', 'Only ₹1 per day'], 'For years, people let the phone ring to avoid paying for incoming calls!'],

    Q('N20', 1, TN, { dec: '1990s' }, ['In the 1990s, how did people usually carry computer files from one place to another?', ['On a floppy disk', 'In the cloud', 'On a phone with USB-C', 'By video call'], 'A floppy held about 1.44 MB — less than one phone photo today.'],

    Q('N21', 1, TN, { dec: '2000s' }, ['In the 2000s, what made railway ticket booking much easier for many people?', ['Booking tickets online', 'Booking by telegram', 'Booking by post', 'Booking by pager'], 'Online booking saved long queues — though the Tatkal rush became a new adventure!'],

    Q('N22', 1, TN, { dec: '2000s' }, ['What became hugely popular for sending short messages to friends in the 2000s?', ['SMS on a mobile phone', 'Telegrams', 'Pagers', 'Fax machines'], 'Many people became experts at typing on number keys — and SMS packs were a prized gift!'],

    Q('N23', 1, TN, { dec: '2000s' }, ['In the early 2000s, what replaced video tapes for watching films at home?', ['VCDs and DVDs', 'Gramophone records', 'Reel projectors', '5G streaming'], 'Shiny discs made it easy to skip straight to your favourite song.'],

    Q('N25', 1, TN, { dec: 'today' }, ['Which is a common way today to pay a shopkeeper instantly from your phone?', ['Scanning a UPI QR code', 'Sending a money order', 'Writing a postcard', 'Sending a telegram'], 'Even small vegetable vendors now display QR codes — but always check the name before paying.'],

    Q('N26', 1, TN, { dec: 'today' }, ['Today, how do many people watch films and serials whenever they like?', ['On streaming apps on a phone or TV', 'Only the Sunday film on one channel', 'By renting a VCR', 'At a video parlour'], 'From one channel to thousands of choices — quite a journey in one lifetime!'],

    Q('N27', 1, TN, { dec: 'today' }, ['Today, how do most people check train timings and PNR status?', ['On phone apps or websites', 'By writing a letter', 'By telegram', 'Only on the station notice board'], 'What once needed a trip to the enquiry counter now takes seconds.'],

    Q('N28', 1, TN, { dec: 'today' }, ['What is a common way today to talk face to face with family far away?', ['A video call on a smartphone', 'A trunk call', 'A telegram', 'A postcard'], 'Grandparents can now watch grandchildren grow up even from another country.'],

    Q('W12', 1, W, { region: 'general' }, ['What was a “money order”?', ['A way to send money through the post office', 'A bank cheque book', 'A shopping list', 'A lottery ticket'], 'The postman bringing a money order was a welcome sight in many homes.'],

  <!-- Screens and games -->
  <script>
/* SMART 50+ — main screens: onboarding, home, games list, daily challenge, progress, achievements, settings, about. */
(function () {
  'use strict';
  var S50 = window.S50;
  var U = S50.U, h = U.h, t = S50.t;
  var Store = S50.Store, UI = S50.UI, App = S50.App;
  var CATS = ['memory', 'attention', 'reasoning', 'life', 'safety', 'nostalgia'];
  var GAME_ICON = {
    wherekept: '🔑', trip: '🧳', changed: '🔍', missing: '🧐', familytree: '🌳', lifeexp: '🌟',
    household: '🏠', grandmaster: '♟️', scam: '🛡️', thennow: '📻', finish: '🎬', words: '✉️'
  };
  S50.GAME_ICON = GAME_ICON;

  function link(route, cls, children) {
    return h('a', { class: cls, href: '#/' + route }, children);
  }
  function statTile(label, value, icon) {
    return h('div', { class: 'stat' },
      h('span', { class: 'stat-icon', attrs: { 'aria-hidden': 'true' }, text: icon }),
      h('span', { class: 'stat-v', text: value }),
      h('span', { class: 'stat-l', text: label }));
  }
  function streakText(n) { return n === 1 ? t('stat.day1') : t('stat.days', { n: n }); }
  function greeting() {
    var hr = new Date().getHours();
    return t(hr < 12 ? 'greet.morning' : hr < 17 ? 'greet.afternoon' : 'greet.evening');
  }
  function quoteOfDay() {
    var q = t('quotes');
    return Array.isArray(q) ? q[U.hashStr(U.todayKey()) % q.length] : '';
  }
  function toggleBtn(label, value, onChange) {
    var b = h('button', { class: 'toggle' + (value ? ' on' : ''), type: 'button', attrs: { 'aria-pressed': value ? 'true' : 'false' } },
      h('span', { class: 'toggle-label', text: label }),
      h('span', { class: 'toggle-state', text: value ? '● ' + t('settings.on') : '○ ' + t('settings.off') }));
    b.addEventListener('click', function () { onChange(!value); });
    return b;
  }
  function choiceRow(options, value, onChange, cls) {
    return h('div', { class: 'choice-row ' + (cls || '') }, options.map(function (o) {
      var sel = o.value === value;
      return h('button', {
        class: 'choice' + (sel ? ' selected' : ''), type: 'button', attrs: { 'aria-pressed': sel ? 'true' : 'false', lang: o.lang || null },
        style: o.style || null, on: { click: function () { onChange(o.value); } }
      }, sel ? '✓ ' : '', o.label);
    }));
  }
  function fontChoices(onChange) {
    return choiceRow([
      { value: 'normal', label: 'A ' + t('settings.normal'), style: { fontSize: '1rem' } },
      { value: 'large', label: 'A ' + t('settings.large'), style: { fontSize: '1.2rem' } },
      { value: 'xl', label: 'A ' + t('settings.xl'), style: { fontSize: '1.4rem' } }
    ], Store.settings.fontSize, onChange, 'choice-col');
  }
  function langChoices(onChange) {
    return choiceRow(Object.keys(S50.LANGS).map(function (k) {
      return { value: k, label: S50.LANGS[k].native + (S50.LANGS[k].native !== S50.LANGS[k].name ? ' (' + S50.LANGS[k].name + ')' : ''), lang: k };
    }), Store.settings.lang, onChange);
  }

  /* ---------- Onboarding (3 screens) ---------- */
  App.route('onboarding', function (p) {
    var step = U.num(p[0]) || 1;
    var v = U.clear(document.getElementById('view'));
    var dots = h('div', { class: 'ob-dots', attrs: { 'aria-hidden': 'true' } }, [1, 2, 3].map(function (i) { return h('span', { class: 'ob-dot' + (i === step ? ' on' : '') }); }));
    var card = h('div', { class: 'onboard card' });
    if (step === 1) {
      card.appendChild(h('div', { class: 'ob-logo', text: 'SMART 50+' }));
      card.appendChild(h('h1', { text: t('onboard.s1t') }));
      card.appendChild(h('p', { class: 'lead', text: t('onboard.s1b') }));
      card.appendChild(h('h2', { class: 'ob-sub', text: t('onboard.lang') }));
      card.appendChild(langChoices(function (l) { Store.setSetting('lang', l); App.applySettings(); App.render(); }));
    } else if (step === 2) {
      card.appendChild(h('div', { class: 'big-emoji', attrs: { 'aria-hidden': 'true' }, text: '🌼' }));
      card.appendChild(h('h1', { text: t('onboard.s2t') }));
      card.appendChild(h('p', { class: 'lead', text: t('onboard.s2b') }));
      card.appendChild(h('p', { text: t('about.p1') }));
      card.appendChild(h('p', { text: t('about.p2') }));
      card.appendChild(h('p', { text: t('about.p3') }));
      card.appendChild(h('p', { class: 'disclaimer', text: t('about.disclaimer') }));
    } else {
      card.appendChild(h('div', { class: 'big-emoji', attrs: { 'aria-hidden': 'true' }, text: '🔠' }));
      card.appendChild(h('h1', { text: t('onboard.s3t') }));
      card.appendChild(fontChoices(function (f) { Store.setSetting('fontSize', f); App.applySettings(); App.render(); }));
      card.appendChild(h('p', { class: 'preview-text', text: t('settings.preview') }));
      card.appendChild(h('p', { class: 'hint', text: t('onboard.s3b') }));
    }
    var actions = h('div', { class: 'ob-actions' });
    if (step > 1) actions.appendChild(h('button', { class: 'btn btn-ghost', type: 'button', text: t('common.back'), on: { click: function () { App.go('onboarding/' + (step - 1)); } } }));
    if (step < 3) actions.appendChild(h('button', { class: 'btn btn-primary', type: 'button', text: t('common.next'), on: { click: function () { App.go('onboarding/' + (step + 1)); } } }));
    else actions.appendChild(h('button', { class: 'btn btn-primary btn-big', type: 'button', text: '▶ ' + t('onboard.lets'), on: { click: function () { Store.setOnboarded(); App.go('home'); } } }));
    card.appendChild(actions);
    v.appendChild(h('div', { class: 'onboard-wrap' }, dots, card));
    var h1 = card.querySelector('h1'); if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus(); }
  });

  /* ---------- Home ---------- */
  App.route('home', function () {
    var v = U.clear(document.getElementById('view'));
    var lvl = Store.levelInfo();
    var stats = Store.data.stats;
    var hero = h('section', { class: 'hero' },
      h('div', { class: 'hero-brand' },
        h('h1', { class: 'hero-title', text: t('app.name') }),
        h('p', { class: 'hero-tag', text: t('app.tagline') })),
      h('p', { class: 'hero-greet', text: greeting() + ' 🙏' }),
      h('p', { class: 'hero-ready', text: t('home.ready') }));
    v.appendChild(hero);

    v.appendChild(h('section', { class: 'stats', attrs: { 'aria-label': t('menu.progress') } },
      statTile(t('stat.today'), U.fmtNum(Store.todayPoints()), '⭐'),
      statTile(t('stat.streak'), streakText(Store.currentStreak()), '🔥'),
      statTile(t('stat.games'), U.fmtNum(stats.gamesPlayed), '🎲'),
      statTile(t('stat.best'), U.fmtNum(stats.bestScore), '🏅'),
      statTile(t('stat.level'), lvl.n + ' · ' + lvl.name, '📈')));

    var ds = Store.dailyScore();

      return h('div', { class: 'spot' + (highlight === l.id ? ' spot-hl' : '') },
        h('span', { class: 'spot-icon', attrs: { 'aria-hidden': 'true' }, text: l.icon }),
        h('span', { class: 'spot-name', text: name(l) }),
        showObjects && here ? h('span', { class: 'obj' }, objIcon(here), h('span', { class: 'obj-name', text: name(here) })) : null);
    }));
  }

  function locOptions(room, correctLoc, rnd) {
    var occupied = room.objs.map(function (o) { return room.place[o.id]; }).filter(function (l) { return l !== correctLoc; });
    var others = U.shuffle(occupied).concat(U.shuffle(room.locs.map(function (l) { return l.id; })));
    var opts = [correctLoc];
    others.forEach(function (l) { if (opts.length < 4 && opts.indexOf(l) < 0) opts.push(l); });
    return U.shuffle(opts, rnd);
  }

  function buildQuestions(room, cfg, movedId) {
    var qs = [];
    var asked = {};
    if (movedId) { qs.push({ type: 'one', obj: movedId }); asked[movedId] = true; }
    if (room.focus && !asked[room.focus.id]) { qs.push({ type: 'one', obj: room.focus.id }); asked[room.focus.id] = true; }
    var rest = U.shuffle(room.objs.filter(function (o) { return !asked[o.id]; }));
    if (cfg.both && rest.length >= 2) {
      qs.push({ type: 'both', a: rest[0].id, b: rest[1].id });
      rest = rest.slice(2);
    }
    while (qs.length < cfg.qs && rest.length) qs.push({ type: 'one', obj: rest.shift().id });
    return U.shuffle(qs).slice(0, cfg.qs);
  }
  function objById(room, id) { return room.objs.filter(function (o) { return o.id === id; })[0]; }

  function start() {
    var level = Math.min(5, Store.gameLevel('wherekept'));
    var state = { room: 0, score: 0, correct: 0, total: 0, streak: 0 };
    var body = UI.screen({ title: t('games.wherekept.name'), icon: S50.GAME_ICON.wherekept, cat: 'memory', back: 'games/memory' });
    var wrap = h('div', { class: 'quiz' });
    body.appendChild(wrap);

    function nextRoom() {
      UI.stopTimers();
      if (state.room >= ROOMS) return finish();
      var cfg = LEVELS[level];
      var room = makeRoom(cfg);
      U.clear(wrap);
      wrap.appendChild(UI.progressBar(state.room + 1, ROOMS, t('wherekept.round', { n: state.room + 1, total: ROOMS }) + ' · ' + t('common.level', { n: level })));
      var content = h('div', {}, cfg.similar ? h('p', { class: 'hint', text: '⚠️ ' + t('wherekept.similar') }) : null, roomView(room, true));
      UI.memorise(wrap, content, function () { afterHide(room, cfg); }, { title: t('wherekept.intro'), seconds: 10 + cfg.objs * 2 });
    }

    function afterHide(room, cfg) {
      U.clear(wrap);
      wrap.appendChild(UI.progressBar(state.room + 1, ROOMS, t('wherekept.round', { n: state.room + 1, total: ROOMS }) + ' · ' + t('common.level', { n: level })));
      var movedId = null;
      if (cfg.move) {
        var o = U.pick(room.objs);
        var free = room.locs.filter(function (l) { return !room.objs.some(function (x) { return room.place[x.id] === l.id; }); });
        var dest = U.pick(free);
        room.place[o.id] = dest.id;
        movedId = o.id;
        var card = h('div', { class: 'card move-card' },
          h('div', { class: 'big-emoji', attrs: { 'aria-hidden': 'true' } }, objIcon(o)),
          h('p', { class: 'lead', text: t('wherekept.moved', { obj: S50.lang === 'hi' ? name(o) : name(o).toLowerCase(), loc: name(dest) }) }),
          h('p', { class: 'hint', text: t('wherekept.movedHint') }),
          h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: t('common.cont'), on: { click: function () { ask(room, cfg, buildQuestions(room, cfg, movedId), 0, 0); } } }));
        wrap.appendChild(card);
        card.querySelector('button').focus();
        return;
      }
      ask(room, cfg, buildQuestions(room, cfg, null), 0, 0);
    }

    function ask(room, cfg, qs, qi, roomCorrect) {
      if (qi >= qs.length) {
        state.room += 1;
        if (roomCorrect === qs.length && level < 5) { level += 1; Store.setGameLevel('wherekept', level); UI.toast(t('wherekept.levelUp')); }
        return nextRoom();
      }
      var q = qs[qi];
      U.clear(wrap);
      wrap.appendChild(UI.progressBar(state.room + 1, ROOMS, t('wherekept.round', { n: state.room + 1, total: ROOMS }) + ' · ' + t('common.level', { n: level })));
      wrap.appendChild(h('p', { class: 'hint', text: '🙈 ' + t('wherekept.hidden') }));
      var options, correctIdx, text;
      if (q.type === 'one') {
        var o = objById(room, q.obj);
        var locs = locOptions(room, room.place[o.id]);
        options = locs.map(function (l) { return name(locById(l)); });
        correctIdx = locs.indexOf(room.place[o.id]);
        text = whereQ(o);
      } else {
        var a = objById(room, q.a), b = objById(room, q.b);
        var pa = room.place[a.id], pb = room.place[b.id];
        var la = locOptions(room, pa), lb = locOptions(room, pb);
        var pairs = [[pa, pb], [pb, pa]];
        la.forEach(function (x) { lb.forEach(function (y) { if (x !== y && pairs.length < 12) pairs.push([x, y]); }); });
        var uniq = [];
        pairs.forEach(function (p) { if (!uniq.some(function (u) { return u[0] === p[0] && u[1] === p[1]; })) uniq.push(p); });
        var chosen = [uniq[0]].concat(U.shuffle(uniq.slice(1)).slice(0, 3));
        chosen = U.shuffle(chosen);
        options = chosen.map(function (p) { return t('wherekept.and', { a: name(locById(p[0])), b: name(locById(p[1])) }); });
        correctIdx = chosen.indexOf(uniq[0]);
        text = t('wherekept.both', { a: S50.lang === 'hi' ? name(a) : name(a).toLowerCase(), b: S50.lang === 'hi' ? name(b) : name(b).toLowerCase() });
      }
      var card = h('div', { class: 'qcard card' });
      var focusObj = q.type === 'one' ? objById(room, q.obj) : null;
      if (focusObj) card.appendChild(h('div', { class: 'qdisplay' }, objIcon(focusObj)));
      card.appendChild(h('h2', { class: 'qtext', text: text }));
      card.appendChild(roomView(room, false));
      var optsEl = h('div', { class: 'options' });
      var buttons = options.map(function (label, i) {
        var b = h('button', { class: 'opt', type: 'button', on: { click: function () { choose(i); } } }, h('span', { class: 'opt-text', text: label }));
        optsEl.appendChild(b);
        return b;
      });
      card.appendChild(optsEl);
      wrap.appendChild(card);
      buttons[0].focus({ preventScroll: true });
      var done = false;
      function choose(i) {
        if (done) return; done = true;
        var ok = i === correctIdx;
        state.total += 1;
        if (ok) { state.correct += 1; state.streak += 1; roomCorrect += 1; } else state.streak = 0;
        var pts = Store.Score.question({ correct: ok, difficulty: cfg.d, streak: state.streak });
        state.score += pts;
        Store.recordAnswer('memory', ok);
        S50.Sound.play(ok ? 'correct' : 'wrong');
        buttons.forEach(function (b, j) {
          b.disabled = true;
          if (j === correctIdx) { b.classList.add('is-correct'); b.appendChild(h('span', { class: 'opt-mark', text: '✓' })); }
          else if (j === i) { b.classList.add('is-wrong'); b.appendChild(h('span', { class: 'opt-mark', text: '✗' })); }
        });
        var fb = h('div', { class: 'feedback ' + (ok ? 'fb-good' : 'fb-soft'), attrs: { role: 'status' } },
          h('div', { class: 'fb-head' }, h('strong', { text: ok ? t('common.correct') : t('common.wrong') }), pts ? h('span', { class: 'fb-points', text: t('common.points', { n: pts }) }) : null),
          ok ? null : h('p', { class: 'fb-answer', text: t('common.correctAnswer', { a: options[correctIdx] }) }),
          roomView(room, true),
          h('button', { class: 'btn btn-primary btn-wide', type: 'button', text: t('common.next'), on: { click: function () { ask(room, cfg, qs, qi + 1, roomCorrect); } } }));
        card.appendChild(fb);
        fb.querySelector('.btn').focus({ preventScroll: true });
        fb.scrollIntoView({ block: 'nearest' });
      }
    }

    function finish() {
      UI.complete({ gameId: 'wherekept', title: t('games.wherekept.name'), cat: 'memory', score: state.score, correct: state.correct, total: state.total }, { back: 'games/memory' });
    }
    nextRoom();
  }

  S50.Games.register({ id: 'wherekept', cat: 'memory', start: start });
})();

    var done = {};
    F.people.forEach(function (p) {
      if (p.spouse !== null && !done[p.id]) {
        var sp = F.get(p.spouse);
        done[p.id] = done[sp.id] = true;
        var m = p.g === 'm' ? p : sp, f = p.g === 'm' ? sp : p;
        out.push({ k: 'married', text: t('family.married', { a: nameOf(m), b: nameOf(f) }), order: Math.min(p.id, sp.id) * 2 });
      }
      if (p.parents.length) {
        var pp = F.parents(p);
        out.push({ k: 'child', order: p.id * 2 + 1, text: t(p.g === 'm' ? 'family.childOf' : 'family.childOfF', { c: nameOf(p), a: nameOf(pp[0]), b: nameOf(pp[1]), rel: t(p.g === 'm' ? 'family.son' : 'family.daughter') }) });
      }
    });
    return out.sort(function (a, b) { return a.order - b.order; });
  }

  var SIMPLE = ['husband', 'wife', 'father', 'mother', 'son', 'daughter'];
  function pickQuestions(F, n, hard) {
    var pairs = [];
    F.people.forEach(function (a) {
      F.people.forEach(function (b) {
        if (a === b) return;
        var r = relation(F, a, b);
        if (r) pairs.push({ a: a, b: b, r: r, simple: SIMPLE.indexOf(r.en) >= 0 });
      });
    });
    var complex = U.shuffle(pairs.filter(function (p) { return !p.simple; }));
    var simple = U.shuffle(pairs.filter(function (p) { return p.simple; }));
    var wantComplex = hard ? n : Math.ceil(n / 2);
    var chosen = [];
    var usedTerms = {};
    function take(list, max) {
      list.forEach(function (p) {
        if (chosen.length >= n || max <= 0) return;
        if (chosen.some(function (c) { return (c.a === p.a && c.b === p.b) || (c.a === p.b && c.b === p.a); })) return;
        if (usedTerms[p.r.en] && list.length > n) return;
        usedTerms[p.r.en] = true; chosen.push(p); max -= 1;
      });
    }
    take(complex, wantComplex);
    take(simple, n);
    take(complex, n);
    return U.shuffle(chosen).slice(0, n);
  }

  function toItem(F, q, idx) {
    var correct = relText(q.r);
    var pool = TERMS[q.a.g][S50.lang === 'hi' ? 'hi' : 'en'].map(function (k) { return t('rel.' + k); });
    var opts = [correct];
    U.shuffle(pool).forEach(function (x) { if (opts.length < 4 && opts.indexOf(x) < 0) opts.push(x); });
    opts = U.shuffle(opts);
    var qKey = S50.lang === 'hi' ? (q.a.g === 'm' ? 'family.qM' : 'family.qF') : 'family.q';
    var eKey = S50.lang === 'hi' ? (q.a.g === 'm' ? 'family.eM' : 'family.eF') : 'family.e';
    return {
      id: 'FT' + idx, category: 'reasoning', difficulty: q.simple ? 1 : 2, tags: ['family'],
      question: t(qKey, { a: nameOf(q.a), b: nameOf(q.b) }), options: opts, correctAnswer: opts.indexOf(correct),
      explanation: t(eKey, { a: nameOf(q.a), b: nameOf(q.b), rel: S50.lang === 'hi' ? correct : correct.toLowerCase() }), noShuffle: true
    };
  }

  function factsCard(F) {
    return h('div', { class: 'card family-card' },
      h('h2', { class: 'card-title', text: '🌳 ' + t('family.facts') }),
      h('div', { class: 'chip-row' }, F.people.map(function (p) { return h('span', { class: 'chip person ' + p.g, text: (p.g === 'm' ? '👨 ' : '👩 ') + nameOf(p) }); })),
      h('ul', { class: 'facts' }, facts(F).map(function (f) { return h('li', { text: f.text }); })));
  }

  function start() {
    var level = Store.gameLevel('familytree');
    var size = level <= 2 ? 1 : level === 3 ? 2 : 3;
    var ROUNDS = 2, PER = 4;
    var families = [build(size), build(Math.min(3, size + (level >= 2 ? 1 : 0)))];
    var items = [];
    var famOf = [];
    families.forEach(function (F, fi) {
      pickQuestions(F, PER, level >= 4).forEach(function (q, qi) { items.push(toItem(F, q, fi * 10 + qi)); famOf.push(fi); });
    });
    UI.runQuiz({
      gameId: 'familytree', title: t('games.familytree.name'), icon: S50.GAME_ICON.familytree, cat: 'reasoning', items: items, noShuffle: true,
      back: 'games/reasoning', timeLimit: 90,
      beforeQuestion: function (item, wrap, state) {
        var fi = famOf[state.i];
        wrap.appendChild(h('p', { class: 'hint', text: t('family.round', { n: fi + 1, total: ROUNDS }) + ' — ' + t('family.intro') }));
        wrap.appendChild(factsCard(families[fi]));
      },
      onFinish: function (res) {
        if (res.correct >= res.total - 1 && level < 5) Store.setGameLevel('familytree', level + 1);
        UI.complete(res, { back: 'games/reasoning' });
      }
    });
  }

  S50.Games.register({ id: 'familytree', cat: 'reasoning', start: start });
  S50.FamilyTree = { relation: relation, build: build };
})();
